    // Expand varieties into full plant entries (inherit timing from parent crop)
    const VARIETY_LIBRARY = (() => {
      const out = [];
      Object.keys(VARIETY_RAW).forEach(cropId => {
        const parent = PLANT_LIBRARY.find(p => p.id === cropId);
        if (!parent) return;
        VARIETY_RAW[cropId].forEach(([slug, vname, sources]) => {
          out.push({
            ...parent,
            id: `${cropId}__${slug}`,
            name: `${parent.name} — ${vname}`,
            variety: vname,
            cropId,
            cropName: parent.name,
            sources,
            isVariety: true,
          });
        });
      });
      return out;
    })();

    // Full selectable library: base crops + varieties
    const FULL_PLANT_LIBRARY = [...PLANT_LIBRARY, ...VARIETY_LIBRARY];

    /** Live list of user-added varieties — kept in sync so resolvePlant works even when callers omit the 2nd arg */
    let _customPlantsLive = [];
    function syncCustomPlantsLive(list) {
      _customPlantsLive = Array.isArray(list) ? list : [];
    }

    function resolvePlant(id, customPlants) {
      if (!id) return null;
      const customs = (customPlants && customPlants.length) ? customPlants : _customPlantsLive;
      const found = FULL_PLANT_LIBRARY.find(p => p.id === id)
        || PLANT_LIBRARY.find(p => p.id === id)
        || (customs || []).find(p => p.id === id)
        || null;
      if (found) {
        // Ensure variety objects always have display fields
        if (found.isVariety && !found.variety && found.name) {
          const parts = String(found.name).split("—");
          if (parts.length > 1) {
            return { ...found, variety: parts.slice(1).join("—").trim(), cropName: found.cropName || parts[0].trim() };
          }
        }
        return found;
      }
      // Recover custom / mine ids when entry was lost or id pattern is crop_mine_ / crop__mine_
      const sid = String(id);
      const m = sid.match(/^([a-z0-9-]+)(?:__mine_|_mine_|__)(.+)$/i);
      if (m) {
        const parent = PLANT_LIBRARY.find(p => p.id === m[1]) || FULL_PLANT_LIBRARY.find(p => p.id === m[1]);
        if (parent) {
          let varietyLabel = m[2].replace(/^\d+$/, "").replace(/[-_]+/g, " ").trim();
          if (!varietyLabel || /^\d+$/.test(m[2])) varietyLabel = "My variety";
          return {
            ...parent,
            id,
            name: `${parent.name} — ${varietyLabel}`,
            variety: varietyLabel,
            cropId: parent.id,
            cropName: parent.name,
            isVariety: true,
            isCustom: true,
            sources: "Mine",
          };
        }
      }
      return null;
    }

    // Frost-based planting schedule for a crop
    function computePlantingSchedule(plant, profile, baseDate) {
      const lastFrost = profile?.lastFrost
        ? new Date(profile.lastFrost + "T12:00:00")
        : addDays(new Date(), 30);
      const pl = typeof plant === "string"
        ? (resolvePlant(plant) || PLANT_LIBRARY.find(p => p.id === plant))
        : plant;
      if (!pl) return null;
      const sow = pl.method === "indoor" && pl.startWeeksBeforeFrost > 0
        ? addDays(lastFrost, -pl.startWeeksBeforeFrost * 7)
        : (pl.startWeeksBeforeFrost > 0
          ? addDays(lastFrost, -pl.startWeeksBeforeFrost * 7)
          : addDays(lastFrost, pl.method === "direct" ? 7 : 0));
      const transplant = pl.method === "indoor" && pl.transplantWeeksBeforeFrost != null
        ? addDays(lastFrost, -pl.transplantWeeksBeforeFrost * 7)
        : null;
      const plantOut = transplant || (pl.method === "direct" ? sow : lastFrost);
      const harvestStart = addDays(plantOut, pl.daysToHarvest || 60);
      const harvestEnd = addDays(harvestStart, Math.min(30, Math.round((pl.daysToHarvest || 60) * 0.3)));
      return {
        plantId: pl.id,
        method: pl.method || "direct",
        sowDate: toISODate(sow),
        transplantDate: transplant ? toISODate(transplant) : null,
        plantOutDate: toISODate(plantOut),
        harvestStart: toISODate(harvestStart),
        harvestEnd: toISODate(harvestEnd),
        successionDays: pl.successionDays || 0,
      };
    }

    function bedCapacity(bed, spacingIn) {
      const w = Number(bed.widthFt) || 4;
      const l = Number(bed.lengthFt) || 8;
      const space = Math.max(Number(spacingIn) || 12, 2) / 12; // feet
      const cols = Math.max(1, Math.floor(w / space));
      const rows = Math.max(1, Math.floor(l / space));
      return cols * rows;
    }

    function getPlant(id, customPlants) {
      return resolvePlant(id, customPlants);
    }

    // Date helpers
    const addDays = (date, days) => {
      const d = new Date(date);
      d.setDate(d.getDate() + days);
      return d;
    };
    const fmtDate = (d) => {
      if (!d) return "";
      const x = d instanceof Date ? d : new Date(d);
      return x.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    };
    const toISODate = (d) => {
      const x = d instanceof Date ? d : new Date(d);
      return x.toISOString().slice(0, 10);
    };

    /** Next care due on or after today, stepping from planted date by interval days */
    function nextIntervalDue(plantedISO, intervalDays, fromDate = new Date()) {
      if (!intervalDays || intervalDays <= 0 || !plantedISO) return null;
      const planted = new Date(plantedISO + "T12:00:00");
      if (isNaN(planted)) return null;
      const today = new Date(fromDate);
      today.setHours(12, 0, 0, 0);
      let due = addDays(planted, intervalDays);
      let guard = 0;
      while (due < today && guard < 200) {
        due = addDays(due, intervalDays);
        guard++;
      }
      return toISODate(due);
    }

    /** Growing season from last spring frost → first fall frost (zone calendar) */
    function growingSeasonBounds(profile, refDate = new Date()) {
      const y = refDate.getFullYear();
      const parseFrost = (iso, fallbackMD) => {
        if (iso && /^\d{4}-\d{2}-\d{2}/.test(iso)) {
          const m = iso.slice(5, 7);
          const d = iso.slice(8, 10);
          return new Date(`${y}-${m}-${d}T12:00:00`);
        }
        const [mm, dd] = fallbackMD;
        return new Date(y, mm - 1, dd, 12, 0, 0);
      };
      let seasonStart = parseFrost(profile?.lastFrost, [4, 15]);
      let seasonEnd = parseFrost(profile?.firstFrost, [10, 25]);
      // If first frost is before last frost in calendar year, end is next year (unusual)
      if (seasonEnd < seasonStart) seasonEnd = addDays(seasonEnd, 365);
      return {
        seasonStart,
        seasonEnd,
        seasonStartISO: toISODate(seasonStart),
        seasonEndISO: toISODate(seasonEnd),
      };
    }

    function clampDateISO(iso, minISO, maxISO) {
      if (!iso) return iso;
      let x = iso;
      if (minISO && x < minISO) x = minISO;
      if (maxISO && x > maxISO) x = maxISO;
      return x;
    }

    /**
     * Seedtime-style completion window around an ideal due date.
     * before/after = days; optional clamp to growing season.
     */
    function makeTaskWindow(idealDueISO, beforeDays, afterDays, profile, clampSeason = true) {
      if (!idealDueISO) return { due: null, windowStart: null, windowEnd: null };
      const ideal = new Date(idealDueISO + "T12:00:00");
      let start = addDays(ideal, -Math.max(0, beforeDays || 0));
      let end = addDays(ideal, Math.max(0, afterDays || 0));
      let dueISO = idealDueISO;
      let startISO = toISODate(start);
      let endISO = toISODate(end);
      if (clampSeason && profile) {
        const { seasonStartISO, seasonEndISO } = growingSeasonBounds(profile, ideal);
        startISO = clampDateISO(startISO, seasonStartISO, seasonEndISO);
        endISO = clampDateISO(endISO, seasonStartISO, seasonEndISO);
        dueISO = clampDateISO(dueISO, startISO, endISO);
        if (endISO < startISO) {
          startISO = seasonStartISO;
          endISO = seasonEndISO;
          dueISO = clampDateISO(idealDueISO, startISO, endISO);
        }
      }
      return { due: dueISO, windowStart: startISO, windowEnd: endISO };
    }

    function fmtWindow(startISO, endISO, dueISO) {
      if (startISO && endISO && startISO !== endISO) {
        const ideal = dueISO && dueISO !== startISO ? ` · ideal ${fmtDate(dueISO)}` : "";
        return `${fmtDate(startISO)} – ${fmtDate(endISO)}${ideal}`;
      }
      if (dueISO) return `Due ${fmtDate(dueISO)}`;
      return "";
    }

    function careScheduleFromPlantDate(plantInfo, plantedAtISO, profile) {
      if (!plantInfo || !plantedAtISO) return {};
      const planted = new Date(plantedAtISO + "T12:00:00");
      const today = new Date();
      today.setHours(12, 0, 0, 0);
      const germIdeal = plantInfo.germDays
        ? toISODate(addDays(planted, plantInfo.germDays))
        : null;
      const fertIdeal = plantInfo.fertilizeEveryDays > 0
        ? nextIntervalDue(plantedAtISO, plantInfo.fertilizeEveryDays, today)
        : null;
      const harvestIdeal = plantInfo.daysToHarvest && plantInfo.daysToHarvest < 400
        ? toISODate(addDays(planted, plantInfo.daysToHarvest))
        : null;
      // Harvest window spans ~20–30% of days-to-harvest after ideal start
      const harvestSpan = plantInfo.daysToHarvest
        ? Math.min(35, Math.max(10, Math.round(plantInfo.daysToHarvest * 0.25)))
        : 14;
      const germWin = germIdeal
        ? makeTaskWindow(germIdeal, Math.min(2, plantInfo.germDays || 2), 5, profile, false)
        : {};
      // Don't start germ window before plant date
      if (germWin.windowStart && germWin.windowStart < plantedAtISO) {
        germWin.windowStart = plantedAtISO;
      }
      const fertAfter = plantInfo.fertilizeEveryDays
        ? Math.min(14, Math.max(5, Math.floor(plantInfo.fertilizeEveryDays / 3)))
        : 7;
      const fertWin = fertIdeal
        ? makeTaskWindow(fertIdeal, 3, fertAfter, profile, true)
        : {};
      const harvestWin = harvestIdeal
        ? makeTaskWindow(harvestIdeal, 5, harvestSpan, profile, true)
        : {};
      return {
        germDue: germWin.due || germIdeal,
        fertDue: fertWin.due || fertIdeal,
        harvestDue: harvestWin.due || harvestIdeal,
        germWin,
        fertWin,
        harvestWin,
        planted,
      };
    }

    function plantDisplayName(plantInfo, opts = {}) {
      if (!plantInfo) return opts.fallbackId ? String(opts.fallbackId).replace(/_/g, " ") : "Plant";
      const withCrop = opts.withCrop !== false;
      if (plantInfo.variety) {
        const crop = plantInfo.cropName
          || (plantInfo.name && plantInfo.name.includes("—") ? plantInfo.name.split("—")[0].trim() : "")
          || "";
        if (withCrop && crop) return `${plantInfo.variety} (${crop})`;
        return plantInfo.variety;
      }
      if (plantInfo.name && plantInfo.name.includes("—")) {
        return withCrop ? plantInfo.name : plantInfo.name.split("—").slice(1).join("—").trim();
      }
      return plantInfo.name || opts.fallbackId || "Plant";
    }

    /** Resolve + display name for any plant id (library, variety, or custom) */
    function plantNameForId(id, customPlants, opts = {}) {
      const pl = resolvePlant(id, customPlants);
      return plantDisplayName(pl, { ...opts, fallbackId: id });
    }

    /**
     * Build care tasks from a real plant date with Seedtime-style windows.
     * Windows are clamped to zone growing season (last frost → first frost) where relevant.
     */
    function buildCareTasksForPlanting(plantInfo, plantedAtISO, opts = {}) {
      const { bedName, year, profile } = opts;
      const name = plantDisplayName(plantInfo);
      const sched = careScheduleFromPlantDate(plantInfo, plantedAtISO, profile);
      const { germDue, fertDue, harvestDue, germWin, fertWin, harvestWin } = sched;
      const todayISO = toISODate(new Date());
      const tasks = [];
      const pushWin = (kind, title, icon, ideal, win, extraDetail) => {
        if (!ideal && !win?.due) return;
        const due = win?.due || ideal;
        const windowStart = win?.windowStart || due;
        const windowEnd = win?.windowEnd || due;
        // Skip if entire window already past (except recent harvest)
        if (windowEnd < todayISO && kind !== "harvest") return;
        if (kind === "harvest" && windowEnd < todayISO) {
          const daysPast = Math.round((new Date(todayISO + "T12:00:00") - new Date(windowEnd + "T12:00:00")) / 86400000);
          if (daysPast > 14) return;
        }
        const winLabel = fmtWindow(windowStart, windowEnd, due);
        tasks.push({
          kind,
          title,
          plants: [name],
          detail: [name, bedName, extraDetail, winLabel].filter(Boolean).join(" · "),
          done: false,
          icon,
          due,
          windowStart,
          windowEnd,
          year,
        });
      };
      if (germDue) {
        pushWin("germ", "Check germination", "🌱", germDue, germWin, `planted ${plantedAtISO}`);
      }
      if (fertDue) {
        pushWin(
          "fert",
          "Fertilize garden",
          "🧪",
          fertDue,
          fertWin,
          plantInfo.fertilizeEveryDays ? `every ~${plantInfo.fertilizeEveryDays}d` : null
        );
      }
      if (harvestDue || harvestWin?.due) {
        pushWin(
          "harvest",
          "Harvest window",
          "🧺",
          harvestDue,
          harvestWin,
          plantInfo.daysToHarvest ? `~${plantInfo.daysToHarvest}d from plant` : null
        );
      }
      return tasks;
    }

    /** Merge same-kind + overlapping windows into one (list all plant varieties) */
    function mergeCareTasksInto(prevTasks, incoming) {
      const next = [...(prevTasks || [])];
      const kindTitle = { germ: "Check germination", fert: "Fertilize garden", harvest: "Harvest window", water: "Water garden" };
      incoming.forEach(t => {
        const kind = t.kind || "care";
        const due = t.due || "";
        const wStart = t.windowStart || due;
        const wEnd = t.windowEnd || due;
        const idx = next.findIndex(x => {
          if (x.done || (x.kind || "") !== kind) return false;
          // Merge if same due day or overlapping windows
          if ((x.due || "") === due) return true;
          const xs = x.windowStart || x.due || "";
          const xe = x.windowEnd || x.due || "";
          if (!xs || !wStart) return false;
          return xs <= wEnd && wStart <= xe;
        });
        const plants = Array.isArray(t.plants) ? t.plants : (t.plants ? [t.plants] : []);
        if (idx >= 0) {
          const existing = next[idx];
          const set = new Set([...(existing.plants || []), ...plants]);
          const plantList = [...set];
          const windowStart = [existing.windowStart || existing.due, wStart].filter(Boolean).sort()[0];
          const windowEnd = [existing.windowEnd || existing.due, wEnd].filter(Boolean).sort().slice(-1)[0];
          next[idx] = {
            ...existing,
            plants: plantList,
            title: kindTitle[kind] || existing.title || t.title,
            detail: `${plantList.join(", ")} · ${fmtWindow(windowStart, windowEnd, due || existing.due)}`,
            icon: t.icon || existing.icon,
            kind,
            due: due || existing.due,
            windowStart,
            windowEnd,
          };
        } else {
          const plantList = plants;
          next.unshift({
            ...t,
            id: t.id || (Date.now() + Math.random()),
            plants: plantList,
            title: kindTitle[kind] || t.title,
            detail: plantList.length
              ? `${plantList.join(", ")} · ${fmtWindow(wStart, wEnd, due)}`
              : (t.detail || ""),
            kind,
            due,
            windowStart: wStart,
            windowEnd: wEnd,
          });
        }
      });
      return next;
    }

    // Weekly Garden Brief — auto actions from climate, plantings, vault, rotation
    function resolveBedList(beds) {
      return (beds && beds.length) ? beds : DEFAULT_BEDS;
    }
    function isContainer(b) {
      return b && (b.kind === "container" || b.type === "container");
    }
    function groundBeds(beds) {
      return resolveBedList(beds).filter(b => !isContainer(b));
    }
    function containerBeds(beds) {
      return resolveBedList(beds).filter(b => isContainer(b));
    }
    function bedsOnMap(beds) {
      return resolveBedList(beds).filter(b => {
        if (isContainer(b)) return b.showOnMap === true;
        return b.showOnMap !== false;
      });
    }
    function bedLabel(beds, bedId) {
      if (!bedId) return "";
      const b = resolveBedList(beds).find(x => x.id === bedId);
      if (b?.name) return isContainer(b) ? `${b.name} (pot)` : b.name;
      if (String(bedId).startsWith("pot_") || String(bedId).startsWith("container_")) return "Container";
      if (String(bedId).startsWith("bed_")) return "Custom bed";
      return String(bedId).replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
    }

    function buildWeeklyBrief({ placed, seeds, profile, rotationHistory, tasks, beds }) {
      const today = new Date();
      today.setHours(12, 0, 0, 0);
      const weekEnd = addDays(today, 7);
      const bedList = resolveBedList(beds);
      const items = [];
      const existingTitles = new Set((tasks || []).filter(t => !t.done).map(t => (t.title || "").toLowerCase()));

      const push = (item) => {
        const key = (item.title || "").toLowerCase();
        if (existingTitles.has(key)) return;
        if (items.some(i => i.title.toLowerCase() === key)) return;
        items.push(item);
      };

      // Frost window (profile dates within 7 days)
      if (profile?.lastFrost) {
        const lf = new Date(profile.lastFrost + "T12:00:00");
        const diff = Math.round((lf - today) / 86400000);
        if (diff >= 0 && diff <= 7) {
          push({
            id: "brief-last-frost",
            title: "Last spring frost approaching",
            detail: `${fmtDate(lf)} · harden off / hold tender transplants`,
            icon: "❄️",
            priority: "high",
            source: "climate",
          });
        }
      }
      if (profile?.firstFrost) {
        const ff = new Date(profile.firstFrost + "T12:00:00");
        const diff = Math.round((ff - today) / 86400000);
        if (diff >= 0 && diff <= 14) {
          push({
            id: "brief-first-frost",
            title: "First fall frost within 2 weeks",
            detail: `${fmtDate(ff)} · harvest tender crops, cover beds`,
            icon: "🧊",
            priority: "high",
            source: "climate",
          });
        }
      }

      // Planted crops: group same-day care by kind (one brief item, many varieties)
      const briefBuckets = {}; // key kind|dueISO -> { names, due, icon, priority }
      const addBriefBucket = (kind, dueDate, name, icon, priority) => {
        if (!dueDate || !name) return;
        const dueISO = toISODate(dueDate);
        const key = `${kind}|${dueISO}`;
        if (!briefBuckets[key]) briefBuckets[key] = { kind, dueISO, dueDate, names: [], icon, priority };
        if (!briefBuckets[key].names.includes(name)) briefBuckets[key].names.push(name);
      };
      (placed || []).forEach(item => {
        if (item.status === "harvested" || !item.plantedAt) return;
        const pl = resolvePlant(item.plant) || PLANT_LIBRARY.find(p => p.id === item.plant);
        if (!pl) return;
        const label = plantDisplayName(pl);
        const { germDue, fertDue, harvestDue, germWin, fertWin, harvestWin } =
          careScheduleFromPlantDate(pl, item.plantedAt, profile);
        const inWin = (win, idealISO, horizonDays) => {
          const start = win?.windowStart || idealISO;
          const end = win?.windowEnd || idealISO;
          if (!start || !end) return false;
          // Active or starting within horizon
          return end >= toISODate(today) && start <= toISODate(addDays(today, horizonDays));
        };
        if (fertDue && inWin(fertWin, fertDue, 7)) {
          const d = new Date((fertWin?.due || fertDue) + "T12:00:00");
          addBriefBucket("fert", d, label, "🧪", "med");
        }
        if (harvestDue && inWin(harvestWin, harvestDue, 14)) {
          const d = new Date((harvestWin?.due || harvestDue) + "T12:00:00");
          addBriefBucket("harvest", d, label, "🧺", "med");
        }
        if (germDue && inWin(germWin, germDue, 7)) {
          const d = new Date((germWin?.due || germDue) + "T12:00:00");
          addBriefBucket("germ", d, label, "🌱", "low");
        }
      });
      Object.values(briefBuckets).forEach(b => {
        const titleMap = { fert: "Fertilize garden", harvest: "Harvest window", germ: "Check germination" };
        push({
          id: `brief-${b.kind}-${b.dueISO}`,
          title: titleMap[b.kind] || b.kind,
          detail: `${b.names.join(", ")} · ${fmtDate(b.dueDate)}`,
          icon: b.icon,
          priority: b.priority,
          source: "care",
          kind: b.kind,
          plants: b.names,
          due: b.dueISO,
        });
      });

      // Low seed stock
      (seeds || []).filter(s => s.low || s.qty <= 3).forEach(s => {
        push({
          id: `brief-seed-${s.id}`,
          title: `Restock ${s.name}`,
          detail: `Only ${s.qty} left in vault`,
          icon: "📦",
          priority: "med",
          source: "vault",
        });
      });

      // Rotation risk from live beds + history
      const year = today.getFullYear();
      bedList.forEach(bed => {
        const hist = (rotationHistory && rotationHistory[bed.id]) || [];
        const recentFamilies = new Set();
        hist.forEach(h => {
          if (year - h.year < ROTATION_YEARS) (h.families || []).forEach(f => recentFamilies.add(f));
        });
        const liveFamilies = (placed || [])
          .filter(p => p.bed === bed.id && p.status !== "harvested")
          .map(p => (resolvePlant(p.plant) || PLANT_LIBRARY.find(x => x.id === p.plant))?.family)
          .filter(Boolean);
        const conflicts = liveFamilies.filter(f => recentFamilies.has(f));
        if (conflicts.length) {
          push({
            id: `brief-rot-${bed.id}`,
            title: `Rotation risk: ${bed.name}`,
            detail: `Same family within ${ROTATION_YEARS} years — consider swapping next season`,
            icon: "🔄",
            priority: "low",
            source: "rotation",
          });
        }
      });

      // Empty in-ground beds only (containers are optional pots around the property)
      bedList.filter(b => !isContainer(b)).forEach(bed => {
        const count = (placed || []).filter(p => p.bed === bed.id && p.status !== "harvested" && !p.isCoverCrop && !p.isBedPrep).length;
        if (count === 0) {
          push({
            id: `brief-empty-${bed.id}`,
            title: `${bed.name} is empty`,
            detail: "Open Layout to plant something",
            icon: "🪴",
            priority: "low",
            source: "layout",
          });
        }
      });

      const order = { high: 0, med: 1, low: 2 };
      return items.sort((a, b) => (order[a.priority] ?? 9) - (order[b.priority] ?? 9)).slice(0, 8);
    }

    function requestNotifyPermission() {
      if (!("Notification" in window)) return Promise.resolve("denied");
      if (Notification.permission === "granted") return Promise.resolve("granted");
      if (Notification.permission === "denied") return Promise.resolve("denied");
      return Notification.requestPermission();

    function cropKeyOf(idOrPlant) {
      if (!idOrPlant) return "";
      if (typeof idOrPlant === "object") return idOrPlant.cropId || idOrPlant.id || "";
      const pl = resolvePlant(idOrPlant);
      return pl?.cropId || idOrPlant;
    }

    function companionPairKey(a, b) {
      return [cropKeyOf(a), cropKeyOf(b)].sort().join("|");
    }

    function getRelation(a, b) {
      const x = cropKeyOf(a);
      const y = cropKeyOf(b);
      if (!x || !y || x === y) return 0;
      const listed = COMPANION_MATRIX[x]?.[y] ?? COMPANION_MATRIX[y]?.[x];
      if (listed != null) return listed;
      const pa = resolvePlant(x) || PLANT_LIBRARY.find(p => p.id === x);
      const pb = resolvePlant(y) || PLANT_LIBRARY.find(p => p.id === y);
      if (!pa || !pb) return 0;
      // Family-level rules when no explicit pair is listed
      if ((pa.id === "fennel" || pb.id === "fennel") && pa.id !== pb.id) return -1;
      if (pa.family === "Amaryllidaceae" && pb.family === "Fabaceae") return -1;
      if (pb.family === "Amaryllidaceae" && pa.family === "Fabaceae") return -1;
      if (pa.family === "Solanaceae" && pb.family === "Brassicaceae") return -1;
      if (pb.family === "Solanaceae" && pa.family === "Brassicaceae") return -1;
      if ((pa.id === "strawberry" && (pb.family === "Brassicaceae" || pb.family === "Solanaceae"))
        || (pb.id === "strawberry" && (pa.family === "Brassicaceae" || pa.family === "Solanaceae"))) return -1;
      if (pa.family === "Solanaceae" && pb.family === "Solanaceae") {
        // Potato with any nightshade is high risk; other nightshades are caution (-1)
        return -1;
      }
      if (pa.family === "Cucurbitaceae" && pb.family === "Cucurbitaceae" && pa.id !== pb.id) {
        // Same-family cucurbits share beetles and wilt — mild avoid
        return -1;
      }
      if ((pa.id === "asparagus" && pb.family === "Amaryllidaceae")
        || (pb.id === "asparagus" && pa.family === "Amaryllidaceae")) return -1;
      return 0;
    }

    function companionWhy(a, b) {
      const key = companionPairKey(a, b);
      if (COMPANION_WHY[key]) return COMPANION_WHY[key];
      const pa = resolvePlant(cropKeyOf(a)) || PLANT_LIBRARY.find(p => p.id === cropKeyOf(a));
      const pb = resolvePlant(cropKeyOf(b)) || PLANT_LIBRARY.find(p => p.id === cropKeyOf(b));
      const rel = getRelation(a, b);
      if (!pa || !pb) return rel < 0 ? "These two are a traditionally poor pairing in the same bed." : "No strong pairing notes on file.";
      if (rel < 0) {
        if ((pa.family === "Amaryllidaceae" && pb.family === "Fabaceae") || (pb.family === "Amaryllidaceae" && pa.family === "Fabaceae")) {
          return "Alliums (onion family) can suppress the nitrogen-fixing bacteria legumes need. Keep onions/garlic/leeks away from beans and peas.";
        }
        if (pa.family === "Solanaceae" && pb.family === "Solanaceae") {
          return "Both are nightshades. They share blight, wilt, and hornworms — crowding them stacks disease and makes crop rotation harder.";
        }
        if ((pa.family === "Solanaceae" && pb.family === "Brassicaceae") || (pb.family === "Solanaceae" && pa.family === "Brassicaceae")) {
          return "Nightshades and brassicas are both heavy feeders; brassicas can stunt tomatoes and peppers. Plant them in different beds.";
        }
        if (pa.family === "Cucurbitaceae" && pb.family === "Cucurbitaceae") {
          return "Cucurbits (squash, cucumber, melon) share cucumber beetles and wilt. Spreading them across the garden slows pest buildup.";
        }
        if (pa.id === "strawberry" || pb.id === "strawberry") {
          return "Strawberries are long-lived and sensitive to Verticillium from nightshades and brassicas. Keep a dedicated berry bed.";
        }
        if (pa.id === "fennel" || pb.id === "fennel") {
          return "Fennel is allelopathic: roots release compounds that stunt many vegetables. Grow fennel in its own pot.";
        }
        if (pa.family === pb.family) {
          return `Same plant family (${pa.familyName || pa.family}). They often share pests and diseases and mine the same nutrients. Split them across beds when you can.`;
        }
        return `${pa.name} and ${pb.name} are a traditional “avoid” pairing — they compete for water or nutrients, or one inhibits the other.`;
      }
      if (rel > 0) {
        return `${pa.name} and ${pb.name} are a strong companion pair — similar needs, pest help, nitrogen, shade, or soil structure.`;
      }
      return `${pa.name} and ${pb.name} are neutral together. Not harmful, not a standout team.`;
    }

    function betterCompanionsFor(plantId, limit = 4) {
      const key = cropKeyOf(plantId);
      return PLANT_LIBRARY
        .filter(p => p.id !== key)
        .map(p => ({ p, rel: getRelation(key, p.id) }))
        .filter(x => x.rel > 0)
        .sort((a, b) => b.rel - a.rel)
        .slice(0, limit)
        .map(x => x.p);
    }

    function plantsNeededForIngredient(ing) {
      const y = Number(ing.yieldPerPlant) || 1;
      const a = Number(ing.amount) || 0;
      return Math.max(1, Math.ceil(a / y));
    }

    function growListFromRecipes(recipeIds) {
      const map = {};
      recipeIds.forEach(rid => {
        const r = RECIPE_LIBRARY.find(x => x.id === rid);
        if (!r) return;
        r.ingredients.forEach(ing => {
          if (!map[ing.plantId]) map[ing.plantId] = { plantId: ing.plantId, plants: 0, recipes: [] };
          map[ing.plantId].plants = Math.max(map[ing.plantId].plants, plantsNeededForIngredient(ing));
          if (!map[ing.plantId].recipes.includes(r.name)) map[ing.plantId].recipes.push(r.name);
        });
      });
      return Object.values(map);
    }

              <div>
                <p className="font-bold text-sage-800 tracking-tight">PlotPilot</p>
                <p className="text-[10px] text-sage-500">Garden command center</p>
              </div>
            </div>
          </div>
          <nav className="flex-1 overflow-y-auto py-3 px-2 space-y-0.5">
            {main.map(item => <NavBtn key={item.id} item={item} />)}
            <div className="my-2 border-t border-sage-100" />
            {footer.map(item => <NavBtn key={item.id} item={item} />)}
          </nav>
          {(profile?.zone || profile?.lastFrost) && (
            <div className="p-3 border-t border-sage-100 text-[10px] text-sage-500 leading-snug">
              {profile.zone && <p>Zone <strong className="text-sage-700">{profile.zone}</strong></p>}
              {profile.lastFrost && <p>Last frost {profile.lastFrost}</p>}
              {profile.firstFrost && <p>First frost {profile.firstFrost}</p>}
            </div>
          )}
        </aside>
      );
    }

    function MoreScreen({ setActive, profile, exportData }) {
      const slots = getNavSlots(profile);
      const links = [
        ...TAB_CATALOG.filter(t => !slots.includes(t.id)),
        { id: "settings", icon: "fa-cog", label: "Settings", desc: "Zone, tabs, frost, backup" },
      ];
      return (
        <div className="pb-24">
          <Header title="More" />
          <div className="px-4 pt-4 space-y-2">
            {profile?.zone && (
              <div className="bg-sage-100 rounded-xl p-3 text-xs text-sage-700 mb-3">
                Zone <strong>{profile.zone}</strong>
                {profile.lastFrost && <> · Last frost {profile.lastFrost}</>}
                {profile.firstFrost && <> · First frost {profile.firstFrost}</>}
              </div>
            )}
            {slots.length > 0 && (
              <p className="text-[10px] text-sage-400 px-1">Tabs on your bar: {slots.map(id => tabMeta(id).label).join(" · ")}. Change under Settings.</p>
            )}
            {links.map(l => (
              <button
                key={l.id}
                type="button"
                onClick={() => setActive(l.id)}
                className="w-full bg-white rounded-2xl p-4 card-shadow flex items-center gap-4 text-left hover:bg-sage-50 transition"
              >
                <div className="w-10 h-10 rounded-xl bg-sage-100 flex items-center justify-center text-sage-600">
                  <i className={`fas ${l.icon}`}></i>
                </div>
                <div className="flex-1">
                  <p className="font-semibold text-sage-800">{l.label}</p>
                  <p className="text-xs text-sage-500">{l.desc}</p>
                </div>
                <i className="fas fa-chevron-right text-sage-300 text-sm"></i>
              </button>
            ))}
            <button
              type="button"
              onClick={exportData}
              className="w-full mt-4 py-3 rounded-xl border border-sage-300 text-sage-700 text-sm font-medium"
            >
              📥 Export backup (JSON)
            </button>
          </div>
        </div>
      );
    }

    function Header({ title, right }) {
      return (
        <header className="sticky top-0 z-40 bg-sage-50/95 backdrop-blur border-b border-sage-100 px-4 lg:px-8 py-3 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <span className="text-sage-600 text-xl lg:hidden">🌱</span>
            <h1 className="font-semibold text-sage-800 text-lg lg:text-xl">{title}</h1>
          </div>
          {right}
        </header>
      );
    }

    // ========== SCREENS ==========
    // Weather code → icon + label (WMO)
    const weatherIcon = (code) => {
      if (code === 0) return { icon: "☀️", label: "Clear" };
      if (code <= 3) return { icon: "⛅", label: "Partly cloudy" };
      if (code <= 48) return { icon: "🌫️", label: "Foggy" };
      if (code <= 67) return { icon: "🌧️", label: "Rain" };
      if (code <= 77) return { icon: "🌨️", label: "Snow" };
      if (code <= 82) return { icon: "🌦️", label: "Showers" };
      if (code <= 99) return { icon: "⛈️", label: "Thunderstorm" };
      return { icon: "🌡️", label: "—" };
    };

    function Dashboard({ tasks, setTasks, seeds, placed, setActive, journal, customPlants, profile, rotationHistory, beds }) {
      const lowStock = seeds.filter(s => s.low || s.qty <= 3).length;
      const toggleTask = (id) => {
        setTasks(prev => prev.map(t => {
          if (t.id !== id) return t;
          if (t.done) {
            // Undo — reopen task
            const { completedAt, ...rest } = t;
            return { ...rest, done: false };
          }
          return { ...t, done: true, completedAt: new Date().toISOString() };
        }));
      };
      const undoTask = (id) => {
        setTasks(prev => prev.map(t => {
          if (t.id !== id) return t;
          const { completedAt, ...rest } = t;
          return { ...rest, done: false };
        }));
      };
      const [expandToday, setExpandToday] = useState(false);
      const [expandOverdue, setExpandOverdue] = useState(false);
      const [expandDone, setExpandDone] = useState(false);
      const TASK_PREVIEW = 4;

      const todayISO = toISODate(new Date());
      const taskLists = useMemo(() => {
        const open = (tasks || []).filter(t => !t.done);
        const endOf = (t) => t.windowEnd || t.due || "";
        const startOf = (t) => t.windowStart || t.due || "";
        // Overdue only after the full window ends
        const overdue = open
          .filter(t => {
            const end = endOf(t);
            return end && end < todayISO;
          })
          .sort((a, b) => String(endOf(a)).localeCompare(String(endOf(b))));
        // Active = today falls inside window, or single due date is today
        const today = open
          .filter(t => {
            const start = startOf(t);
            const end = endOf(t);
            if (start && end) return start <= todayISO && todayISO <= end;
            return t.due === todayISO;
          })
          .sort((a, b) => String(a.title || "").localeCompare(String(b.title || "")));
        // Completed — newest first
        const completed = (tasks || [])
          .filter(t => t.done)
          .sort((a, b) => String(b.completedAt || b.due || "").localeCompare(String(a.completedAt || a.due || "")));
        return { overdue, today, completed };
      }, [tasks, todayISO]);

      const bedList = useMemo(() => resolveBedList(beds), [beds]);
      const weeklyBrief = useMemo(
        () => buildWeeklyBrief({ placed, seeds, profile, rotationHistory, tasks, beds: bedList }),
        [placed, seeds, profile, rotationHistory, tasks, bedList]
      );

      const addBriefAsTask = (item) => {
        setTasks(prev => {
          if (prev.some(t => !t.done && t.title === item.title)) return prev;
          return [{
            id: Date.now() + Math.random(),
            title: item.title,
            detail: item.detail,
            done: false,
            icon: item.icon,
            due: toISODate(new Date()),
          }, ...prev];
        });
      };

      const addAllBriefTasks = () => {
        weeklyBrief.forEach(addBriefAsTask);
      };

      const [globalQuery, setGlobalQuery] = useState("");
      const searchResults = useMemo(() => {
        const q = globalQuery.trim().toLowerCase();
        if (q.length < 2) return [];
        const results = [];

        // Plants
        [...PLANT_LIBRARY, ...(customPlants || [])].forEach(p => {
          const hay = `${p.name} ${p.type || ""} ${p.familyName || ""} ${p.scientific || ""}`.toLowerCase();
          if (hay.includes(q)) {
            results.push({
              id: `plant-${p.id}`,
              kind: "Plant",
              icon: p.icon || "🌱",
              title: p.name,
              detail: `${p.type || ""} · ${p.familyName || ""}`.trim(),
              tab: "plants",
            });
          }
        });

        // Seeds
        (seeds || []).forEach(s => {
          if ((s.name || "").toLowerCase().includes(q) || (s.type || "").toLowerCase().includes(q)) {
            results.push({
              id: `seed-${s.id}`,
              kind: "Seed",
              icon: "📦",
              title: s.name,
              detail: `Qty ${s.qty}${s.low || s.qty <= 3 ? " · low stock" : ""}`,
              tab: "vault",
            });
          }
        });

        // Tasks
        (tasks || []).forEach(t => {
          if ((t.title || "").toLowerCase().includes(q) || (t.detail || "").toLowerCase().includes(q)) {
            results.push({
              id: `task-${t.id}`,
              kind: "Task",
              icon: t.icon || "✅",
              title: t.title,
              detail: t.detail || (t.done ? "Done" : "Open"),
              tab: "calendar",
              taskId: t.id,
            });
          }
        });

        // Placed in beds
        (placed || []).forEach(item => {
          const pl = PLANT_LIBRARY.find(x => x.id === item.plant) || (customPlants || []).find(x => x.id === item.plant);
          const name = pl?.name || item.plant;
          const bName = bedLabel(beds, item.bed);
          if (name.toLowerCase().includes(q) || bName.toLowerCase().includes(q)) {
            results.push({
              id: `placed-${item.id}`,
              kind: "In garden",
              icon: pl?.icon || "🌿",
              title: name,
              detail: bName || item.bed,
              tab: "layout",
            });
          }
        });

        // Journal
        (journal || []).forEach(e => {
          if ((e.text || "").toLowerCase().includes(q)) {
            results.push({
              id: `journal-${e.id}`,
              kind: "Journal",
              icon: "📓",
              title: (e.text || "").slice(0, 60) + ((e.text || "").length > 60 ? "…" : ""),
              detail: e.date || "",
              tab: "journal",
            });
          }
        });

        return results.slice(0, 20);
      }, [globalQuery, tasks, seeds, placed, journal, customPlants]);

      const [weather, setWeather] = useState(null);
      const [weatherLoading, setWeatherLoading] = useState(true);
      const [weatherError, setWeatherError] = useState(null);
      const [location, setLocation] = useState(() => {
        const saved = localStorage.getItem("pp_location");
        return saved ? JSON.parse(saved) : { name: "Austin, TX", lat: 30.27, lon: -97.74, zone: "8b" };
      });
      const [showLocEdit, setShowLocEdit] = useState(false);
      const [locQuery, setLocQuery] = useState("");

      useEffect(() => {
        localStorage.setItem("pp_location", JSON.stringify(location));
      }, [location]);

      useEffect(() => {
        let cancelled = false;
        setWeatherLoading(true);
        setWeatherError(null);

        const fallbackWeather = () => {
          // Realistic demo data so UI always works offline / rate-limited
          const today = new Date();
          const iso = (d) => d.toISOString().slice(0, 10);
          const d0 = iso(today);
          const d1 = iso(new Date(today.getTime() + 86400000));
          const d2 = iso(new Date(today.getTime() + 172800000));
          return {
            current: {
              temperature_2m: 74,
              relative_humidity_2m: 58,
              weather_code: 2,
              wind_speed_10m: 8,
              precipitation: 0,
            },
            daily: {
              time: [d0, d1, d2],
              temperature_2m_max: [82, 79, 85],
              temperature_2m_min: [61, 58, 63],
              precipitation_sum: [0, 0.12, 0],
              weather_code: [2, 61, 1],
              precipitation_probability_max: [10, 40, 5],
            },
          };
        };

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${location.lat}&longitude=${location.lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,precipitation&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code,precipitation_probability_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=3`;
        fetch(url)
          .then(r => r.json())
          .then(data => {
            if (cancelled) return;
            if (data.error || !data.current) throw new Error(data.reason || "No data");
            setWeather(data);
            setWeatherLoading(false);
          })
          .catch(() => {
            if (cancelled) return;
            setWeather(fallbackWeather());
            setWeatherError(null); // silent fallback — still show useful UI
            setWeatherLoading(false);
          });
        return () => { cancelled = true; };
      }, [location.lat, location.lon]);

      const searchLocation = async () => {
        if (!locQuery.trim()) return;
        try {
          const res = await fetch(
            `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(locQuery.trim())}&count=1&language=en&format=json`
          );
          const data = await res.json();
          if (data.results && data.results[0]) {
            const r = data.results[0];
            setLocation({
              name: `${r.name}${r.admin1 ? ", " + r.admin1 : ""}`,
              lat: r.latitude,
              lon: r.longitude,
              zone: location.zone || "—",
            });
            setShowLocEdit(false);
            setLocQuery("");
          } else {
            alert("Location not found. Try a city name.");
          }
        } catch {
          alert("Search failed. Check connection.");
        }
      };

      // Garden advice from weather
      const gardenAdvice = () => {
        if (!weather?.current) return [];
        const tips = [];
        const t = weather.current.temperature_2m;
        const minTonight = weather.daily?.temperature_2m_min?.[0];
        const precip = weather.current.precipitation || 0;
        const precipToday = weather.daily?.precipitation_sum?.[0] || 0;
        const humidity = weather.current.relative_humidity_2m;

        if (minTonight != null && minTonight <= 36) {
          tips.push({ level: "warn", text: `Frost risk tonight (low ${Math.round(minTonight)}°F) — cover tender plants` });
        } else if (minTonight != null && minTonight <= 42) {
          tips.push({ level: "info", text: `Chilly night ahead (${Math.round(minTonight)}°F) — watch tender seedlings` });
        } else {
          tips.push({ level: "ok", text: "Low frost risk tonight" });
        }

        if (precipToday >= 0.15 || precip > 0) {
          tips.push({ level: "ok", text: "Rain expected — skip or reduce watering" });
        } else if (t >= 85 && humidity < 50) {
          tips.push({ level: "warn", text: "Hot & dry — water deeply this morning or evening" });
        } else if (t >= 75) {
          tips.push({ level: "info", text: "Warm day — check soil moisture on containers" });
        } else {
          tips.push({ level: "info", text: "Good conditions for outdoor work" });
        }

        if (humidity >= 80 && t >= 60) {
          tips.push({ level: "info", text: "High humidity — watch for fungal issues" });
        }
        return tips;
      };

      const currentWx = weather?.current ? weatherIcon(weather.current.weather_code) : null;
      const temp = weather?.current ? Math.round(weather.current.temperature_2m) : null;
      const minT = weather?.daily?.temperature_2m_min?.[0];
      const frostLevel =
        minT == null ? "unknown" :
        minT <= 32 ? "likely" :
        minT <= 36 ? "risk" :
        minT <= 42 ? "chilly" : "low";
      const frostLabel =
        frostLevel === "likely" ? "Frost likely" :
        frostLevel === "risk" ? "Frost risk" :
        frostLevel === "chilly" ? "Chilly" :
        frostLevel === "low" ? "Low frost" : "—";

      // One frost notification per day when risk is elevated
      useEffect(() => {
        if (frostLevel !== "likely" && frostLevel !== "risk") return;
        const key = "pp_frost_notify_" + toISODate(new Date());
        if (localStorage.getItem(key)) return;
        if (Notification.permission === "granted") {
          sendLocalNotification(
            frostLevel === "likely" ? "Frost likely tonight" : "Frost risk tonight",
            `Low around ${minT != null ? Math.round(minT) : "—"}°F — cover tomatoes, peppers & seedlings`
          );
          localStorage.setItem(key, "1");
        }
      }, [frostLevel, minT]);

      // Header badge styling by frost severity
      const frostBadgeClass =
        frostLevel === "likely"
          ? "bg-red-500 text-white ring-2 ring-red-300"
          : frostLevel === "risk"
          ? "bg-amber-500 text-white ring-2 ring-amber-300"
          : frostLevel === "chilly"
          ? "bg-sky-100 text-sky-800"
          : "bg-white text-sage-800";

      return (
        <div className="pb-24">
          <Header
            title="PlotPilot"
            right={
              <button
                onClick={() => setShowLocEdit(true)}
                className={`flex items-center gap-1.5 rounded-full px-3 py-1.5 card-shadow text-sm transition ${frostBadgeClass}`}
                title={minT != null ? `Tonight's low: ${Math.round(minT)}°F` : "Weather"}
              >
                {(frostLevel === "likely" || frostLevel === "risk") ? (
                  <span className="text-base" aria-hidden>❄️</span>
                ) : (
                  <span>{currentWx?.icon || "🌡️"}</span>
                )}
                <span className="font-medium">
                  {weatherLoading ? "…" : `${temp ?? "--"}°F`}
                </span>
                <span className={`text-xs font-semibold ml-0.5 ${
                  frostLevel === "likely" || frostLevel === "risk" ? "opacity-95" : "text-sage-500"
                }`}>
                  {frostLabel}
                </span>
              </button>
            }
          />

          {/* Frost alert banner — only when risk is elevated */}
          {(frostLevel === "likely" || frostLevel === "risk") && !weatherLoading && (
            <div className={`mx-4 mt-3 rounded-xl px-3 py-2.5 flex items-center gap-2 text-sm font-medium ${
              frostLevel === "likely"
                ? "bg-red-50 text-red-800 border border-red-200"
                : "bg-amber-50 text-amber-900 border border-amber-200"
            }`}>
              <span className="text-lg">❄️</span>
              <div className="flex-1 leading-tight">
                <p className="font-semibold">
                  {frostLevel === "likely" ? "Frost likely tonight" : "Frost risk tonight"}
                </p>
                <p className="text-xs opacity-80 font-normal">
                  Low {Math.round(minT)}°F — cover tomatoes, peppers & tender seedlings
                </p>
              </div>
            </div>
          )}

          <div className="px-4 pt-4 space-y-5">
            {/* Weather card */}
            <section className="bg-white rounded-2xl p-4 card-shadow">
              <div className="flex justify-between items-start mb-3">
                <div>
                  <p className="text-xs text-sage-500">Garden weather</p>
                  <p className="font-semibold text-sage-800 text-sm">{location.name}</p>
                </div>
                <button
                  onClick={() => setShowLocEdit(true)}
                  className="text-[10px] text-sage-500 underline"
                >
                  Change
                </button>
              </div>

              {weatherLoading && (
                <p className="text-sm text-sage-400 py-4 text-center">Loading weather…</p>
              )}
              {weatherError && (
                <p className="text-sm text-amber-600 py-2">{weatherError}. Using offline tips.</p>
              )}
              {weather && !weatherLoading && (
                <>
                  <div className="flex items-center gap-4 mb-3">
                    <span className="text-4xl">{currentWx?.icon}</span>
                    <div>
                      <p className="text-2xl font-bold text-sage-800">{temp}°F</p>
                      <p className="text-xs text-sage-500">
                        {currentWx?.label} · H {Math.round(weather.daily.temperature_2m_max[0])}° / L {Math.round(weather.daily.temperature_2m_min[0])}°
                      </p>
                      <p className="text-[10px] text-sage-400">
                        Humidity {weather.current.relative_humidity_2m}% · Wind {Math.round(weather.current.wind_speed_10m)} mph
                      </p>
                    </div>
                  </div>

                  {/* 3-day strip */}
                  <div className="grid grid-cols-3 gap-2 mb-3">
                    {weather.daily.time.slice(0, 3).map((day, i) => {
                      const w = weatherIcon(weather.daily.weather_code[i]);
                      const d = new Date(day + "T12:00:00");
                      const label = i === 0 ? "Today" : d.toLocaleDateString("en-US", { weekday: "short" });
                      return (
                        <div key={day} className="bg-sage-50 rounded-xl p-2 text-center">
                          <p className="text-[10px] text-sage-500 font-medium">{label}</p>
                          <p className="text-lg my-0.5">{w.icon}</p>
                          <p className="text-[10px] text-sage-700">
                            {Math.round(weather.daily.temperature_2m_max[i])}° / {Math.round(weather.daily.temperature_2m_min[i])}°
                          </p>
                        </div>
                      );
                    })}
                  </div>

                  {/* Garden tips */}
                  <div className="space-y-1.5">
                    {gardenAdvice().map((tip, i) => (
                      <div
                        key={i}
                        className={`text-xs rounded-lg px-2.5 py-1.5 flex items-start gap-2 ${
                          tip.level === "warn" ? "bg-amber-50 text-amber-800" :
                          tip.level === "ok" ? "bg-green-50 text-green-800" :
                          "bg-sage-50 text-sage-700"
                        }`}
                      >
                        <span>{tip.level === "warn" ? "⚠️" : tip.level === "ok" ? "✓" : "ℹ️"}</span>
                        <span>{tip.text}</span>
                      </div>
                    ))}
                  </div>
                </>
              )}
            </section>

            {/* Location edit modal */}
            {showLocEdit && (
              <div className="fixed inset-0 bg-black/40 z-[100] flex items-end sm:items-center justify-center px-4 pt-4 pb-24">
                <div className="bg-white rounded-2xl p-5 w-full max-w-sm card-shadow">
                  <h3 className="font-semibold text-sage-800 mb-1">Garden location</h3>
                  <p className="text-xs text-sage-500 mb-3">Used for weather and frost advice</p>
                  <input
                    type="text"
                    value={locQuery}
                    onChange={e => setLocQuery(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && searchLocation()}
                    placeholder="City name (e.g. Denver, CO)"
                    className="w-full border border-sage-200 rounded-xl px-3 py-2.5 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-sage-400"
                  />
                  <p className="text-[10px] text-sage-400 mb-3">Current: {location.name}</p>
                  <div className="flex gap-2">
                    <button
                      onClick={() => setShowLocEdit(false)}
                      className="flex-1 py-2.5 rounded-xl border border-sage-200 text-sage-600 text-sm font-medium"
                    >
                      Cancel
                    </button>
                    <button
                      onClick={searchLocation}
                      className="flex-1 py-2.5 rounded-xl bg-sage-600 text-white text-sm font-medium"
                    >
                      Update
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* This week's garden brief */}
            <section>
              <div className="flex items-center justify-between mb-2">
                <h2 className="font-semibold text-sage-800 flex items-center gap-2">
                  <span>📋</span> This week
                </h2>
                {weeklyBrief.length > 0 && (
                  <button
                    type="button"
                    onClick={addAllBriefTasks}
                    className="text-xs text-sage-600 font-medium"
                  >
                    Add all to tasks
                  </button>
                )}
              </div>
              {!profile?.lastFrost && (
                <button
                  type="button"
                  onClick={() => setActive && setActive("settings")}
                  className="w-full mb-2 text-left bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 text-xs text-amber-900"
                >
                  ⚠️ Set your frost dates in Settings for accurate sow/harvest timing →
                </button>
              )}
              {profile?.lastFrost && profile?.firstFrost && (
                <div className="mb-2 text-[10px] text-sage-600 bg-sage-50 border border-sage-100 rounded-xl px-3 py-2">
                  Season window: <strong>{fmtDate(profile.lastFrost)}</strong> last spring frost →{" "}
                  <strong>{fmtDate(profile.firstFrost)}</strong> first fall frost. Tasks stay open for a range of days (not a single deadline) so you can finish within the zone calendar.
                </div>
              )}
              {weeklyBrief.length === 0 ? (
                <div className="bg-white rounded-2xl p-4 card-shadow text-center">

            {/* Garden Overview */}

              <div className="bg-white rounded-2xl p-4 card-shadow">
                <div className="grid grid-cols-2 gap-2">
                  {bedList.map(bed => {

                </div>
                <button
                  type="button"
                  onClick={() => setActive && setActive("layout")}
                  className="w-full mt-3 text-sm text-sage-600 font-medium py-2 border border-sage-200 rounded-xl hover:bg-sage-50 active:bg-sage-100 transition"
                >
                  View full layout →
                </button>

            {/* Seed Vault Alert + Harvest */}
            <div className="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
              <button
                type="button"
                onClick={() => setActive && setActive("vault")}
                className="bg-white rounded-2xl p-4 card-shadow text-left hover:bg-sage-50 transition w-full"
              >
                <div className="flex items-center gap-2 mb-2">
                  <i className="fas fa-box text-sage-500"></i>
                  <span className="font-medium text-sm">Seed Vault</span>
                </div>
                {lowStock > 0 ? (
                  <div className="bg-amber-50 text-amber-700 text-xs rounded-lg px-2 py-1.5 flex items-center gap-1">
                    <i className="fas fa-exclamation-triangle"></i>
                    {lowStock} low stock
                  </div>
                ) : (
                  <p className="text-xs text-sage-500">All good · Open →</p>
                )}
              </button>
              <button
                type="button"
                onClick={() => setActive && setActive("calendar")}
                className="bg-white rounded-2xl p-4 card-shadow text-left hover:bg-sage-50 transition w-full"
              >
                <div className="flex items-center gap-2 mb-2">
                  <i className="fas fa-calendar text-sage-500"></i>
                  <span className="font-medium text-sm">Next Harvest</span>
                </div>
                {(() => {
                  const upcoming = placed
                    .filter(p => p.status !== "harvested" && p.plantedAt)
                    .map(p => {
                      const pl = PLANT_LIBRARY.find(x => x.id === p.plant);
                      if (!pl || !pl.daysToHarvest || pl.daysToHarvest >= 200) return null;
                      const harvest = addDays(new Date(p.plantedAt + "T12:00:00"), pl.daysToHarvest);
                      return { name: pl.name, icon: pl.icon, date: harvest };
                    })
                    .filter(Boolean)
                    .sort((a, b) => a.date - b.date)
                    .slice(0, 2);
                  if (!upcoming.length) return <p className="text-xs text-sage-400">Plant something to see dates</p>;
                  return upcoming.map((u, i) => (
                    <p key={i} className="text-xs text-sage-600">{u.icon} {u.name} · {fmtDate(u.date)}</p>
                  ));
                })()}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function LayoutPlanner({ placed, setPlaced, setTasks, beds, setBeds, planYear, seeds, setSeeds, customPlants, setCustomPlants }) {
      const bedList = beds && beds.length ? beds : DEFAULT_BEDS;
      const yearPlaced = (placed || []).filter(p => (p.year || new Date().getFullYear()) === (planYear || new Date().getFullYear()));
      const [dragPlantId, setDragPlantId] = useState(null);       // plant type being dragged from library
      const [dragPlacedId, setDragPlacedId] = useState(null);     // unique id of placed plant being moved
      const [dragOverBed, setDragOverBed] = useState(null);
      const [justDropped, setJustDropped] = useState(null);
      const [suggestions, setSuggestions] = useState([]);
      const [suggestBed, setSuggestBed] = useState(null); // null = whole garden
      const [undoStack, setUndoStack] = useState([]);
      const [showMap, setShowMap] = useState(true);
      const [editingBed, setEditingBed] = useState(null); // bed object being edited
      const [bedDraft, setBedDraft] = useState({ name: "", widthFt: 4, lengthFt: 8, sun: "Full sun", mapX: 10, mapY: 10, color: BED_COLORS[0] });
      // Mobile-friendly: multi-select plants, then tap a bed to plant
      const [selectedPlantIds, setSelectedPlantIds] = useState([]);
      const [layoutTypeFilter, setLayoutTypeFilter] = useState("All");
      const [varietyPickerCrop, setVarietyPickerCrop] = useState(null); // crop id for variety multi-select sheet
      const [pickerSelected, setPickerSelected] = useState([]); // variety ids in sheet
      const [showAddVariety, setShowAddVariety] = useState(false);
      const [newVarietyName, setNewVarietyName] = useState("");
      const [newVarietyNotes, setNewVarietyNotes] = useState("");
      const [detailItem, setDetailItem] = useState(null); // placed item for info sheet
      const longPressRef = useState({ timer: null, fired: false })[0];
      // Ask for real plant date before committing (supports backdating)
      const [pendingPlacement, setPendingPlacement] = useState(null); // { bedId, plantIds: string[] }
      const [plantDateDraft, setPlantDateDraft] = useState(() => toISODate(new Date()));

      const togglePlantSelect = (plantId) => {
        setSelectedPlantIds(prev =>
          prev.includes(plantId) ? prev.filter(id => id !== plantId) : [...prev, plantId]
        );
      };

      const clearPlantSelection = () => setSelectedPlantIds([]);

      const commitPlantsToBed = (plantIds, bedId, plantedAtISO, opts = {}) => {
        const planY = planYear || new Date().getFullYear();
        const profileSaved = JSON.parse(localStorage.getItem("pp_profile") || "{}");
        const bed = bedList.find(b => b.id === bedId);
        const bedName = bed?.name || bedId;
        const careBatch = [];
        const newItems = [];

        plantIds.forEach((plantId, i) => {
          const plantInfo = resolvePlant(plantId, customPlants) || PLANT_LIBRARY.find(p => p.id === plantId);
          if (!plantInfo) return;
          const cropKey = plantInfo.cropId || plantInfo.id;
          const bedCropKeys = [...placed, ...newItems].filter(p => p.bed === bedId).map(p => {
            const pl = resolvePlant(p.plant, customPlants);
            return pl?.cropId || p.plant;
          });
          const conflicts = [...new Set(bedCropKeys.filter(pid => getRelation(cropKey, pid) < 0))];
          if (conflicts.length > 0 && !opts.ignoreConflicts) {
            setConflictSheet({
              plantInfo,
              plantId,
              bedId,
              bedName,
              plantedAtISO,
              remainingIds: plantIds.slice(i + 1),
              pairs: conflicts.map(cid => {
                const other = resolvePlant(cid, customPlants) || PLANT_LIBRARY.find(p => p.id === cid);
                return {
                  otherId: cid,
                  otherName: plantDisplayName(other, { fallbackId: cid }),
                  why: companionWhy(cropKey, cid),
                  betterForNew: betterCompanionsFor(cropKey),
                  betterForOther: betterCompanionsFor(cid),
                };
              }),
            });
            return; // wait for user choice in sheet
          }
          const sched = computePlantingSchedule(plantInfo, profileSaved);
          const care = careScheduleFromPlantDate(plantInfo, plantedAtISO, profileSaved);
          const newItem = {
            id: Date.now() + Math.random() + i * 0.001,
            bed: bedId,
            plant: plantId,
            plantedAt: plantedAtISO,
            status: "growing",
            year: planY,
            method: plantInfo?.method,
            sowDate: sched?.sowDate,
            transplantDate: sched?.transplantDate,
            // Prefer maturity from actual plant date when available
            harvestStart: care.harvestDue || sched?.harvestStart,
          };
          newItems.push(newItem);
          careBatch.push(...buildCareTasksForPlanting(plantInfo, plantedAtISO, {
            bedName,
            year: planY,
            profile: profileSaved,
          }));
          if (setSeeds) {
            setSeeds(prev => prev.map(s => {
              const matchName = (plantInfo.variety || plantInfo.name || "").toLowerCase();
              if (matchName && (s.name || "").toLowerCase().includes(matchName.split("—")[0].trim()) && s.qty > 0) {
                const qty = Math.max(0, Number(s.qty) - 1);
                return { ...s, qty, low: s.measure === "weight" ? qty <= 1 : qty <= 10 };
              }
              return s;
            }));
          }
        });

        if (!newItems.length) return;
        setPlaced(prev => [...prev, ...newItems]);
        setJustDropped(newItems[newItems.length - 1].id);
        setTimeout(() => setJustDropped(null), 600);
        if (setTasks && careBatch.length) {
          setTasks(prev => mergeCareTasksInto(prev, careBatch));
        }
      };

      const placeSelectedOnBed = (bedId) => {
        if (!selectedPlantIds.length) return;
        setPendingPlacement({ bedId, plantIds: [...selectedPlantIds] });
        setPlantDateDraft(toISODate(new Date()));
      };

      const confirmPendingPlacement = () => {
        if (!pendingPlacement) return;
        const dateISO = plantDateDraft || toISODate(new Date());
        pushUndo(placed);
        commitPlantsToBed(pendingPlacement.plantIds, pendingPlacement.bedId, dateISO);
        clearPlantSelection();
        setPendingPlacement(null);
      };

      const handleBedTap = (bedId) => {
        if (selectedPlantIds.length > 0) {
          placeSelectedOnBed(bedId);
          return;
        }
        const b = bedList.find(x => x.id === bedId);
        if (b) openEditBed(b);
      };

      const openEditBed = (bed) => {
        setEditingBed(bed);
        const pot = isContainer(bed);
        setBedDraft({
          name: bed.name,
          kind: pot ? "container" : "bed",
          widthFt: bed.widthFt || (pot ? 1.5 : 4),
          lengthFt: bed.lengthFt || (pot ? 1.5 : 8),
          sun: bed.sun || "Full sun",
          mapX: bed.mapX != null ? bed.mapX : 10,
          mapY: bed.mapY != null ? bed.mapY : 10,
          color: bed.color || BED_COLORS[0],
          showOnMap: pot ? bed.showOnMap === true : bed.showOnMap !== false,
          locationNote: bed.locationNote || "",
        });
      };

      const saveBedEdit = () => {
        if (!editingBed || !setBeds) return;
        const pot = bedDraft.kind === "container";
        setBeds(prev => prev.map(b => b.id === editingBed.id ? {
          ...b,
          name: bedDraft.name.trim() || b.name,
          kind: pot ? "container" : "bed",
          widthFt: Math.max(0.5, Number(bedDraft.widthFt) || (pot ? 1.5 : 4)),
          lengthFt: Math.max(0.5, Number(bedDraft.lengthFt) || (pot ? 1.5 : 8)),
          sun: bedDraft.sun,
          color: bedDraft.color || b.color,
          mapX: Math.min(90, Math.max(0, Number(bedDraft.mapX) || 0)),
          mapY: Math.min(85, Math.max(0, Number(bedDraft.mapY) || 0)),
          showOnMap: pot ? !!bedDraft.showOnMap : bedDraft.showOnMap !== false,
          locationNote: (bedDraft.locationNote || "").trim() || undefined,
        } : b));
        setEditingBed(null);
      };

      const addBedFromLayout = () => {
        if (!setBeds) return;
        const id = "bed_" + Date.now();
        const n = groundBeds(beds).length;
        setBeds(prev => [...prev, {
          id,
          kind: "bed",
          name: `Bed ${n + 1}`,
          widthFt: 4,
          lengthFt: 8,
          sun: "Full sun",
          color: BED_COLORS[n % BED_COLORS.length],
          mapX: 8 + (n % 3) * 30,
          mapY: 12 + Math.floor(n / 3) * 35,
          showOnMap: true,
        }]);
      };

      const addContainerFromLayout = () => {
        if (!setBeds) return;
        const id = "pot_" + Date.now();
        const n = containerBeds(beds).length;
        setBeds(prev => [...prev, {
          id,
          kind: "container",
          name: n === 0 ? "Container 1" : `Container ${n + 1}`,
          widthFt: 1.5,
          lengthFt: 1.5,
          sun: "Full sun",
          color: BED_COLORS[(n + 3) % BED_COLORS.length],
          mapX: 70,
          mapY: 70,
          showOnMap: false,
          locationNote: "",
        }]);
      };

      const deleteBed = (bedId) => {
        if (!setBeds) return;
        const count = yearPlaced.filter(p => p.bed === bedId).length;
        if (count > 0 && !confirm(`This bed has ${count} plant(s). Delete bed and keep plants unassigned?`)) return;
        if (count === 0 && !confirm("Delete this bed?")) return;
        setBeds(prev => prev.filter(b => b.id !== bedId));
        // Move plants to first remaining bed if any
        setPlaced(prev => {
          const remaining = (beds || []).filter(b => b.id !== bedId);
          const fallback = remaining[0]?.id;
          if (!fallback) return prev.filter(p => p.bed !== bedId);
          return prev.map(p => p.bed === bedId ? { ...p, bed: fallback } : p);
        });
        setEditingBed(null);
      };

      const pushUndo = (snapshot) => {
        setUndoStack(prev => [...prev.slice(-9), snapshot]);
      };

      const undo = () => {
        if (undoStack.length === 0) return;
        const prev = undoStack[undoStack.length - 1];
        setUndoStack(s => s.slice(0, -1));
        setPlaced(prev);
      };

      const setPlantStatus = (id, status) => {
        pushUndo(placed);
        setPlaced(prev => prev.map(p => p.id === id ? { ...p, status } : p));
      };

      // ----- Drag from Plant Library -----
      const onLibraryDragStart = (e, plantId) => {
        setDragPlantId(plantId);
        setDragPlacedId(null);
        e.dataTransfer.setData("text/plain", JSON.stringify({ type: "library", plantId }));
        e.dataTransfer.effectAllowed = "copy";
      };

      // ----- Drag already-placed plant -----
      const onPlacedDragStart = (e, item) => {
        setDragPlacedId(item.id);
        setDragPlantId(null);
        e.dataTransfer.setData("text/plain", JSON.stringify({ type: "placed", id: item.id }));
        e.dataTransfer.effectAllowed = "move";
      };

      const onDragEnd = () => {
        setDragPlantId(null);
        setDragPlacedId(null);
        setDragOverBed(null);
      };

      const [conflictSheet, setConflictSheet] = useState(null); // { plantInfo, bedName, pairs, pendingIds, plantedAtISO, bedId }

      const computeSuggestions = (bedId = null) => {
        const relevantPlaced = bedId
          ? placed.filter(p => p.bed === bedId)
          : placed;
        const currentIds = [...new Set(relevantPlaced.map(p => p.plant))];
        if (currentIds.length === 0) {
          setSuggestions([]);
          setSuggestBed(bedId);
          return;
        }

        const scores = PLANT_LIBRARY
          .filter(pl => !currentIds.includes(pl.id))
          .map(pl => {
            let score = 0;
            let goodWith = [];
            let badWith = [];
            const reasons = [];
            currentIds.forEach(cid => {
              const rel = getRelation(pl.id, cid);
              score += rel;
              const cname = plantNameForId(cid, customPlants);
              if (rel > 0) {
                goodWith.push(cname);
                reasons.push(companionWhy(pl.id, cid));
              }
              if (rel < 0) badWith.push(cname);
            });
            return { ...pl, score, goodWith, badWith, why: reasons[0] || "" };
          })
          .filter(s => s.score > 0 || s.badWith.length > 0)
          .sort((a, b) => b.score - a.score);

        setSuggestions(scores);
        setSuggestBed(bedId);
      };

      // ----- Drop zone handlers -----
      const onDragOver = (e, bedId) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = dragPlantId ? "copy" : "move";
        setDragOverBed(bedId);
      };

      const onDragLeave = () => setDragOverBed(null);

      const onDrop = (e, bedId) => {
        e.preventDefault();
        setDragOverBed(null);
        try {
          const data = JSON.parse(e.dataTransfer.getData("text/plain"));
          if (data.type === "library") {
            setPendingPlacement({ bedId, plantIds: [data.plantId] });
            setPlantDateDraft(toISODate(new Date()));
          } else if (data.type === "placed") {
            pushUndo(placed);
            setPlaced(prev => prev.map(p => p.id === data.id ? { ...p, bed: bedId } : p));
          }
        } catch (err) {}
        setDragPlantId(null);
        setDragPlacedId(null);
      };

      const removePlant = (id) => {
        pushUndo(placed);
        setPlaced(prev => prev.filter(p => p.id !== id));
      };

      const clearBed = (bedId) => {
        if (confirm("Clear all plants from this bed?")) {
          pushUndo(placed);
          setPlaced(prev => prev.filter(p => p.bed !== bedId));
        }
      };

      return (

            <div className="flex gap-2 items-center">
              <button

                disabled={undoStack.length === 0}
                className={`text-xs px-2 py-1 rounded-lg font-medium ${

                title="Undo"
              >
                ↩ Undo
              </button>

              <button

                title="Reset layout"
              >
                <i className="fas fa-undo"></i>
              </button>

                  </button>

              {selectedPlantIds.length > 0 && (
                <div className="mb-2 flex items-center gap-2 bg-sage-600 text-white rounded-xl px-3 py-2 text-xs font-medium">

                </div>

              {showMap && (
                <GardenMap

                  placed={yearPlaced}
                  planYear={planYear}

                  dragOverBed={dragOverBed}

                  onDragLeave={onDragLeave}

                      e.preventDefault();

                          const harvested = item.status === "harvested";
                          const label = plant?.variety || plant?.name || item.plant;

                              longPressRef.fired = true;
                              if (navigator.vibrate) try { navigator.vibrate(30); } catch (_) {}
                              if (confirm(`Remove ${label} from this bed?`)) {

                          return (

                                e.stopPropagation();
                                if (confirm(`Remove ${label} from this bed?`)) removePlant(item.id);
                              }}
                            >
                              <div className="text-xl text-center leading-none pointer-events-none">{plant?.icon}</div>
                              <p className="text-[8px] leading-tight text-sage-700 text-center mt-0.5 line-clamp-2 font-medium pointer-events-none">{label}</p>
                              {harvested && <span className="absolute -bottom-1 left-0 right-0 text-[8px] text-center text-sage-600">✓</span>}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );

              <p className="text-center text-xs text-sage-400 mt-3">
                Tap plant for details · long-press to remove

            {detailItem && (() => {
              const plant = resolvePlant(detailItem.plant, customPlants) || PLANT_LIBRARY.find(p => p.id === detailItem.plant);
              const bed = bedList.find(b => b.id === detailItem.bed);
              const sched = plant ? computePlantingSchedule(plant, JSON.parse(localStorage.getItem("pp_profile") || "{}")) : null;

              return (

                    <div className="flex gap-3 items-start mb-3">
                      <span className="text-4xl">{plant?.icon || "🌱"}</span>
                      <div className="flex-1 min-w-0">
                        <h3 className="font-semibold text-sage-800 text-lg leading-tight">{label}</h3>
                        {plant?.variety && (
                          <p className="text-xs text-sage-500">{plant.cropName || plant.name?.split("—")[0]?.trim()}</p>
                        )}
                        {plant?.scientific && <p className="text-[10px] text-sage-400 italic">{plant.scientific}</p>}
                        {plant?.isCustom && <p className="text-[10px] text-amber-700 font-medium">Your custom variety</p>}
                      </div>
                      <button type="button" onClick={() => setDetailItem(null)} className="text-sage-400 text-sm">✕</button>
                    </div>
                    <div className="grid grid-cols-2 gap-2 text-xs mb-3">
                      <div className="bg-sage-50 rounded-xl p-2.5">
                        <p className="text-[10px] text-sage-500">Variety</p>
                        <p className="font-medium text-sage-800">{plant?.variety || "Generic / unspecified"}</p>
                      </div>
                      <div className="bg-sage-50 rounded-xl p-2.5">
                        <p className="text-[10px] text-sage-500">Sun / shade</p>
                        <p className="font-medium text-sage-800">{plant?.sun || "—"}</p>
                      </div>
                      <div className="bg-sage-50 rounded-xl p-2.5">
                        <p className="text-[10px] text-sage-500">Germination</p>
                        <p className="font-medium text-sage-800">{plant?.germDays != null ? `${plant.germDays} days` : "—"}</p>
                      </div>
                      <div className="bg-sage-50 rounded-xl p-2.5">
                        <p className="text-[10px] text-sage-500">Days to harvest</p>
                        <p className="font-medium text-sage-800">{plant?.daysToHarvest != null ? `~${plant.daysToHarvest} days` : "—"}</p>
                      </div>
                      <div className="bg-sage-50 rounded-xl p-2.5">
                        <p className="text-[10px] text-sage-500">Spacing</p>
                        <p className="font-medium text-sage-800">{plant?.spacing || "—"}</p>
                      </div>
                      <div className="bg-sage-50 rounded-xl p-2.5">
                        <p className="text-[10px] text-sage-500">Method</p>
                        <p className="font-medium text-sage-800">{plant?.method === "indoor" ? "Start indoors" : "Direct sow"}</p>
                      </div>
                    </div>
                    <div className="text-[10px] text-sage-600 space-y-2 mb-3 bg-sage-50 rounded-xl p-2.5">
                      <p><span className="text-sage-500">Bed:</span> {bed?.name || detailItem.bed}{bed?.sun ? ` · ${bed.sun}` : ""}</p>

            <div className="flex justify-between items-center mb-1">
              <h3 className="font-semibold text-sage-800">Plant Library</h3>
              {selectedPlantIds.length > 0 && (

            {selectedPlantIds.length > 0 && (

            <div className="grid grid-cols-4 gap-2">

          {varietyPickerCrop && (() => {

            const customVars = (customPlants || []).filter(v => v.isVariety && v.cropId === varietyPickerCrop);
            const vars = [...customVars, ...catalogVars];
            const togglePick = (id) => {
              setPickerSelected(prev =>
                prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]

            };
            const saveNewVariety = () => {
              const name = (newVarietyName || "").trim();
              if (!name || !parent || !setCustomPlants) return;
              const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "custom";
              const id = `${varietyPickerCrop}__mine_${Date.now()}`;
              const entry = {
                ...parent,

              setCustomPlants(prev => [...prev, entry]);

                  <div className="px-4 overflow-y-auto flex-1 min-h-0 space-y-1.5">
                    <button

                    {customVars.length > 0 && (

                    {customVars.map(v => (
                      <button

                        className={`w-full text-left px-3 py-2 rounded-xl border text-sm flex justify-between items-center ${

                        }`}
                      >
                        <span>
                          <span className="font-medium text-sage-800">{v.variety}</span>

                        </span>
