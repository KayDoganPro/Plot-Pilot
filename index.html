            <div className="bg-white rounded-2xl p-3 card-shadow space-y-2">
              <p className="text-xs font-semibold text-sage-800">Rotation & season wrap-up</p>
              <p className="text-[10px] text-sage-500">
                Suggest fills empty beds in future years with different plant families. Bed prep schedules clear-out and soil work before frost.
              </p>
              <button
                type="button"
                onClick={suggestRotationForNextYears}
                className="w-full py-2.5 rounded-xl bg-emerald-700 text-white text-sm font-medium"
              >
                Suggest crop rotation (autofill next years)
              </button>
              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={() => planSeasonEndPrep(false)}
                  className="flex-1 py-2 rounded-xl border border-sage-300 text-sage-700 text-xs font-medium"
                >
                  Prep beds (no cover)
                </button>
                <button
                  type="button"
                  onClick={() => planSeasonEndPrep(true)}
                  className="flex-1 py-2 rounded-xl bg-sage-100 text-sage-800 text-xs font-medium border border-sage-200"
                >
                  Prep beds + cover crop
                </button>
              </div>
            </div>

            <section>
              <div className="flex justify-between items-center mb-2">
                <h3 className="font-semibold text-sage-800 text-sm">{planYear} plantings ({yearPlaced.length})</h3>
              </div>
              {yearPlaced.length === 0 ? (
                <p className="text-sm text-sage-400 text-center py-6 bg-white rounded-2xl card-shadow">No plantings for {planYear}. Add one to build your schedule.</p>
              ) : (
                <div className="space-y-2">
                  {yearPlaced.map(item => {
                    const pl = resolvePlant(item.plant, customPlants) || PLANT_LIBRARY.find(p => p.id === item.plant);
                    const bed = beds.find(b => b.id === item.bed);
                    const cap = bed && pl ? bedCapacity(bed, pl.spacingIn) : null;
                    const displayName = plantDisplayName(pl, { fallbackId: item.plant });
                    return (
                      <div key={item.id} className={`rounded-xl p-3 card-shadow ${item.isCoverCrop ? "bg-lime-50 border border-lime-200" : "bg-white"}`}>
                        <div className="flex items-start gap-2">
                          <span className="text-2xl">{pl?.icon || "🌱"}</span>
                          <div className="flex-1 min-w-0">
                            <p className="font-medium text-sm text-sage-800">
                              {displayName}
                              {pl?.isCustom && <span className="text-[10px] text-amber-700 font-normal"> · mine</span>}
                              {item.isCoverCrop && <span className="text-[10px] text-lime-700 font-normal"> · cover crop</span>}
                              {item.fromRotationSuggest && <span className="text-[10px] text-emerald-700 font-normal"> · rotation pick</span>}
                              {item.successionOf > 1 && (
                                <span className="text-xs text-sage-500 font-normal"> · succ. {item.successionIndex}/{item.successionOf}</span>
                              )}
                            </p>
                            <p className="text-[10px] text-sage-500">
                              {bed?.name || item.bed}
                              {pl?.cropName || pl?.type ? ` · ${pl.cropName || pl.type}` : ""}
                              {" · "}{item.method || pl?.method || "—"}
                            </p>
                            <div className="mt-1 grid grid-cols-2 gap-1 text-[10px] text-sage-600">
                              <span>🌱 Sow {item.sowDate ? fmtDate(item.sowDate) : "—"}</span>
                              <span>🌿 Out {item.plantedAt ? fmtDate(item.plantedAt) : "—"}</span>
                              <span>🧺 Harvest {item.harvestStart ? fmtDate(item.harvestStart) : "—"}</span>
                              <span>{cap != null ? `≈ ${cap} plants fit` : ""}</span>
                            </div>
                          </div>
                          <button
                            type="button"
                            className="text-sage-400 text-xs"
                            onClick={() => {
                              if (confirm("Remove this planting?")) {
                                setPlaced(prev => prev.filter(p => p.id !== item.id));
                              }
                            }}
                          >×</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </section>

            <section>
              <div className="flex justify-between items-center mb-2">
                <h3 className="font-semibold text-sage-800 text-sm">Garden beds ({beds.length})</h3>
                <div className="flex gap-2">
                  <button type="button" onClick={() => setShowGardenMap(s => !s)} className="text-xs text-sage-500">{showGardenMap ? "Hide map" : "Map"}</button>
                  <button type="button" onClick={openNewBed} className="text-xs text-sage-600 font-medium">+ Bed</button>
                </div>
              </div>
              {showGardenMap && (
                <div className="mb-3">
                  <GardenMap
                    beds={beds}
                    placed={yearPlaced}
                    planYear={planYear}
                    onSelectBed={(id) => {
                      const b = beds.find(x => x.id === id);
                      if (b) openEditBedPlan(b);
                    }}
                  />
                </div>
              )}
              <div className="space-y-2">
                {beds.map(b => (
                  <div key={b.id} className={`${b.color} border rounded-xl p-3 flex items-center gap-2`}>
                    <div className="flex-1 min-w-0">
                      <p className="text-xs font-semibold text-sage-800">{b.name}</p>
                      <p className="text-[10px] text-sage-600">{b.widthFt}×{b.lengthFt} ft · {b.sun} · ~{bedCapacity(b, 12)} plants @12&quot;</p>
                    </div>
                    <button type="button" onClick={() => openEditBedPlan(b)} className="text-[10px] font-semibold text-sage-700 bg-white/80 px-2 py-1 rounded-lg">Edit</button>
                    <button type="button" onClick={() => removeBed(b.id)} className="text-[10px] text-red-600 px-1">×</button>
                  </div>
                ))}
              </div>
            </section>

            <section>
              <h3 className="font-semibold text-sage-800 text-sm mb-2">Harvest log ({planYear})</h3>
              <div className="bg-white rounded-2xl p-3 card-shadow space-y-2 mb-2">
                <label className="text-[10px] text-sage-500">From plants in your garden</label>
                <select
                  className="w-full border rounded-lg px-2 py-1.5 text-xs"
                  value={harvestForm.placedId || ""}
                  onChange={e => {
                    const placedId = e.target.value;
                    if (!placedId) {
                      setHarvestForm(f => ({ ...f, placedId: "", plantId: f.plantId || "", bedId: "" }));
                      return;
                    }
                    const opt = growingHarvestOptions.find(o => String(o.placedId) === String(placedId));
                    setHarvestForm(f => ({
                      ...f,
                      placedId,
                      plantId: opt?.plantId || f.plantId,
                      bedId: opt?.bedId || "",
                    }));
                  }}
                >
                  <option value="">— Select growing plant —</option>
                  {growingHarvestOptions.map(o => (
                    <option key={o.placedId} value={o.placedId}>{o.icon} {o.label}</option>
                  ))}
                </select>
                {growingHarvestOptions.length === 0 && (
                  <p className="text-[10px] text-amber-800 bg-amber-50 rounded-lg px-2 py-1.5">
                    No growing plants in {planYear}. Plant on Layout, or pick from the library below (you’ll be asked to add it).
                  </p>
                )}
                <label className="text-[10px] text-sage-500">Or any crop (not in garden yet)</label>
                <select
                  className="w-full border rounded-lg px-2 py-1.5 text-xs"
                  value={harvestForm.placedId ? "" : (harvestForm.plantId || "")}
                  onChange={e => {
                    const plantId = e.target.value;
                    setHarvestForm(f => ({ ...f, placedId: "", plantId, bedId: "" }));
                  }}
                >
                  <option value="">— Library crop —</option>
                  {PLANT_LIBRARY.filter(p => !p.isVariety).slice(0, 80).map(p => (
                    <option key={p.id} value={p.id}>{p.icon} {p.name}</option>
                  ))}
                  {PLANT_LIBRARY.filter(p => p.isVariety).slice(0, 40).map(p => (
                    <option key={p.id} value={p.id}>{p.icon} {p.name}</option>
                  ))}
                </select>
                <div className="flex gap-2">
                  <input className="flex-1 border rounded-lg px-2 py-1.5 text-xs" placeholder="Qty" value={harvestForm.qty} onChange={e => setHarvestForm(f => ({ ...f, qty: e.target.value }))} />
                  <select className="w-20 border rounded-lg px-1 py-1.5 text-xs" value={harvestForm.unit} onChange={e => setHarvestForm(f => ({ ...f, unit: e.target.value }))}>
                    {["lb", "oz", "kg", "bunch", "each"].map(u => <option key={u}>{u}</option>)}
                  </select>
                </div>
                <button type="button" onClick={logHarvest} className="w-full py-2 rounded-xl bg-sage-600 text-white text-xs font-medium">Log harvest</button>
              </div>
              {yearHarvests.length === 0 ? (
                <p className="text-xs text-sage-400 text-center">No harvests logged yet</p>
              ) : (
                <div className="space-y-1">
                  {yearHarvests.slice(0, 12).map(h => {
                    const pl = resolvePlant(h.plantId, customPlants) || PLANT_LIBRARY.find(p => p.id === h.plantId);
                    const bedName = h.bedId ? bedLabel(beds, h.bedId) : "";
                    return (
                      <div key={h.id} className="flex justify-between text-xs bg-white rounded-lg px-2 py-1.5 card-shadow gap-2">
                        <span className="min-w-0 truncate">
                          {pl?.icon} {plantDisplayName(pl, { withCrop: true }) || h.plantId} · {h.qty} {h.unit}
                          {bedName ? <span className="text-sage-400"> · in {bedName}</span> : null}
                          {h.placedId ? null : <span className="text-amber-600"> · unlinked</span>}
                        </span>
                        <span className="text-sage-400 shrink-0">{fmtDate(h.date)}</span>
                      </div>
                    );
                  })}
                </div>
              )}
            </section>
          </div>

          {showAdd && (
            <div className="fixed inset-0 bg-black/40 z-[100] flex items-end sm:items-center justify-center px-4 pt-4 pb-24">
              <div className="bg-white rounded-2xl p-5 w-full max-w-sm max-h-[90vh] overflow-y-auto">
                <h3 className="font-semibold text-sage-800 mb-3">Add planting ({planYear})</h3>
                <label className="text-xs text-sage-500">Crop type</label>
                <select
                  className="w-full border rounded-xl px-3 py-2 text-sm mb-2"
                  value={form.cropId || "pepper"}
                  onChange={e => {
                    const cropId = e.target.value;
                    setForm(f => ({ ...f, cropId, plantIds: [cropId] }));
                  }}
                >
                  {PLANT_LIBRARY.map(p => <option key={p.id} value={p.id}>{p.icon} {p.name}</option>)}
                </select>
                {(() => {
                  const cropVars = [
                    ...(customPlants || []).filter(v => v.isVariety && v.cropId === form.cropId),
                    ...VARIETY_LIBRARY.filter(v => v.cropId === form.cropId),
                  ];
                  return (
                  <>
                    <label className="text-xs text-sage-500">Varieties (multi-select)</label>
                    <div className="max-h-40 overflow-y-auto border rounded-xl p-2 mb-2 space-y-1">
                      <label className="flex items-center gap-2 text-xs py-1">
                        <input
                          type="checkbox"
                          checked={(form.plantIds || []).includes(form.cropId)}
                          onChange={() => {
                            setForm(f => {
                              const ids = f.plantIds || [];
                              const has = ids.includes(f.cropId);
                              return { ...f, plantIds: has ? ids.filter(x => x !== f.cropId) : [...ids, f.cropId] };
                            });
                          }}
                        />
                        Generic (no named variety)
                      </label>
                      {cropVars.map(v => (
                        <label key={v.id} className="flex items-center gap-2 text-xs py-1">
                          <input
                            type="checkbox"
                            checked={(form.plantIds || []).includes(v.id)}
                            onChange={() => {
                              setForm(f => {
                                const ids = f.plantIds || [];
                                const has = ids.includes(v.id);
                                return { ...f, plantIds: has ? ids.filter(x => x !== v.id) : [...ids, v.id] };
                              });
                            }}
                          />
                          <span className="flex-1">{v.variety || plantDisplayName(v)}</span>
                          <span className="text-[9px] text-sage-400">{v.isCustom || v.sources === "Mine" ? "Mine" : (v.sources || "")}</span>
                        </label>
                      ))}
                      {cropVars.length === 0 && (
                        <p className="text-[10px] text-sage-400 py-1">No catalog varieties — add one in Layout → crop → + Add my variety</p>
                      )}
                    </div>
                    <p className="text-[10px] text-sage-400 mb-2">
                      {(form.plantIds || []).length} selected — all go in the same bed
                    </p>
                  </>
                  );
                })()}
                <label className="text-xs text-sage-500">Bed</label>
                <select className="w-full border rounded-xl px-3 py-2 text-sm mb-2" value={form.bedId} onChange={e => setForm(f => ({ ...f, bedId: e.target.value }))}>
                  {beds.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                </select>
                <label className="text-xs text-sage-500">Succession plantings (1–8) per variety</label>
                <input type="number" min={1} max={8} className="w-full border rounded-xl px-3 py-2 text-sm mb-2" value={form.successions} onChange={e => setForm(f => ({ ...f, successions: e.target.value }))} />
                {(() => {
                  const pl = resolvePlant((form.plantIds || [])[0], customPlants) || PLANT_LIBRARY.find(p => p.id === form.cropId);
                  const sched = pl ? computePlantingSchedule(pl, profile) : null;
                  if (!sched) return null;
                  return (
                    <div className="text-[10px] text-sage-600 bg-sage-50 rounded-lg p-2 mb-3">
                      Sow {fmtDate(sched.sowDate)}
                      {sched.transplantDate && ` · Transplant ${fmtDate(sched.transplantDate)}`}
                      {" · Harvest ~"}{fmtDate(sched.harvestStart)}
                    </div>
                  );
                })()}
                <div className="flex gap-2">
                  <button type="button" onClick={() => setShowAdd(false)} className="flex-1 py-2.5 rounded-xl border text-sm">Cancel</button>
                  <button type="button" onClick={addPlanting} className="flex-1 py-2.5 rounded-xl bg-sage-600 text-white text-sm font-medium">
                    Add {(form.plantIds || []).length || 1} planting(s)
                  </button>
                </div>
              </div>
            </div>
          )}

          {showBedForm && (
            <div className="fixed inset-0 bg-black/40 z-[100] flex items-end sm:items-center justify-center px-4 pt-4 pb-24">
              <div className="bg-white rounded-2xl p-5 w-full max-w-sm">
                <h3 className="font-semibold text-sage-800 mb-3">{editingBedId ? "Edit bed" : "New bed"}</h3>
                <label className="text-xs text-sage-500">Name</label>
                <input className="w-full border rounded-xl px-3 py-2 text-sm mb-2" placeholder="Name" value={bedForm.name} onChange={e => setBedForm(f => ({ ...f, name: e.target.value }))} />
                <div className="flex gap-2 mb-2">
                  <div className="flex-1">
                    <label className="text-xs text-sage-500">Width (ft)</label>
                    <input type="number" min={1} className="w-full border rounded-xl px-3 py-2 text-sm" placeholder="Width ft" value={bedForm.widthFt} onChange={e => setBedForm(f => ({ ...f, widthFt: e.target.value }))} />
                  </div>
                  <div className="flex-1">
                    <label className="text-xs text-sage-500">Length (ft)</label>
                    <input type="number" min={1} className="w-full border rounded-xl px-3 py-2 text-sm" placeholder="Length ft" value={bedForm.lengthFt} onChange={e => setBedForm(f => ({ ...f, lengthFt: e.target.value }))} />
                  </div>
                </div>
                <label className="text-xs text-sage-500">Sun</label>
                <select className="w-full border rounded-xl px-3 py-2 text-sm mb-2" value={bedForm.sun} onChange={e => setBedForm(f => ({ ...f, sun: e.target.value }))}>
                  {["Full sun", "Partial", "Shade"].map(s => <option key={s}>{s}</option>)}
                </select>
                <label className="text-xs text-sage-500">Bed color</label>
                <div className="grid grid-cols-6 gap-2 mb-3 mt-1">
                  {BED_COLORS.map(c => (
                    <button
                      key={c}
                      type="button"
                      title={BED_COLOR_LABELS[c] || c}
                      onClick={() => setBedForm(f => ({ ...f, color: c }))}
                      className={`h-9 rounded-lg border-2 ${c} ${(bedForm.color || BED_COLORS[0]) === c ? "ring-2 ring-sage-600 scale-105" : "opacity-90"}`}
                    />
                  ))}
                </div>
                <div className="flex gap-2 mb-3">
                  <div className="flex-1">
                    <label className="text-xs text-sage-500">Map left %</label>
                    <input type="number" min={0} max={90} className="w-full border rounded-xl px-3 py-2 text-sm" value={bedForm.mapX} onChange={e => setBedForm(f => ({ ...f, mapX: e.target.value }))} />
                  </div>
                  <div className="flex-1">
                    <label className="text-xs text-sage-500">Map top %</label>
                    <input type="number" min={0} max={85} className="w-full border rounded-xl px-3 py-2 text-sm" value={bedForm.mapY} onChange={e => setBedForm(f => ({ ...f, mapY: e.target.value }))} />
                  </div>
                </div>
                <div className="flex gap-2">
                  <button type="button" onClick={() => { setShowBedForm(false); setEditingBedId(null); }} className="flex-1 py-2.5 rounded-xl border text-sm">Cancel</button>
                  <button type="button" onClick={addBed} className="flex-1 py-2.5 rounded-xl bg-sage-600 text-white text-sm font-medium">Save bed</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function PlantsScreen({ customPlants, setCustomPlants }) {
      const [filter, setFilter] = useState("All");
      const [search, setSearch] = useState("");
      const [sourceFilter, setSourceFilter] = useState("All"); // All | EB | SSE | Both
      const [openCrop, setOpenCrop] = useState(null);
      const [showAdd, setShowAdd] = useState(false);
      const [newPlant, setNewPlant] = useState({ name: "", type: "Vegetable", icon: "🌱", germDays: 7, daysToHarvest: 60 });
      const types = ["All", "Vegetable", "Herb", "Fruit", "Flower", "Cover"];

      const crops = useMemo(() => {
        const customCrops = (customPlants || []).filter(p => !p.isVariety);
        const base = [...PLANT_LIBRARY, ...customCrops];
        return base
          .filter(p => filter === "All" || p.type === filter)
          .filter(p => !search
            || p.name.toLowerCase().includes(search.toLowerCase())
            || (p.variety || "").toLowerCase().includes(search.toLowerCase())
            || (VARIETY_RAW[p.id] || []).some(([, vn]) => vn.toLowerCase().includes(search.toLowerCase()))
            || (customPlants || []).some(v => v.cropId === p.id && (v.variety || v.name || "").toLowerCase().includes(search.toLowerCase())));
      }, [filter, search, customPlants]);

      const varietiesFor = (cropId) => {
        const custom = (customPlants || []).filter(v => v.isVariety && v.cropId === cropId);
        const catalog = VARIETY_LIBRARY.filter(v => v.cropId === cropId).filter(v => {
          if (sourceFilter === "All") return true;
          if (sourceFilter === "Both") return v.sources === "Both" || (v.sources && v.sources.includes("EB") && v.sources.includes("SSE"));
          return v.sources === sourceFilter || v.sources === "Both";
        });
        return [...custom, ...catalog].filter(v => !search || (v.variety || v.name || "").toLowerCase().includes(search.toLowerCase()));
      };

      const addCustomVariety = (cropId) => {
        const parent = PLANT_LIBRARY.find(p => p.id === cropId);
        if (!parent) return;
        const name = prompt(`Name of your ${parent.name} variety:`);
        if (!name || !name.trim()) return;
        const notes = prompt("Optional notes (seed source, color, heat…):") || "";
        const id = `${cropId}__mine_${Date.now()}`;
        setCustomPlants(prev => [...prev, {
          ...parent,
          id,
          name: `${parent.name} — ${name.trim()}`,
          variety: name.trim(),
          cropId,
          cropName: parent.name,
          sources: "Mine",
          isVariety: true,
          isCustom: true,
          notes: notes.trim() || undefined,
        }]);
      };

      const addCustom = () => {
        if (!newPlant.name.trim()) return;
        const id = "custom_" + Date.now();
        setCustomPlants(prev => [...prev, {
          ...newPlant,
          id,
          scientific: "Custom",
          spacing: "—",
          sun: "Full sun",
          family: "Custom",
          familyName: "Custom",
          fertilizeEveryDays: 28,
          startWeeksBeforeFrost: 0,
          transplantWeeksBeforeFrost: 0,
        }]);
        setShowAdd(false);
        setNewPlant({ name: "", type: "Vegetable", icon: "🌱", germDays: 7, daysToHarvest: 60 });
      };

      const varietyCount = VARIETY_LIBRARY.length;

      return (
        <div className="pb-24">
          <Header title="Plant Library" right={
            <button onClick={() => setShowAdd(true)} className="text-xs bg-sage-600 text-white px-2.5 py-1.5 rounded-lg font-medium">+ Add</button>
          } />
          <div className="px-4 pt-4 space-y-3">
            <p className="text-[10px] text-sage-500">

            </p>
            <input
              value={search}
              onChange={e => setSearch(e.target.value)}

              return (
                <div key={plant.id} className="bg-white rounded-2xl card-shadow overflow-hidden">
                  <button
                    type="button"
                    className="w-full p-4 flex gap-3 text-left"
                    onClick={() => setOpenCrop(isOpen ? null : plant.id)}
                  >
                    <div className="text-3xl">{plant.icon}</div>
                    <div className="flex-1 min-w-0">
                      <div className="flex justify-between items-start gap-2">
                        <h3 className="font-semibold text-sage-800">{plant.name}</h3>
                        <span className="text-[10px] text-sage-500 shrink-0">{vars.length} var. {isOpen ? "▲" : "▼"}</span>
                      </div>
                      <p className="text-xs text-sage-400 italic">{plant.scientific}</p>
                      <div className="flex flex-wrap gap-1 mt-1 text-[10px]">
                        <span className="bg-sage-100 text-sage-600 px-2 py-0.5 rounded">{plant.type}</span>
                        <span className={`px-2 py-0.5 rounded ${FAMILY_COLORS[plant.family] || "bg-sage-100"}`}>{plant.familyName}</span>
                      </div>
                      {plant.homestead && plant.homestead.length > 0 && (
                        <div className="flex flex-wrap gap-1 mt-1">
                          {plant.homestead.slice(0, 4).map(h => (
                            <span key={h} className="text-[9px] bg-amber-50 text-amber-800 px-1.5 py-0.5 rounded">{HOMESTEAD_LABELS[h] || h}</span>
                          ))}
                        </div>
                      )}
                    </div>
                  </button>
                  {isOpen && (
                    <div className="px-4 pb-4 border-t border-sage-100 pt-2 space-y-1.5">
                      <div className="grid grid-cols-2 gap-1 text-[10px] text-sage-600 mb-2">
                        <span>🌱 Germ {plant.germDays}d</span>
                        <span>🧺 ~{plant.daysToHarvest}d harvest</span>
                        <span>📐 {plant.spacing}</span>
                        <span>{plant.method === "indoor" ? "Start indoors" : "Direct sow"}</span>
                      </div>
                      {plant.homestead && plant.homestead.length > 0 && (
                        <div className="flex flex-wrap gap-1 mb-2">
                          {plant.homestead.map(h => (
                            <span key={h} className="text-[9px] bg-amber-50 text-amber-900 px-1.5 py-0.5 rounded border border-amber-100">{HOMESTEAD_LABELS[h] || h}</span>
                          ))}
                        </div>
                      )}
                      <p className="text-[10px] font-semibold text-sage-500 uppercase tracking-wide">Varieties</p>
                      {vars.length === 0 ? (
                        <p className="text-xs text-sage-400">No catalog varieties for this filter</p>
                      ) : vars.map(v => (
                        <div key={v.id} className={`flex items-center justify-between rounded-xl px-3 py-2 ${v.isCustom ? "bg-amber-50" : "bg-sage-50"}`}>
                          <div>
                            <p className="text-sm font-medium text-sage-800">{v.variety}</p>
                            <p className="text-[10px] text-sage-500">
                              {v.isCustom || v.sources === "Mine" ? `My variety${v.notes ? ` · ${v.notes}` : ""}`
                                : v.sources === "EB" ? "Eden Brothers" : v.sources === "SSE" ? "Seed Savers" : "Eden Brothers · Seed Savers"}
                            </p>
                          </div>
                          <span className="text-[9px] bg-white px-1.5 py-0.5 rounded text-sage-500">{v.sources === "Mine" || v.isCustom ? "Mine" : v.sources}</span>
                        </div>
                      ))}
                      <button
                        type="button"
                        onClick={() => addCustomVariety(plant.id)}
                        className="w-full mt-1 py-2 rounded-xl border-2 border-dashed border-sage-300 text-sage-700 text-xs font-medium"
                      >
                        + Add my variety
                      </button>
                    </div>
                  )}
                </div>
              );
            })}
            {(customPlants || []).filter(p => filter === "All" || p.type === filter).map(plant => (
              <div key={plant.id} className="bg-white rounded-2xl p-4 card-shadow">
                <div className="flex gap-3">
                  <div className="text-3xl">{plant.icon}</div>
                  <div>
                    <h3 className="font-semibold text-sage-800">{plant.name}</h3>
                    <p className="text-[10px] text-sage-400">Custom</p>
                  </div>
                </div>
              </div>
            ))}
            {crops.length === 0 && <p className="text-center text-sage-400 text-sm py-8">No plants match</p>}
          </div>

          {showAdd && (
            <div className="fixed inset-0 bg-black/40 z-[100] flex items-end sm:items-center justify-center px-4 pt-4 pb-24">
              <div className="bg-white rounded-2xl p-5 w-full max-w-sm">
                <h3 className="font-semibold text-sage-800 mb-3">Add custom plant</h3>
                <input className="w-full border rounded-xl px-3 py-2 text-sm mb-2" placeholder="Name" value={newPlant.name} onChange={e => setNewPlant(n => ({ ...n, name: e.target.value }))} />
                <div className="flex gap-2 mb-2">
                  <select className="flex-1 border rounded-xl px-2 py-2 text-sm" value={newPlant.type} onChange={e => setNewPlant(n => ({ ...n, type: e.target.value }))}>
                    {["Vegetable", "Herb", "Fruit", "Flower"].map(t => <option key={t}>{t}</option>)}
                  </select>
                  <input className="w-16 border rounded-xl px-2 py-2 text-sm text-center" value={newPlant.icon} onChange={e => setNewPlant(n => ({ ...n, icon: e.target.value }))} />
                </div>
                <div className="flex gap-2 mb-3">
                  <input type="number" className="flex-1 border rounded-xl px-2 py-2 text-sm" placeholder="Germ days" value={newPlant.germDays} onChange={e => setNewPlant(n => ({ ...n, germDays: +e.target.value }))} />
                  <input type="number" className="flex-1 border rounded-xl px-2 py-2 text-sm" placeholder="Days to harvest" value={newPlant.daysToHarvest} onChange={e => setNewPlant(n => ({ ...n, daysToHarvest: +e.target.value }))} />
                </div>
                <div className="flex gap-2">
                  <button onClick={() => setShowAdd(false)} className="flex-1 py-2.5 rounded-xl border text-sm">Cancel</button>
                  <button onClick={addCustom} className="flex-1 py-2.5 rounded-xl bg-sage-600 text-white text-sm font-medium">Add</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function JournalScreen({ journal, setJournal, placed, beds }) {
      const [showAdd, setShowAdd] = useState(false);
      const [entry, setEntry] = useState({ text: "", bed: "", mood: "ok" });
      const bedList = resolveBedList(beds);

      const addEntry = () => {
        if (!entry.text.trim()) return;
        setJournal(prev => [{
          id: Date.now(),
          date: toISODate(new Date()),
          text: entry.text.trim(),
          bed: entry.bed || null,
          mood: entry.mood,
        }, ...prev]);
        setEntry({ text: "", bed: "", mood: "ok" });
        setShowAdd(false);
      };

      const moodIcon = { great: "😊", ok: "😐", bad: "😟" };

      return (
        <div className="pb-24">
          <Header title="Garden Journal" right={
            <button onClick={() => setShowAdd(true)} className="text-xs bg-sage-600 text-white px-2.5 py-1.5 rounded-lg font-medium">+ Entry</button>
          } />
          <div className="px-4 pt-4 space-y-3">
            {journal.length === 0 && (
              <div className="text-center py-12 text-sage-400">
                <p className="text-3xl mb-2">📓</p>
                <p className="text-sm">No entries yet</p>
                <p className="text-xs mt-1">Log what worked, pests, weather notes…</p>
                <button onClick={() => setShowAdd(true)} className="mt-4 text-sm text-sage-600 font-medium underline">Write first entry</button>
              </div>
            )}
            {journal.map(e => (
              <div key={e.id} className="bg-white rounded-2xl p-4 card-shadow">
                <div className="flex justify-between items-start mb-1">
                  <p className="text-xs text-sage-500">{fmtDate(e.date)} {e.bed && `· ${bedLabel(bedList, e.bed)}`}</p>
                  <span>{moodIcon[e.mood] || "😐"}</span>
                </div>
                <p className="text-sm text-sage-800 whitespace-pre-wrap">{e.text}</p>
                <button
                  onClick={() => { if (confirm("Delete entry?")) setJournal(prev => prev.filter(x => x.id !== e.id)); }}
                  className="text-[10px] text-sage-400 mt-2 hover:text-red-500"
                >
                  Delete
                </button>
              </div>
            ))}
          </div>

          {showAdd && (
            <div className="fixed inset-0 bg-black/40 z-[100] flex items-end sm:items-center justify-center px-4 pt-4 pb-24">
              <div className="bg-white rounded-2xl p-5 w-full max-w-sm">
                <h3 className="font-semibold text-sage-800 mb-3">New journal entry</h3>
                <textarea
                  className="w-full border rounded-xl px-3 py-2 text-sm mb-2 h-28"
                  placeholder="What happened in the garden today?"
                  value={entry.text}
                  onChange={e => setEntry(n => ({ ...n, text: e.target.value }))}
                />
                <select className="w-full border rounded-xl px-3 py-2 text-sm mb-2" value={entry.bed} onChange={e => setEntry(n => ({ ...n, bed: e.target.value }))}>
                  <option value="">Whole garden</option>
                  {bedList.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                </select>
                <div className="flex gap-2 mb-3">
                  {["great", "ok", "bad"].map(m => (
                    <button key={m} onClick={() => setEntry(n => ({ ...n, mood: m }))}
                      className={`flex-1 py-2 rounded-xl text-lg ${entry.mood === m ? "bg-sage-100 ring-2 ring-sage-500" : "bg-sage-50"}`}>
                      {moodIcon[m]}
                    </button>
                  ))}
                </div>
                <div className="flex gap-2">
                  <button onClick={() => setShowAdd(false)} className="flex-1 py-2.5 rounded-xl border text-sm">Cancel</button>
                  <button onClick={addEntry} className="flex-1 py-2.5 rounded-xl bg-sage-600 text-white text-sm font-medium">Save</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function SettingsScreen({
      profile, setProfile, setShowOnboarding,
      exportData, importData, resetDemo, clearGarden,
    }) {
      const [form, setForm] = useState(() => ({
        ...profile,
        navSlots: getNavSlots(profile),
      }));
      const [notifyState, setNotifyState] = useState(
        typeof Notification !== "undefined" ? Notification.permission : "denied"
      );
      const fileRef = React.useRef(null);

      const save = () => {
        const navSlots = getNavSlots({ navSlots: form.navSlots });
        setProfile({ ...form, navSlots, onboarded: true });
        if (form.city) {
          try {
            const loc = JSON.parse(localStorage.getItem("pp_location") || "{}");
            localStorage.setItem("pp_location", JSON.stringify({ ...loc, name: form.city }));
          } catch (e) {}
        }
        alert("Settings saved — bottom tabs updated.");
      };

      const enableNotifications = async () => {
        const p = await requestNotifyPermission();
        setNotifyState(p);
        if (p === "granted") {
          sendLocalNotification("PlotPilot alerts on", "You'll get a notice when frost risk is high.");
        } else {
          alert("Notifications blocked. Enable them in browser site settings.");
        }
      };

      return (
        <div className="pb-24">
          <Header title="Settings" />
          <div className="px-4 pt-4 space-y-4">
            <div className="bg-white rounded-2xl p-4 card-shadow space-y-3">
              <h3 className="font-semibold text-sage-800 text-sm">Location & climate</h3>
              <div>
                <label className="text-xs text-sage-500">Display name / city</label>
                <input className="w-full border rounded-xl px-3 py-2 text-sm mt-1" value={form.city || ""} onChange={e => setForm(f => ({ ...f, city: e.target.value }))} placeholder="e.g. Austin, TX" />
              </div>
              <div>
                <label className="text-xs text-sage-500">USDA hardiness zone</label>
                <input className="w-full border rounded-xl px-3 py-2 text-sm mt-1" value={form.zone || ""} onChange={e => setForm(f => ({ ...f, zone: e.target.value }))} placeholder="e.g. 8b" />
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-xs text-sage-500">Last spring frost</label>
                  <input type="date" className="w-full border rounded-xl px-2 py-2 text-sm mt-1" value={form.lastFrost || ""} onChange={e => setForm(f => ({ ...f, lastFrost: e.target.value }))} />
                </div>
                <div>
                  <label className="text-xs text-sage-500">First fall frost</label>
                  <input type="date" className="w-full border rounded-xl px-2 py-2 text-sm mt-1" value={form.firstFrost || ""} onChange={e => setForm(f => ({ ...f, firstFrost: e.target.value }))} />
                </div>
              </div>
              <button onClick={save} className="w-full py-2.5 rounded-xl bg-sage-600 text-white text-sm font-medium">Save</button>
            </div>

            <div className="bg-white rounded-2xl p-4 card-shadow space-y-3">
              <h3 className="font-semibold text-sage-800 text-sm">Bottom tab priorities</h3>
              <p className="text-xs text-sage-500">
                Home and More stay fixed. Put any 3 screens on the bar — including ones that normally live under More (Seed Vault, Calendar, Journal, etc.).
              </p>
              {/* Live preview */}
              <div className="flex justify-around items-center bg-sage-50 rounded-xl py-2 px-1 border border-sage-100">
                <span className="text-[9px] text-sage-500 flex flex-col items-center gap-0.5"><i className="fas fa-home"></i>Home</span>
                {(form.navSlots || DEFAULT_NAV_SLOTS).map((id, i) => (
                  <span key={i} className="text-[9px] text-sage-700 font-semibold flex flex-col items-center gap-0.5">
                    <i className={`fas ${tabMeta(id).icon}`}></i>
                    {tabMeta(id).short || tabMeta(id).label}
                  </span>
                ))}
                <span className="text-[9px] text-sage-500 flex flex-col items-center gap-0.5"><i className="fas fa-ellipsis-h"></i>More</span>
              </div>
              {(form.navSlots || DEFAULT_NAV_SLOTS).map((id, idx) => (
                <div key={`slot-${idx}`} className="bg-sage-50 rounded-xl p-2.5 space-y-2">
                  <div className="flex items-center gap-2">
                    <span className="text-[10px] font-bold text-sage-500 w-12">Slot {idx + 1}</span>
                    <select
                      className="flex-1 border rounded-lg px-2 py-1.5 text-sm bg-white"
                      value={id}
                      onChange={e => {
                        const nextId = e.target.value;
                        setForm(f => {
                          let slots = [...(f.navSlots || DEFAULT_NAV_SLOTS)];
                          // If nextId already in another slot, swap
                          const other = slots.indexOf(nextId);
                          if (other >= 0 && other !== idx) {
                            slots[other] = slots[idx];
                          }
                          slots[idx] = nextId;
                          return { ...f, navSlots: slots };
                        });
                      }}
                    >
                      {TAB_CATALOG.map(t => (
                        <option key={t.id} value={t.id}>
                          {t.label}{t.desc ? ` — ${t.desc}` : ""}
                        </option>
                      ))}
                    </select>
                    <button
                      type="button"
                      disabled={idx === 0}
                      onClick={() => setForm(f => {
                        const slots = [...(f.navSlots || DEFAULT_NAV_SLOTS)];
                        [slots[idx - 1], slots[idx]] = [slots[idx], slots[idx - 1]];
                        return { ...f, navSlots: slots };
                      })}
                      className="w-8 h-8 rounded-lg border text-sage-600 disabled:opacity-30"
                      title="Move up"
                    >↑</button>
                    <button
                      type="button"
                      disabled={idx >= 2}
                      onClick={() => setForm(f => {
                        const slots = [...(f.navSlots || DEFAULT_NAV_SLOTS)];
                        [slots[idx + 1], slots[idx]] = [slots[idx], slots[idx + 1]];
                        return { ...f, navSlots: slots };
                      })}
                      className="w-8 h-8 rounded-lg border text-sage-600 disabled:opacity-30"
                      title="Move down"
                    >↓</button>
                  </div>
                </div>
              ))}
              <div>
                <p className="text-[10px] text-sage-500 mb-1.5">Still under More (tap to put on bar — replaces slot 3):</p>
                <div className="flex flex-wrap gap-1.5">
                  {TAB_CATALOG.filter(t => !(form.navSlots || DEFAULT_NAV_SLOTS).includes(t.id)).map(t => (
                    <button
                      key={t.id}
                      type="button"
                      onClick={() => setForm(f => {
                        const slots = [...(f.navSlots || DEFAULT_NAV_SLOTS)];
                        slots[2] = t.id;
                        return { ...f, navSlots: slots };
                      })}
                      className="text-[10px] px-2 py-1 rounded-lg border border-sage-200 bg-white text-sage-700 hover:bg-sage-50"
                    >
                      <i className={`fas ${t.icon} mr-1 text-sage-500`}></i>{t.label}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <p className="text-[10px] text-sage-500 mb-1.5">Quick presets</p>
                <div className="flex flex-wrap gap-1.5">
                  {NAV_PRESETS.map(p => (
                    <button
                      key={p.label}
                      type="button"
                      onClick={() => setForm(f => ({ ...f, navSlots: [...p.slots] }))}
                      className="text-[10px] px-2 py-1 rounded-lg bg-sage-100 text-sage-800 font-medium"
                    >
                      {p.label}
                    </button>
                  ))}
                </div>
              </div>
              <button onClick={save} className="w-full py-2.5 rounded-xl bg-sage-600 text-white text-sm font-medium">Save tab order</button>
            </div>

            <div className="bg-white rounded-2xl p-4 card-shadow space-y-2">
              <h3 className="font-semibold text-sage-800 text-sm">Notifications</h3>
              <p className="text-xs text-sage-500">Frost risk alerts while the app is open (browser permission).</p>
              <p className="text-[10px] text-sage-400">Status: {notifyState}</p>
              <button type="button" onClick={enableNotifications} className="w-full py-2.5 rounded-xl border border-sage-300 text-sage-700 text-sm font-medium">
                Enable frost alerts
              </button>
            </div>

            <div className="bg-white rounded-2xl p-4 card-shadow space-y-2">
              <h3 className="font-semibold text-sage-800 text-sm">Backup & data</h3>
              <button type="button" onClick={exportData} className="w-full py-2.5 rounded-xl border border-sage-300 text-sage-700 text-sm font-medium">
                📥 Export backup (JSON)
              </button>
              <button type="button" onClick={() => fileRef.current && fileRef.current.click()} className="w-full py-2.5 rounded-xl border border-sage-300 text-sage-700 text-sm font-medium">
                📤 Import backup
              </button>
              <input
                ref={fileRef}
                type="file"
                accept="application/json,.json"
                className="hidden"
                onChange={(e) => {
                  const file = e.target.files && e.target.files[0];
                  if (file && importData) importData(file);
                  e.target.value = "";
                }}
              />
              <button
                type="button"
                onClick={() => {
                  if (confirm("Clear all beds, tasks, journal? Profile/zone is kept.")) clearGarden();
                }}
                className="w-full py-2.5 rounded-xl border border-amber-300 text-amber-800 text-sm font-medium"
              >
                Start empty garden
              </button>
              <button
                type="button"
                onClick={() => {
                  if (confirm("Reload sample demo garden data?")) resetDemo();
                }}
                className="w-full py-2.5 rounded-xl border border-sage-200 text-sage-600 text-sm"
              >
                Restore demo sample data
              </button>
            </div>

            <button onClick={() => setShowOnboarding(true)} className="w-full py-2.5 rounded-xl border border-sage-300 text-sage-700 text-sm">
              Re-run onboarding
            </button>
            <p className="text-[10px] text-sage-400 text-center">Data stays in this browser (localStorage). Export often.</p>
          </div>
        </div>
      );
    }

    function OnboardingModal({ profile, setProfile, onDone, onStartEmpty, onStartDemo }) {
      const [step, setStep] = useState(1);
      const [form, setForm] = useState({
        city: profile.city || "",
        zone: profile.zone || "7a",
        lastFrost: profile.lastFrost || "2026-04-15",
        firstFrost: profile.firstFrost || "2026-10-25",
        navSlots: profile.navSlots || [...DEFAULT_NAV_SLOTS],
      });
      const [wantEmpty, setWantEmpty] = useState(false);

      const toggleNavSlot = (id) => {
        setForm(f => {
          let slots = [...(f.navSlots || [])];
          if (slots.includes(id)) {
            slots = slots.filter(x => x !== id);
          } else if (slots.length < 3) {
            slots = [...slots, id];
          } else {
            // replace last
            slots = [...slots.slice(0, 2), id];
          }
          return { ...f, navSlots: slots };
        });
      };

      const finish = () => {
        if (!form.lastFrost || !form.firstFrost) {
          alert("Frost dates help PlotPilot schedule planting. Please set both, or use the suggested defaults.");
          return;
        }
        const navSlots = getNavSlots({ navSlots: form.navSlots });
        setProfile({ ...form, navSlots, onboarded: true });
        if (wantEmpty && onStartEmpty) onStartEmpty();
        else if (!wantEmpty && onStartDemo) onStartDemo();
        onDone();
      };

      return (
        <div className="fixed inset-0 bg-sage-900/60 z-[60] flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl p-6 w-full max-w-sm card-shadow max-h-[90vh] overflow-y-auto">
            <p className="text-3xl text-center mb-2">🌱</p>
            <h2 className="text-lg font-bold text-sage-800 text-center mb-1">Welcome to PlotPilot</h2>
            <p className="text-xs text-sage-500 text-center mb-4">Set up climate and your favorite tabs</p>
            <div className="flex gap-1 mb-4">
              {[1, 2, 3, 4].map(s => <div key={s} className={`h-1 flex-1 rounded-full ${step >= s ? "bg-sage-600" : "bg-sage-200"}`} />)}
            </div>
            {step === 1 && (
              <div className="space-y-3">
                <div>
                  <label className="text-xs text-sage-500">Your city or region</label>

                  <p className="text-[10px] text-sage-400 mt-1">Find it at planthardiness.ars.usda.gov</p>
                </div>
                <button type="button" onClick={() => setStep(2)} className="w-full py-3 rounded-xl bg-sage-600 text-white font-medium">Next</button>
              </div>

            {step === 2 && (

                  <input type="date" className="w-full border rounded-xl px-3 py-2.5 text-sm mt-1" value={form.firstFrost} onChange={e => setForm(f => ({ ...f, firstFrost: e.target.value }))} />
                </div>
                <button type="button" onClick={() => setStep(3)} className="w-full py-3 rounded-xl bg-sage-600 text-white font-medium">Next</button>
                <button type="button" onClick={() => setStep(1)} className="w-full text-xs text-sage-500">Back</button>
              </div>
            )}
            {step === 3 && (
              <div className="space-y-3">
                <p className="text-sm text-sage-700 font-medium">Priority tabs (pick up to 3)</p>
                <p className="text-[10px] text-sage-500">These sit on your bottom bar between Home and More. Order is the order you select.</p>
                <div className="grid grid-cols-2 gap-2 max-h-56 overflow-y-auto">
                  {TAB_CATALOG.map(t => {

                <button type="button" onClick={() => setStep(4)} className="w-full py-3 rounded-xl bg-sage-600 text-white font-medium">Next</button>
                <button type="button" onClick={() => setStep(2)} className="w-full text-xs text-sage-500">Back</button>

            {step === 4 && (
              <div className="space-y-3">

                <button
                  type="button"
                  onClick={() => setWantEmpty(true)}

                <button type="button" onClick={finish} className="w-full py-3 rounded-xl bg-sage-600 text-white font-medium">Start gardening</button>
                <button type="button" onClick={() => setStep(3)} className="w-full text-xs text-sage-500">Back</button>
