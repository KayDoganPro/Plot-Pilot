      const lowStock = seeds.filter(s => s.low || s.qty <= 3).length;
      const toggleTask = (id) => {
        setTasks(prev => prev.map(t => t.id === id ? { ...t, done: !t.done } : t));
      };

      const [weather, setWeather] = useState(null);
      const [weatherLoading, setWeatherLoading] = useState(true);
      const [weatherError, setWeatherError] = useState(null);
      const [location, setLocation] = useState(() => {
        const saved = localStorage.getItem("pp_location");
        return saved ? JSON.parse(saved) : { name: "Austin, TX", lat: 30.27, lon: -97.74, zone: "8b" };
      });
      const [showLocEdit, setShowLocEdit] = useState(false);
      const [locQuery, setLocQuery] = useState("");

      useEffect(() => {
        localStorage.setItem("pp_location", JSON.stringify(location));
      }, [location]);

      useEffect(() => {
        let cancelled = false;
        setWeatherLoading(true);
        setWeatherError(null);

        const fallbackWeather = () => {
          // Realistic demo data so UI always works offline / rate-limited
          const today = new Date();
          const iso = (d) => d.toISOString().slice(0, 10);
          const d0 = iso(today);
          const d1 = iso(new Date(today.getTime() + 86400000));
          const d2 = iso(new Date(today.getTime() + 172800000));
          return {
            current: {
              temperature_2m: 74,
              relative_humidity_2m: 58,
              weather_code: 2,
              wind_speed_10m: 8,
              precipitation: 0,
            },
            daily: {
              time: [d0, d1, d2],
              temperature_2m_max: [82, 79, 85],
              temperature_2m_min: [61, 58, 63],
              precipitation_sum: [0, 0.12, 0],
              weather_code: [2, 61, 1],
              precipitation_probability_max: [10, 40, 5],
            },
          };
        };

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${location.lat}&longitude=${location.lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,precipitation&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code,precipitation_probability_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=3`;
        fetch(url)
          .then(r => r.json())
          .then(data => {
            if (cancelled) return;
            if (data.error || !data.current) throw new Error(data.reason || "No data");
            setWeather(data);
            setWeatherLoading(false);
          })
          .catch(() => {
            if (cancelled) return;
            setWeather(fallbackWeather());
            setWeatherError(null); // silent fallback — still show useful UI
            setWeatherLoading(false);
          });
        return () => { cancelled = true; };
      }, [location.lat, location.lon]);

      const searchLocation = async () => {
        if (!locQuery.trim()) return;
        try {
          const res = await fetch(
            `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(locQuery.trim())}&count=1&language=en&format=json`
          );
          const data = await res.json();
          if (data.results && data.results[0]) {
            const r = data.results[0];
            setLocation({
              name: `${r.name}${r.admin1 ? ", " + r.admin1 : ""}`,
              lat: r.latitude,
              lon: r.longitude,
              zone: location.zone || "—",
            });
            setShowLocEdit(false);
            setLocQuery("");
          } else {
            alert("Location not found. Try a city name.");
          }
        } catch {
          alert("Search failed. Check connection.");
        }
      };

      // Garden advice from weather
      const gardenAdvice = () => {
        if (!weather?.current) return [];
        const tips = [];
        const t = weather.current.temperature_2m;
        const minTonight = weather.daily?.temperature_2m_min?.[0];
        const precip = weather.current.precipitation || 0;
        const precipToday = weather.daily?.precipitation_sum?.[0] || 0;
        const humidity = weather.current.relative_humidity_2m;

        if (minTonight != null && minTonight <= 36) {
          tips.push({ level: "warn", text: `Frost risk tonight (low ${Math.round(minTonight)}°F) — cover tender plants` });
        } else if (minTonight != null && minTonight <= 42) {
          tips.push({ level: "info", text: `Chilly night ahead (${Math.round(minTonight)}°F) — watch tender seedlings` });
        } else {
          tips.push({ level: "ok", text: "Low frost risk tonight" });
        }

        if (precipToday >= 0.15 || precip > 0) {
          tips.push({ level: "ok", text: "Rain expected — skip or reduce watering" });
        } else if (t >= 85 && humidity < 50) {
          tips.push({ level: "warn", text: "Hot & dry — water deeply this morning or evening" });
        } else if (t >= 75) {
          tips.push({ level: "info", text: "Warm day — check soil moisture on containers" });
        } else {
          tips.push({ level: "info", text: "Good conditions for outdoor work" });
        }

        if (humidity >= 80 && t >= 60) {
          tips.push({ level: "info", text: "High humidity — watch for fungal issues" });
        }
        return tips;
      };

      const currentWx = weather?.current ? weatherIcon(weather.current.weather_code) : null;
      const temp = weather?.current ? Math.round(weather.current.temperature_2m) : null;
      const minT = weather?.daily?.temperature_2m_min?.[0];
      const frostLevel =
        minT == null ? "unknown" :
        minT <= 32 ? "likely" :
        minT <= 36 ? "risk" :
        minT <= 42 ? "chilly" : "low";
      const frostLabel =
        frostLevel === "likely" ? "Frost likely" :
        frostLevel === "risk" ? "Frost risk" :
        frostLevel === "chilly" ? "Chilly" :
        frostLevel === "low" ? "Low frost" : "—";

      // Header badge styling by frost severity
      const frostBadgeClass =
        frostLevel === "likely"
          ? "bg-red-500 text-white ring-2 ring-red-300"
          : frostLevel === "risk"
          ? "bg-amber-500 text-white ring-2 ring-amber-300"
          : frostLevel === "chilly"
          ? "bg-sky-100 text-sky-800"
          : "bg-white text-sage-800";

      return (
        <div className="pb-24">
          <Header
            title="PlotPilot"
            right={
              <button
                onClick={() => setShowLocEdit(true)}
                className={`flex items-center gap-1.5 rounded-full px-3 py-1.5 card-shadow text-sm transition ${frostBadgeClass}`}
                title={minT != null ? `Tonight's low: ${Math.round(minT)}°F` : "Weather"}
              >
                {(frostLevel === "likely" || frostLevel === "risk") ? (
                  <span className="text-base" aria-hidden>❄️</span>
                ) : (
                  <span>{currentWx?.icon || "🌡️"}</span>
                )}
                <span className="font-medium">
                  {weatherLoading ? "…" : `${temp ?? "--"}°F`}
                </span>
                <span className={`text-xs font-semibold ml-0.5 ${
                  frostLevel === "likely" || frostLevel === "risk" ? "opacity-95" : "text-sage-500"
                }`}>
                  {frostLabel}
                </span>
              </button>
            }
          />

          {/* Frost alert banner — only when risk is elevated */}
          {(frostLevel === "likely" || frostLevel === "risk") && !weatherLoading && (
            <div className={`mx-4 mt-3 rounded-xl px-3 py-2.5 flex items-center gap-2 text-sm font-medium ${
              frostLevel === "likely"
                ? "bg-red-50 text-red-800 border border-red-200"
                : "bg-amber-50 text-amber-900 border border-amber-200"
            }`}>
              <span className="text-lg">❄️</span>
              <div className="flex-1 leading-tight">
                <p className="font-semibold">
                  {frostLevel === "likely" ? "Frost likely tonight" : "Frost risk tonight"}
                </p>
                <p className="text-xs opacity-80 font-normal">
                  Low {Math.round(minT)}°F — cover tomatoes, peppers & tender seedlings
                </p>
              </div>
            </div>
          )}

          <div className="px-4 pt-4 space-y-5">
            {/* Weather card */}
            <section className="bg-white rounded-2xl p-4 card-shadow">
              <div className="flex justify-between items-start mb-3">
                <div>
                  <p className="text-xs text-sage-500">Garden weather</p>
                  <p className="font-semibold text-sage-800 text-sm">{location.name}</p>
                </div>
                <button
                  onClick={() => setShowLocEdit(true)}
                  className="text-[10px] text-sage-500 underline"
                >
                  Change
                </button>
              </div>

              {weatherLoading && (
                <p className="text-sm text-sage-400 py-4 text-center">Loading weather…</p>
              )}
              {weatherError && (
                <p className="text-sm text-amber-600 py-2">{weatherError}. Using offline tips.</p>
              )}
              {weather && !weatherLoading && (
                <>
                  <div className="flex items-center gap-4 mb-3">
                    <span className="text-4xl">{currentWx?.icon}</span>
                    <div>
                      <p className="text-2xl font-bold text-sage-800">{temp}°F</p>
                      <p className="text-xs text-sage-500">
                        {currentWx?.label} · H {Math.round(weather.daily.temperature_2m_max[0])}° / L {Math.round(weather.daily.temperature_2m_min[0])}°
                      </p>
                      <p className="text-[10px] text-sage-400">
                        Humidity {weather.current.relative_humidity_2m}% · Wind {Math.round(weather.current.wind_speed_10m)} mph
                      </p>
                    </div>
                  </div>

                  {/* 3-day strip */}
                  <div className="grid grid-cols-3 gap-2 mb-3">
                    {weather.daily.time.slice(0, 3).map((day, i) => {
                      const w = weatherIcon(weather.daily.weather_code[i]);
                      const d = new Date(day + "T12:00:00");
                      const label = i === 0 ? "Today" : d.toLocaleDateString("en-US", { weekday: "short" });
                      return (
                        <div key={day} className="bg-sage-50 rounded-xl p-2 text-center">
                          <p className="text-[10px] text-sage-500 font-medium">{label}</p>
                          <p className="text-lg my-0.5">{w.icon}</p>
                          <p className="text-[10px] text-sage-700">
                            {Math.round(weather.daily.temperature_2m_max[i])}° / {Math.round(weather.daily.temperature_2m_min[i])}°
                          </p>
                        </div>
                      );
                    })}
                  </div>

                  {/* Garden tips */}
                  <div className="space-y-1.5">
                    {gardenAdvice().map((tip, i) => (
                      <div
                        key={i}
                        className={`text-xs rounded-lg px-2.5 py-1.5 flex items-start gap-2 ${
                          tip.level === "warn" ? "bg-amber-50 text-amber-800" :
                          tip.level === "ok" ? "bg-green-50 text-green-800" :
                          "bg-sage-50 text-sage-700"
                        }`}
                      >
                        <span>{tip.level === "warn" ? "⚠️" : tip.level === "ok" ? "✓" : "ℹ️"}</span>
                        <span>{tip.text}</span>
                      </div>
                    ))}
                  </div>
                </>
              )}
            </section>

            {/* Location edit modal */}
            {showLocEdit && (
              <div className="fixed inset-0 bg-black/40 z-50 flex items-end sm:items-center justify-center p-4">
                <div className="bg-white rounded-2xl p-5 w-full max-w-sm card-shadow">
                  <h3 className="font-semibold text-sage-800 mb-1">Garden location</h3>
                  <p className="text-xs text-sage-500 mb-3">Used for weather and frost advice</p>
                  <input
                    type="text"
                    value={locQuery}
                    onChange={e => setLocQuery(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && searchLocation()}
                    placeholder="City name (e.g. Denver, CO)"
                    className="w-full border border-sage-200 rounded-xl px-3 py-2.5 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-sage-400"
                  />
                  <p className="text-[10px] text-sage-400 mb-3">Current: {location.name}</p>
                  <div className="flex gap-2">
                    <button
                      onClick={() => setShowLocEdit(false)}
                      className="flex-1 py-2.5 rounded-xl border border-sage-200 text-sage-600 text-sm font-medium"
                    >
                      Cancel
                    </button>
                    <button
                      onClick={searchLocation}
                      className="flex-1 py-2.5 rounded-xl bg-sage-600 text-white text-sm font-medium"
                    >
                      Update
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Today's Tasks */}
            <section>
              <div className="flex items-center justify-between mb-3">
                <h2 className="font-semibold text-sage-800 flex items-center gap-2">
                  <i className="fas fa-tasks text-sage-500"></i> Today's Tasks
                </h2>
                <button className="text-xs text-sage-500">View all</button>
              </div>
              <div className="space-y-2">
                {tasks.map(task => (
                  <div
                    key={task.id}
                    onClick={() => toggleTask(task.id)}
                    className={`flex items-center gap-3 bg-white rounded-xl p-3 card-shadow cursor-pointer transition ${
                      task.done ? "opacity-60" : ""
                    }`}
                  >
                    <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center ${
                      task.done ? "bg-sage-500 border-sage-500 text-white" : "border-sage-300"
                    }`}>
                      {task.done && <i className="fas fa-check text-xs"></i>}
                    </div>
                    <div className="flex-1">
                      <p className={`font-medium ${task.done ? "line-through text-sage-400" : "text-sage-800"}`}>
                        {task.title}
                      </p>
                      <p className="text-xs text-sage-500">{task.detail}</p>
                    </div>
                    <span className="text-xl">{task.icon}</span>
                  </div>
                ))}
              </div>
            </section>

            {/* Garden Overview */}
            <section>
              <div className="flex items-center justify-between mb-3">
                <h2 className="font-semibold text-sage-800">Garden Overview</h2>
                <span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full">Healthy</span>
              </div>
              <div className="bg-white rounded-2xl p-4 card-shadow">
                <div className="grid grid-cols-2 gap-2">
                  {BEDS.map(bed => {
                    const bedIcons = placed
                      .filter(p => p.bed === bed.id)
                      .map(p => PLANT_LIBRARY.find(pl => pl.id === p.plant)?.icon || "🌱")
                      .slice(0, 4);
                    return (
                      <div key={bed.id} className={`${bed.color} border rounded-xl p-2 text-center`}>
                        <div className="text-lg mb-1 min-h-[28px]">
                          {bedIcons.length > 0 ? bedIcons.join("") : <span className="text-sage-300 text-sm">empty</span>}
                        </div>
                        <p className="text-[10px] font-medium text-sage-700 leading-tight">{bed.name}</p>
                      </div>
                    );
                  })}
                </div>
                <button className="w-full mt-3 text-sm text-sage-600 font-medium py-2 border border-sage-200 rounded-xl">
                  View full layout →
                </button>
              </div>
            </section>

            {/* Seed Vault Alert + Harvest */}
            <div className="grid grid-cols-2 gap-3">
              <div className="bg-white rounded-2xl p-4 card-shadow">
                <div className="flex items-center gap-2 mb-2">
                  <i className="fas fa-box text-sage-500"></i>
                  <span className="font-medium text-sm">Seed Vault</span>
                </div>
                {lowStock > 0 ? (
                  <div className="bg-amber-50 text-amber-700 text-xs rounded-lg px-2 py-1.5 flex items-center gap-1">
                    <i className="fas fa-exclamation-triangle"></i>
                    {lowStock} low stock
                  </div>
                ) : (
                  <p className="text-xs text-sage-500">All good</p>
                )}
              </div>
              <div className="bg-white rounded-2xl p-4 card-shadow">
                <div className="flex items-center gap-2 mb-2">
                  <i className="fas fa-calendar text-sage-500"></i>
                  <span className="font-medium text-sm">Next Harvest</span>
                </div>
                {(() => {
                  const upcoming = placed
                    .filter(p => p.status !== "harvested" && p.plantedAt)
                    .map(p => {
                      const pl = PLANT_LIBRARY.find(x => x.id === p.plant);
                      if (!pl || !pl.daysToHarvest || pl.daysToHarvest >= 200) return null;
                      const harvest = addDays(new Date(p.plantedAt + "T12:00:00"), pl.daysToHarvest);
                      return { name: pl.name, icon: pl.icon, date: harvest };
                    })
                    .filter(Boolean)
                    .sort((a, b) => a.date - b.date)
                    .slice(0, 2);
                  if (!upcoming.length) return <p className="text-xs text-sage-400">Plant something to see dates</p>;
                  return upcoming.map((u, i) => (
                    <p key={i} className="text-xs text-sage-600">{u.icon} {u.name} · {fmtDate(u.date)}</p>
                  ));
                })()}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function LayoutPlanner({ placed, setPlaced, setTasks }) {
      const [dragPlantId, setDragPlantId] = useState(null);       // plant type being dragged from library
      const [dragPlacedId, setDragPlacedId] = useState(null);     // unique id of placed plant being moved
      const [dragOverBed, setDragOverBed] = useState(null);
      const [justDropped, setJustDropped] = useState(null);
      const [suggestions, setSuggestions] = useState([]);
      const [suggestBed, setSuggestBed] = useState(null); // null = whole garden
      const [undoStack, setUndoStack] = useState([]);

      const pushUndo = (snapshot) => {
        setUndoStack(prev => [...prev.slice(-9), snapshot]);
      };

      const undo = () => {
        if (undoStack.length === 0) return;
        const prev = undoStack[undoStack.length - 1];
        setUndoStack(s => s.slice(0, -1));
        setPlaced(prev);
      };

      const setPlantStatus = (id, status) => {
        pushUndo(placed);
        setPlaced(prev => prev.map(p => p.id === id ? { ...p, status } : p));
      };

      // ----- Drag from Plant Library -----
      const onLibraryDragStart = (e, plantId) => {
        setDragPlantId(plantId);
        setDragPlacedId(null);
        e.dataTransfer.setData("text/plain", JSON.stringify({ type: "library", plantId }));
        e.dataTransfer.effectAllowed = "copy";
      };

      // ----- Drag already-placed plant -----
      const onPlacedDragStart = (e, item) => {
        setDragPlacedId(item.id);
        setDragPlantId(null);
        e.dataTransfer.setData("text/plain", JSON.stringify({ type: "placed", id: item.id }));
        e.dataTransfer.effectAllowed = "move";
      };

      const onDragEnd = () => {
        setDragPlantId(null);
        setDragPlacedId(null);
        setDragOverBed(null);
      };

      // ----- Companion helpers (must be before onDrop) -----
      const getRelation = (a, b) => {
        if (!a || !b || a === b) return 0;
        return COMPANION_MATRIX[a]?.[b] ?? COMPANION_MATRIX[b]?.[a] ?? 0;
      };

      const computeSuggestions = (bedId = null) => {
        const relevantPlaced = bedId
          ? placed.filter(p => p.bed === bedId)
          : placed;
        const currentIds = [...new Set(relevantPlaced.map(p => p.plant))];
        if (currentIds.length === 0) {
          setSuggestions([]);
          setSuggestBed(bedId);
          return;
        }

        const scores = PLANT_LIBRARY
          .filter(pl => !currentIds.includes(pl.id))
          .map(pl => {
            let score = 0;
            let goodWith = [];
            let badWith = [];
            currentIds.forEach(cid => {
              const rel = getRelation(pl.id, cid);
              score += rel;
              if (rel > 0) goodWith.push(PLANT_LIBRARY.find(x => x.id === cid)?.name || cid);
              if (rel < 0) badWith.push(PLANT_LIBRARY.find(x => x.id === cid)?.name || cid);
            });
            return { ...pl, score, goodWith, badWith };
          })
          .filter(s => s.score > 0 || s.badWith.length > 0)
          .sort((a, b) => b.score - a.score);

        setSuggestions(scores);
        setSuggestBed(bedId);
      };

      // ----- Drop zone handlers -----
      const onDragOver = (e, bedId) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = dragPlantId ? "copy" : "move";
        setDragOverBed(bedId);
      };

      const onDragLeave = () => setDragOverBed(null);

      const onDrop = (e, bedId) => {
        e.preventDefault();
        setDragOverBed(null);
        try {
          const data = JSON.parse(e.dataTransfer.getData("text/plain"));
          if (data.type === "library") {
            // Check companions before adding
            const bedPlants = placed.filter(p => p.bed === bedId).map(p => p.plant);
            const conflicts = bedPlants.filter(pid => getRelation(data.plantId, pid) < 0);
            if (conflicts.length > 0) {
              const names = conflicts.map(c => PLANT_LIBRARY.find(p => p.id === c)?.name || c).join(", ");
              if (!confirm(`⚠️ ${PLANT_LIBRARY.find(p => p.id === data.plantId)?.name} may conflict with: ${names}.\n\nPlant anyway?`)) {
                setDragPlantId(null);
                setDragPlacedId(null);
                return;
              }
            }
            pushUndo(placed);
            const plantInfo = PLANT_LIBRARY.find(p => p.id === data.plantId);
            const plantedAt = toISODate(new Date());
            const newItem = {
              id: Date.now() + Math.random(),
              bed: bedId,
              plant: data.plantId,
              plantedAt,
              status: "growing",
            };
            setPlaced(prev => [...prev, newItem]);
            setJustDropped(newItem.id);
            setTimeout(() => setJustDropped(null), 600);
            // Auto-create timeline tasks
            if (setTasks && plantInfo) {
              const tasksToAdd = [];
              if (plantInfo.germDays) {
                tasksToAdd.push({
                  id: Date.now() + 1,
                  title: `Check ${plantInfo.name} germination`,
                  detail: `~${plantInfo.germDays} days · ${fmtDate(addDays(new Date(), plantInfo.germDays))}`,
                  done: false,
                  icon: "🌱",
                  due: toISODate(addDays(new Date(), plantInfo.germDays)),
                });
              }
              if (plantInfo.fertilizeEveryDays > 0) {
                tasksToAdd.push({
                  id: Date.now() + 2,
                  title: `Fertilize ${plantInfo.name}`,
                  detail: `Every ~${plantInfo.fertilizeEveryDays} days`,
                  done: false,
                  icon: "🧪",
                  due: toISODate(addDays(new Date(), plantInfo.fertilizeEveryDays)),
                });
              }
              if (plantInfo.daysToHarvest && plantInfo.daysToHarvest < 200) {
                tasksToAdd.push({
                  id: Date.now() + 3,
                  title: `Harvest window: ${plantInfo.name}`,
                  detail: `~${plantInfo.daysToHarvest} days · ${fmtDate(addDays(new Date(), plantInfo.daysToHarvest))}`,
                  done: false,
                  icon: "🧺",
                  due: toISODate(addDays(new Date(), plantInfo.daysToHarvest)),
                });
              }
              if (tasksToAdd.length) setTasks(prev => [...tasksToAdd, ...prev]);
            }
          } else if (data.type === "placed") {
            pushUndo(placed);
            setPlaced(prev => prev.map(p => p.id === data.id ? { ...p, bed: bedId } : p));
          }
        } catch (err) {}
        setDragPlantId(null);
        setDragPlacedId(null);
      };

      const removePlant = (id) => {
        pushUndo(placed);
        setPlaced(prev => prev.filter(p => p.id !== id));
      };

      const clearBed = (bedId) => {
        if (confirm("Clear all plants from this bed?")) {
          pushUndo(placed);
          setPlaced(prev => prev.filter(p => p.bed !== bedId));
        }
      };

      return (
        <div className="pb-24">
          <Header title="Layout Planner" right={
            <div className="flex gap-2 items-center">
              <button
                onClick={undo}
                disabled={undoStack.length === 0}
                className={`text-xs px-2 py-1 rounded-lg font-medium ${
                  undoStack.length ? "bg-sage-100 text-sage-700" : "text-sage-300"
                }`}
                title="Undo"
              >
                ↩ Undo
              </button>
              <span className="text-xs text-sage-500 hidden sm:inline">Drag plants onto beds</span>

    function CalendarScreen({ profile, placed, tasks }) {
      const now = new Date();
      const [viewYear, setViewYear] = useState(now.getFullYear());
      const [viewMonth, setViewMonth] = useState(now.getMonth()); // 0-indexed
      const [selected, setSelected] = useState(now.getDate());

      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const firstDow = new Date(viewYear, viewMonth, 1).getDay();
      const monthName = new Date(viewYear, viewMonth, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });

      const lastFrost = profile?.lastFrost ? new Date(profile.lastFrost + "T12:00:00") : null;
      const firstFrost = profile?.firstFrost ? new Date(profile.firstFrost + "T12:00:00") : null;

      // Build events from plant timelines + frost + tasks with due dates
      const eventsByDay = useMemo(() => {
        const map = {};
        const add = (dateObj, evt) => {
          if (!dateObj || dateObj.getMonth() !== viewMonth || dateObj.getFullYear() !== viewYear) return;
          const d = dateObj.getDate();
          if (!map[d]) map[d] = [];
          map[d].push(evt);
        };

        if (lastFrost) {
          add(lastFrost, { type: "frost", title: "Avg last spring frost", tag: "FROST", color: "bg-sky-100 text-sky-700" });
          PLANT_LIBRARY.forEach(pl => {
            if (pl.startWeeksBeforeFrost > 0) {
              add(addDays(lastFrost, -pl.startWeeksBeforeFrost * 7), {
                type: "sow", title: `Start ${pl.name} indoors`, tag: "SOW", color: "bg-blue-100 text-blue-700",
                detail: `${pl.startWeeksBeforeFrost} weeks before last frost`,
              });
            }
            if (pl.transplantWeeksBeforeFrost > 0) {
              add(addDays(lastFrost, -pl.transplantWeeksBeforeFrost * 7), {
                type: "transplant", title: `Transplant ${pl.name}`, tag: "TRANSPLANT", color: "bg-green-100 text-green-700",
                detail: `${pl.transplantWeeksBeforeFrost} week(s) before last frost`,
              });
            }
          });
        }
        if (firstFrost) {
          add(firstFrost, { type: "frost", title: "Avg first fall frost", tag: "FROST", color: "bg-sky-100 text-sky-700" });
        }

        // From placed plants with plantedAt
        placed.forEach(item => {
          if (!item.plantedAt || item.status === "harvested") return;
          const pl = PLANT_LIBRARY.find(p => p.id === item.plant);
          if (!pl) return;
          const planted = new Date(item.plantedAt + "T12:00:00");
          if (pl.fertilizeEveryDays > 0) {
            add(addDays(planted, pl.fertilizeEveryDays), {
              type: "fertilize", title: `Fertilize ${pl.name}`, tag: "FERTILIZE", color: "bg-orange-100 text-orange-700",
              detail: `Planted ${fmtDate(planted)}`,
            });
          }
          if (pl.daysToHarvest < 200) {
            add(addDays(planted, pl.daysToHarvest), {
              type: "harvest", title: `Harvest ${pl.name}`, tag: "HARVEST", color: "bg-purple-100 text-purple-700",
              detail: `~${pl.daysToHarvest} days after planting`,
            });
          }
        });

        (tasks || []).forEach(t => {
          if (!t.due || t.done) return;
          const due = new Date(t.due + "T12:00:00");
          add(due, { type: "task", title: t.title, tag: "TASK", color: "bg-sage-100 text-sage-700", detail: t.detail });
        });

        return map;
      }, [viewYear, viewMonth, profile, placed, tasks]);

      const shiftMonth = (delta) => {
        let m = viewMonth + delta;
        let y = viewYear;
        if (m < 0) { m = 11; y--; }
        if (m > 11) { m = 0; y++; }
        setViewMonth(m);
        setViewYear(y);
        setSelected(1);
      };

      const dayEvents = eventsByDay[selected] || [];

      return (
        <div className="pb-24">
          <Header title="Season Calendar" />
          <div className="px-4 pt-4">
            {!profile?.lastFrost && (
              <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800 mb-3">
                Set your frost dates in Settings for personalized sow/transplant timing.
              </div>
            )}
            <div className="flex items-center justify-between mb-4">
              <button onClick={() => shiftMonth(-1)} className="text-sage-500 w-8 h-8"><i className="fas fa-chevron-left"></i></button>
              <h2 className="font-semibold text-sage-800">{monthName}</h2>
              <button onClick={() => shiftMonth(1)} className="text-sage-500 w-8 h-8"><i className="fas fa-chevron-right"></i></button>
            </div>

            <div className="bg-white rounded-2xl p-3 card-shadow mb-4">
              <div className="grid grid-cols-7 gap-1 text-center text-xs text-sage-400 mb-2">
                {["S","M","T","W","T","F","S"].map((d, i) => <div key={i}>{d}</div>)}
              </div>
              <div className="grid grid-cols-7 gap-1">
                {Array.from({ length: firstDow }).map((_, i) => <div key={`e${i}`} />)}
                {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(d => {
                  const has = eventsByDay[d] || [];
                  const isSelected = selected === d;
                  const isToday = d === now.getDate() && viewMonth === now.getMonth() && viewYear === now.getFullYear();
                  return (
                    <button
                      key={d}
                      onClick={() => setSelected(d)}
                      className={`aspect-square rounded-lg flex flex-col items-center justify-center text-sm relative ${
                        isSelected ? "bg-sage-600 text-white" : isToday ? "bg-sage-100 font-bold" : "hover:bg-sage-50"
                      }`}
                    >
                      {d}
                      {has.length > 0 && (
                        <div className="flex gap-0.5 mt-0.5 flex-wrap justify-center max-w-full">
                          {has.slice(0, 3).map((h, i) => (
                            <div key={i} className={`w-1 h-1 rounded-full ${
                              h.type === "sow" ? "bg-blue-400" :
                              h.type === "transplant" ? "bg-green-500" :
                              h.type === "fertilize" ? "bg-orange-400" :
                              h.type === "harvest" ? "bg-purple-400" :
                              h.type === "frost" ? "bg-sky-400" : "bg-sage-400"
                            } ${isSelected ? "bg-white" : ""}`} />
                          ))}
                        </div>
                      )}
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="mb-4">
              <h3 className="font-semibold text-sage-800 mb-2">
                {new Date(viewYear, viewMonth, selected).toLocaleDateString("en-US", { month: "short", day: "numeric" })}
                <span className="text-xs font-normal text-sage-500 ml-2">{dayEvents.length} items</span>
              </h3>
              <div className="space-y-2">
                {dayEvents.map((t, i) => (
                  <div key={i} className="bg-white rounded-xl p-3 card-shadow">
                    <p className="font-medium text-sm text-sage-800">{t.title}</p>
                    {t.detail && <p className="text-xs text-sage-500">{t.detail}</p>}
                    <span className={`inline-block mt-1 text-[10px] font-semibold px-1.5 py-0.5 rounded ${t.color}`}>{t.tag}</span>
                  </div>
                ))}
                {dayEvents.length === 0 && (
                  <p className="text-sm text-sage-400 text-center py-4">Nothing scheduled</p>
                )}
              </div>
            </div>

            <div className="bg-sage-100 rounded-xl p-3">
              <p className="text-xs font-semibold text-sage-700 mb-2">LEGEND</p>
              <div className="grid grid-cols-2 gap-2 text-xs text-sage-600">
                <div className="flex items-center gap-2"><div className="w-2.5 h-2.5 rounded-full bg-blue-400" />Sow</div>
                <div className="flex items-center gap-2"><div className="w-2.5 h-2.5 rounded-full bg-green-500" />Transplant</div>
                <div className="flex items-center gap-2"><div className="w-2.5 h-2.5 rounded-full bg-orange-400" />Fertilize</div>
                <div className="flex items-center gap-2"><div className="w-2.5 h-2.5 rounded-full bg-purple-400" />Harvest</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function CropRotationScreen({ placed, rotationHistory, setRotationHistory }) {
      const currentYear = new Date().getFullYear();
      const [selectedBed, setSelectedBed] = useState(BEDS[0].id);
      const [showLogConfirm, setShowLogConfirm] = useState(false);

      const getPlant = (id) => PLANT_LIBRARY.find(p => p.id === id);

      // Families currently in a bed (from live layout)
      const currentFamiliesForBed = (bedId) => {
        const plants = placed.filter(p => p.bed === bedId).map(p => getPlant(p.plant)).filter(Boolean);
        return [...new Set(plants.map(p => p.family))];
      };

      // Recent families from history (last N years)
      const recentFamilies = (bedId, years = ROTATION_YEARS) => {
        const hist = rotationHistory[bedId] || [];
        const cutoff = currentYear - years;
        const fams = new Set();
        hist.filter(h => h.year >= cutoff).forEach(h => {
          (h.families || []).forEach(f => fams.add(f));
        });
        return [...fams];
      };

      // Suggested plants that avoid recent families for a bed
      const suggestionsForBed = (bedId) => {
        const recent = recentFamilies(bedId);
        const current = currentFamiliesForBed(bedId);
        const avoid = new Set([...recent, ...current]);
        return PLANT_LIBRARY
          .filter(p => p.family !== "Ericaceae") // skip long-term perennials for annual rotation advice
          .filter(p => !avoid.has(p.family))
          .map(p => ({
            ...p,
            reason: recent.length
              ? `Avoids recent ${recent.map(f => PLANT_LIBRARY.find(x => x.family === f)?.familyName || f).filter((v,i,a)=>a.indexOf(v)===i).join(", ")}`
              : "No recent history – any family is fine"
          }));
      };

      const logCurrentSeason = () => {
        const next = { ...rotationHistory };
        BEDS.forEach(bed => {
          const bedPlants = placed.filter(p => p.bed === bed.id);
          if (bedPlants.length === 0) return;
          const plantIds = [...new Set(bedPlants.map(p => p.plant))];
          const families = [...new Set(plantIds.map(id => getPlant(id)?.family).filter(Boolean))];
          const entry = {
            year: currentYear,
            plants: plantIds,
            families,
            loggedAt: new Date().toISOString()
          };
          const existing = next[bed.id] || [];
          // Replace same-year entry if exists, else prepend
          const filtered = existing.filter(h => h.year !== currentYear);
          next[bed.id] = [entry, ...filtered].slice(0, 8); // keep last 8 seasons
        });
        setRotationHistory(next);
        setShowLogConfirm(false);
      };

      const bedHistory = rotationHistory[selectedBed] || [];
      const bedSuggestions = suggestionsForBed(selectedBed);
      const bedCurrentFams = currentFamiliesForBed(selectedBed);
      const bedRecentFams = recentFamilies(selectedBed);

      // Check if current layout has rotation conflicts
      const hasConflict = bedCurrentFams.some(f => bedRecentFams.includes(f) && f !== "Ericaceae");

      return (
        <div className="pb-24">
          <Header
            title="Crop Rotation"
            right={
              <button
                onClick={() => setShowLogConfirm(true)}
                className="text-xs bg-sage-600 text-white px-2.5 py-1.5 rounded-lg font-medium"
              >
                Log Season
              </button>
            }
          />

          <div className="px-4 pt-4 space-y-4">
            {/* Intro */}
            <div className="bg-white rounded-2xl p-3 card-shadow text-xs text-sage-600">
              Avoid planting the same plant family in a bed for {ROTATION_YEARS}+ years.
              This reduces disease and nutrient imbalance.
            </div>

            {/* Bed selector */}
            <div className="flex gap-2 overflow-x-auto pb-1">
              {BEDS.map(bed => (
                <button
                  key={bed.id}
                  onClick={() => setSelectedBed(bed.id)}
                  className={`px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition ${
                    selectedBed === bed.id
                      ? "bg-sage-600 text-white"
                      : "bg-white text-sage-600 card-shadow"
                  }`}
                >
                  {bed.name}
                </button>
              ))}
            </div>

            {/* Status card for selected bed */}
            <div className={`rounded-2xl p-4 card-shadow ${hasConflict ? "bg-amber-50 border border-amber-200" : "bg-white"}`}>
              <div className="flex justify-between items-start mb-2">
                <h3 className="font-semibold text-sage-800">
                  {BEDS.find(b => b.id === selectedBed)?.name}
                </h3>
                {hasConflict ? (
                  <span className="text-[10px] bg-amber-200 text-amber-800 px-2 py-0.5 rounded-full font-medium">
                    ⚠ Rotation conflict
                  </span>
                ) : (
                  <span className="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-medium">
                    ✓ Looking good
                  </span>
                )}
              </div>

              <p className="text-xs text-sage-500 mb-2">This season (from Layout)</p>
              <div className="flex flex-wrap gap-1.5 mb-3">
                {bedCurrentFams.length === 0 ? (
                  <span className="text-xs text-sage-400">Empty – add plants in Layout</span>
                ) : (
                  bedCurrentFams.map(f => {
                    const sample = PLANT_LIBRARY.find(p => p.family === f);
                    return (
                      <span key={f} className={`text-[10px] px-2 py-0.5 rounded-full ${FAMILY_COLORS[f] || "bg-sage-100"}`}>
                        {sample?.familyName || f}

              <p className="text-xs text-sage-500 mb-1">Recent families (last {ROTATION_YEARS} yrs)</p>
              <div className="flex flex-wrap gap-1.5">
                {bedRecentFams.length === 0 ? (

    function DiagnosticScreen({ tasks, setTasks }) {
      const [step, setStep] = useState(1); // 1=plant, 2=symptoms, 3=context, 4=results
      const [selectedPlant, setSelectedPlant] = useState(null); // plant id or "unknown"
      const [selectedSymptoms, setSelectedSymptoms] = useState([]);
      const [context, setContext] = useState({
        watering: "normal", // dry | normal | wet
        recentRain: false,
        newGrowth: false,
      });
      const [results, setResults] = useState([]);

      const toggleSymptom = (id) => {
        setSelectedSymptoms(prev =>
          prev.includes(id) ? prev.filter(s => s !== id) : [...prev, id]
        );
      };

      const scoreProblems = () => {
        const scored = PROBLEMS.map(problem => {
          // Plant relevance
          let plantBoost = 1;
          if (selectedPlant && selectedPlant !== "unknown") {
            if (problem.plants.length > 0 && !problem.plants.includes(selectedPlant)) {
              plantBoost = 0.35; // still possible but less likely
            } else if (problem.plants.includes(selectedPlant)) {
              plantBoost = 1.25;
            }
          }

          // Symptom evidence
          let evidence = 0;
          let maxPossible = 0;
          const matched = [];
          Object.entries(problem.symptoms).forEach(([symId, weight]) => {
            maxPossible += weight;
            if (selectedSymptoms.includes(symId)) {
              evidence += weight;
              matched.push(symId);
            }
          });

          // Context adjustments
          let contextMod = 1;
          if (problem.id === "spider_mites" && context.watering === "dry") contextMod += 0.2;
          if (problem.id === "overwatering" && context.watering === "wet") contextMod += 0.35;
          if (problem.id === "underwatering" && context.watering === "dry") contextMod += 0.35;
          if (problem.id === "early_blight" && context.recentRain) contextMod += 0.15;
          if (problem.id === "powdery_mildew" && context.recentRain) contextMod += 0.1;
          if ((problem.id === "aphids" || problem.id === "spider_mites") && context.newGrowth) contextMod += 0.1;

          const rawScore = maxPossible > 0 ? (evidence / maxPossible) * plantBoost * contextMod : 0;
          // Require at least some evidence
          const finalScore = evidence === 0 ? 0 : Math.min(1, rawScore);

          return {
            ...problem,
            score: finalScore,
            evidence,
            matchedSymptoms: matched,
            confidence: finalScore >= 0.7 ? "High" : finalScore >= 0.4 ? "Medium" : finalScore > 0 ? "Low" : "None",
          };
        })
        .filter(p => p.score > 0.15)
        .sort((a, b) => b.score - a.score);

        setResults(scored);
        setStep(4);
      };

      const addTreatmentTask = (problem) => {
        const newTask = {
          id: Date.now(),
          title: `Treat ${problem.name}`,
          detail: problem.organic[0] || "Follow organic treatment steps",
          done: false,
          icon: "🩺",
        };
        setTasks(prev => [newTask, ...prev]);
        alert(`Task added: "${newTask.title}"`);
      };

      const reset = () => {
        setStep(1);
        setSelectedPlant(null);
        setSelectedSymptoms([]);
        setContext({ watering: "normal", recentRain: false, newGrowth: false });
        setResults([]);
      };

      return (
        <div className="pb-24">
          <Header
            title="Plant Diagnose"
            right={
              step > 1 ? (
                <button onClick={reset} className="text-xs text-sage-600 font-medium">
                  Start over
                </button>
              ) : null
            }
          />

          <div className="px-4 pt-4 space-y-4">
            {/* Progress */}
            <div className="flex gap-1">
              {[1, 2, 3, 4].map(s => (
                <div
                  key={s}
                  className={`h-1.5 flex-1 rounded-full ${step >= s ? "bg-sage-600" : "bg-sage-200"}`}
                />
              ))}
            </div>

            {/* Step 1: Plant */}
            {step === 1 && (
              <div className="bg-white rounded-2xl p-4 card-shadow">
                <h3 className="font-semibold text-sage-800 mb-1">Which plant is affected?</h3>
                <p className="text-xs text-sage-500 mb-3">Improves accuracy of the diagnosis</p>
                <div className="grid grid-cols-4 gap-2 mb-3">
                  {PLANT_LIBRARY.map(p => (
                    <button
                      key={p.id}
                      onClick={() => setSelectedPlant(p.id)}
                      className={`rounded-xl p-2 text-center transition ${
                        selectedPlant === p.id
                          ? "ring-2 ring-sage-600 bg-sage-50"
                          : "bg-sage-50 hover:bg-sage-100"
                      }`}
                    >
                      <div className="text-2xl">{p.icon}</div>
                      <p className="text-[10px] font-medium leading-tight mt-0.5">{p.name}</p>
                    </button>
                  ))}
                </div>
                <button
                  onClick={() => setSelectedPlant("unknown")}
                  className={`w-full py-2.5 rounded-xl text-sm font-medium mb-4 ${
                    selectedPlant === "unknown"
                      ? "bg-sage-600 text-white"
                      : "bg-sage-100 text-sage-700"
                  }`}
                >
                  Not sure / Other plant
                </button>
                <button
                  disabled={!selectedPlant}
                  onClick={() => setStep(2)}
                  className={`w-full py-3 rounded-xl font-medium ${
                    selectedPlant
                      ? "bg-sage-600 text-white"
                      : "bg-sage-200 text-sage-400 cursor-not-allowed"
                  }`}
                >
                  Next: Symptoms →
                </button>
              </div>
            )}

            {/* Step 2: Symptoms */}
            {step === 2 && (
              <div className="bg-white rounded-2xl p-4 card-shadow">
                <h3 className="font-semibold text-sage-800 mb-1">What do you see?</h3>
                <p className="text-xs text-sage-500 mb-3">Select all that apply</p>
                <div className="grid grid-cols-2 gap-2 mb-4">
                  {SYMPTOMS.map(s => {
                    const active = selectedSymptoms.includes(s.id);
                    return (
                      <button
                        key={s.id}
                        onClick={() => toggleSymptom(s.id)}
                        className={`flex items-center gap-2 p-2.5 rounded-xl text-left text-sm transition ${
                          active
                            ? "bg-sage-600 text-white"
                            : "bg-sage-50 text-sage-700 hover:bg-sage-100"
                        }`}
                      >
                        <span className="text-lg">{s.icon}</span>
                        <span className="leading-tight text-xs font-medium">{s.label}</span>
                      </button>
                    );
                  })}
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={() => setStep(1)}
                    className="flex-1 py-3 rounded-xl border border-sage-200 text-sage-600 font-medium"
                  >
                    Back
                  </button>
                  <button
                    disabled={selectedSymptoms.length === 0}
                    onClick={() => setStep(3)}
                    className={`flex-1 py-3 rounded-xl font-medium ${
                      selectedSymptoms.length > 0
                        ? "bg-sage-600 text-white"
                        : "bg-sage-200 text-sage-400 cursor-not-allowed"
                    }`}
                  >
                    Next →
                  </button>
                </div>
              </div>
            )}

            {/* Step 3: Context */}
            {step === 3 && (
              <div className="bg-white rounded-2xl p-4 card-shadow space-y-4">
                <div>
                  <h3 className="font-semibold text-sage-800 mb-1">A bit more context</h3>
                  <p className="text-xs text-sage-500">Optional but improves results</p>
                </div>

                <div>
                  <p className="text-xs font-medium text-sage-700 mb-2">Soil moisture lately</p>
                  <div className="flex gap-2">
                    {[
                      { id: "dry", label: "Mostly dry" },
                      { id: "normal", label: "Normal" },
                      { id: "wet", label: "Often wet" },
                    ].map(o => (
                      <button
                        key={o.id}
                        onClick={() => setContext(c => ({ ...c, watering: o.id }))}
                        className={`flex-1 py-2 rounded-xl text-xs font-medium ${
                          context.watering === o.id
                            ? "bg-sage-600 text-white"
                            : "bg-sage-50 text-sage-600"
                        }`}
                      >
                        {o.label}
                      </button>
                    ))}
                  </div>
                </div>

                <label className="flex items-center gap-3 p-3 bg-sage-50 rounded-xl cursor-pointer">
                  <input
                    type="checkbox"
                    checked={context.recentRain}
                    onChange={e => setContext(c => ({ ...c, recentRain: e.target.checked }))}
                    className="w-4 h-4 accent-sage-600"
                  />
                  <span className="text-sm text-sage-700">Recent rain or high humidity</span>
                </label>

                <label className="flex items-center gap-3 p-3 bg-sage-50 rounded-xl cursor-pointer">
                  <input
                    type="checkbox"
                    checked={context.newGrowth}
                    onChange={e => setContext(c => ({ ...c, newGrowth: e.target.checked }))}
                    className="w-4 h-4 accent-sage-600"
                  />
                  <span className="text-sm text-sage-700">Symptoms mainly on new growth</span>
                </label>

                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => setStep(2)}
                    className="flex-1 py-3 rounded-xl border border-sage-200 text-sage-600 font-medium"
                  >
                    Back
                  </button>
                  <button
                    onClick={scoreProblems}
                    className="flex-1 py-3 rounded-xl bg-sage-600 text-white font-medium"
                  >
                    See diagnosis →
                  </button>
                </div>
              </div>
            )}

            {/* Step 4: Results */}
            {step === 4 && (
              <div className="space-y-3">
                <div className="bg-white rounded-2xl p-4 card-shadow">
                  <h3 className="font-semibold text-sage-800 mb-1">Likely causes</h3>
                  <p className="text-xs text-sage-500">
                    {selectedPlant && selectedPlant !== "unknown"
                      ? `For ${PLANT_LIBRARY.find(p => p.id === selectedPlant)?.name}`
                      : "General garden plants"}{" "}
                    · {selectedSymptoms.length} symptom{selectedSymptoms.length !== 1 ? "s" : ""}
                  </p>
                </div>

                {results.length === 0 ? (
                  <div className="bg-white rounded-2xl p-6 card-shadow text-center">
                    <p className="text-3xl mb-2">🤔</p>
                    <p className="font-medium text-sage-800">No strong match</p>
                    <p className="text-xs text-sage-500 mt-1">
                      Try selecting more symptoms or different ones. When in doubt, check watering and look under leaves for pests.
                    </p>
                    <button
                      onClick={() => setStep(2)}
                      className="mt-4 px-4 py-2 bg-sage-600 text-white rounded-xl text-sm font-medium"
                    >
                      Adjust symptoms
                    </button>
                  </div>
                ) : (
                  results.map((r, idx) => (
                    <div key={r.id} className="bg-white rounded-2xl p-4 card-shadow">
                      <div className="flex items-start gap-3 mb-2">
                        <span className="text-3xl">{r.icon}</span>
                        <div className="flex-1">
                          <div className="flex items-center gap-2 flex-wrap">
                            <h4 className="font-semibold text-sage-800">{r.name}</h4>
                            <span className={`text-[10px] px-1.5 py-0.5 rounded-full font-medium ${
                              r.confidence === "High" ? "bg-green-100 text-green-700" :
                              r.confidence === "Medium" ? "bg-amber-100 text-amber-700" :
                              "bg-sage-100 text-sage-600"
                            }`}>
                              {r.confidence}
                            </span>
                            <span className="text-[10px] bg-sage-100 text-sage-600 px-1.5 py-0.5 rounded-full">
                              {r.type}
                            </span>
                          </div>
                          <p className="text-xs text-sage-500 mt-1">{r.description}</p>
                        </div>
                        <span className="text-sm font-bold text-sage-600">
                          {Math.round(r.score * 100)}%
                        </span>
                      </div>

                      <div className="mt-3">
                        <p className="text-xs font-semibold text-sage-700 mb-1.5">Organic treatment</p>
                        <ol className="list-decimal list-inside space-y-1">
                          {r.organic.map((step, i) => (
                            <li key={i} className="text-xs text-sage-600">{step}</li>
                          ))}
                        </ol>
                      </div>

                      <p className="text-[10px] text-sage-400 mt-2">
                        <span className="font-medium">Prevent:</span> {r.prevent}
                      </p>

                      <button
                        onClick={() => addTreatmentTask(r)}
                        className="mt-3 w-full py-2 rounded-xl bg-sage-100 text-sage-700 text-xs font-medium hover:bg-sage-200 transition"
                      >
                        + Add treatment task
                      </button>
                    </div>
                  ))
                )}

                <button
                  onClick={reset}
                  className="w-full py-3 rounded-xl border border-sage-200 text-sage-600 font-medium text-sm"
                >
                  Diagnose another plant
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ========== APP ==========
    function App() {
      const [active, setActive] = useState("home");
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem("pp_tasks");
        return saved ? JSON.parse(saved) : INITIAL_TASKS;
      });
      const [seeds, setSeeds] = useState(() => {
        const saved = localStorage.getItem("pp_seeds");
        return saved ? JSON.parse(saved) : INITIAL_SEEDS;
      });
      const [placed, setPlaced] = useState(() => {
        const saved = localStorage.getItem("pp_placed");
        return saved ? JSON.parse(saved) : [
          { id: 1, bed: "tomato", plant: "tomato", plantedAt: toISODate(addDays(new Date(), -20)), status: "growing" },
          { id: 2, bed: "tomato", plant: "basil", plantedAt: toISODate(addDays(new Date(), -14)), status: "growing" },
          { id: 3, bed: "tomato", plant: "marigold", plantedAt: toISODate(addDays(new Date(), -10)), status: "growing" },
          { id: 4, bed: "herb", plant: "lavender", plantedAt: toISODate(addDays(new Date(), -40)), status: "growing" },
          { id: 5, bed: "herb", plant: "basil", plantedAt: toISODate(addDays(new Date(), -12)), status: "growing" },
          { id: 6, bed: "pepper", plant: "pepper", plantedAt: toISODate(addDays(new Date(), -18)), status: "growing" },
          { id: 7, bed: "berry", plant: "blueberry", plantedAt: toISODate(addDays(new Date(), -100)), status: "growing" },
        ];
      });
      const [rotationHistory, setRotationHistory] = useState(() => {
        const saved = localStorage.getItem("pp_rotation");
        return saved ? JSON.parse(saved) : {
          tomato: [
            { year: 2025, plants: ["tomato", "basil", "marigold"], families: ["Solanaceae", "Lamiaceae", "Asteraceae"] },
            { year: 2024, plants: ["pepper"], families: ["Solanaceae"] },
          ],
          herb: [
            { year: 2025, plants: ["lavender", "basil"], families: ["Lamiaceae"] },
          ],
          pepper: [
            { year: 2025, plants: ["pepper"], families: ["Solanaceae"] },
            { year: 2024, plants: ["carrot", "lettuce"], families: ["Apiaceae", "Asteraceae"] },
          ],
          berry: [
            { year: 2025, plants: ["blueberry"], families: ["Ericaceae"] },
          ],
        };
      });
      const [profile, setProfile] = useState(() => {
        const saved = localStorage.getItem("pp_profile");
        return saved ? JSON.parse(saved) : { onboarded: false, city: "", zone: "", lastFrost: "", firstFrost: "" };
      });
      const [journal, setJournal] = useState(() => {
        const saved = localStorage.getItem("pp_journal");
        return saved ? JSON.parse(saved) : [];
      });
      const [customPlants, setCustomPlants] = useState(() => {
        const saved = localStorage.getItem("pp_custom_plants");
        return saved ? JSON.parse(saved) : [];
      });
      const [showOnboarding, setShowOnboarding] = useState(() => {
        try {
          const saved = localStorage.getItem("pp_profile");
          const p = saved ? JSON.parse(saved) : null;
          return !p?.onboarded;
        } catch { return true; }
      });

      useEffect(() => { localStorage.setItem("pp_tasks", JSON.stringify(tasks)); }, [tasks]);
      useEffect(() => { localStorage.setItem("pp_seeds", JSON.stringify(seeds)); }, [seeds]);
      useEffect(() => { localStorage.setItem("pp_placed", JSON.stringify(placed)); }, [placed]);
      useEffect(() => { localStorage.setItem("pp_rotation", JSON.stringify(rotationHistory)); }, [rotationHistory]);
      useEffect(() => { localStorage.setItem("pp_profile", JSON.stringify(profile)); }, [profile]);
      useEffect(() => { localStorage.setItem("pp_journal", JSON.stringify(journal)); }, [journal]);
      useEffect(() => { localStorage.setItem("pp_custom_plants", JSON.stringify(customPlants)); }, [customPlants]);

      const exportData = () => {
        const payload = {
          exportedAt: new Date().toISOString(),
          profile, tasks, seeds, placed, rotationHistory, journal, customPlants,
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `plotpilot-backup-${toISODate(new Date())}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      return (
        <div className="min-h-screen max-w-lg mx-auto bg-sage-50 relative">
          {showOnboarding && (
            <OnboardingModal
              profile={profile}
              setProfile={setProfile}
              onDone={() => setShowOnboarding(false)}
            />
          )}
          {active === "home" && <Dashboard tasks={tasks} setTasks={setTasks} seeds={seeds} placed={placed} />}
          {active === "layout" && <LayoutPlanner placed={placed} setPlaced={setPlaced} setTasks={setTasks} />}
          {active === "rotate" && (
            <CropRotationScreen
              placed={placed}
              rotationHistory={rotationHistory}
              setRotationHistory={setRotationHistory}
            />
          )}
          {active === "diagnose" && <DiagnosticScreen tasks={tasks} setTasks={setTasks} />}
          {active === "vault" && <SeedVault seeds={seeds} setSeeds={setSeeds} />}
          {active === "calendar" && <CalendarScreen profile={profile} placed={placed} tasks={tasks} />}
          {active === "plants" && <PlantsScreen customPlants={customPlants} setCustomPlants={setCustomPlants} />}
          {active === "journal" && <JournalScreen journal={journal} setJournal={setJournal} placed={placed} />}
          {active === "settings" && (
            <SettingsScreen profile={profile} setProfile={setProfile} setShowOnboarding={setShowOnboarding} />
          )}
          {active === "more" && (
            <MoreScreen setActive={setActive} profile={profile} exportData={exportData} />
          )}
          <BottomNav active={active} setActive={setActive} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
