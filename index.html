                      </button>
                    ))}
                    {catalogVars.length > 0 && (
                      <p className="text-[10px] font-semibold text-sage-500 pt-1">Catalog</p>
                    )}
                    {catalogVars.map(v => (
                      <button
                        type="button"
                        key={v.id}
                        onClick={() => togglePick(v.id)}
                        className={`w-full text-left px-3 py-2 rounded-xl border text-sm flex justify-between items-center ${
                          pickerSelected.includes(v.id) ? "border-sage-600 bg-sage-50 ring-1 ring-sage-400" : "border-sage-100"
                        }`}
                      >
                        <span>
                          <span className="font-medium text-sage-800">{v.variety}</span>

                          </span>
                        </span>

                    ))}

                    {!showAddVariety ? (
                      <button
                        type="button"
                        onClick={() => setShowAddVariety(true)}

                      </button>
                    ) : (
                      <div className="mt-2 p-3 rounded-xl bg-sage-50 border border-sage-200 space-y-2">
                        <p className="text-xs font-semibold text-sage-800">New {parent?.name} variety</p>
                        <input
                          className="w-full border rounded-xl px-3 py-2 text-sm"
                          placeholder="Variety name (e.g. Grandma's Hot)"
                          value={newVarietyName}

                        />
                        <input
                          className="w-full border rounded-xl px-3 py-2 text-sm"
                          placeholder="Notes optional (source, color…)"
                          value={newVarietyNotes}
                          onChange={e => setNewVarietyNotes(e.target.value)}

                        <div className="flex gap-2">
                          <button type="button" onClick={() => { setShowAddVariety(false); setNewVarietyName(""); setNewVarietyNotes(""); }} className="flex-1 py-2 rounded-xl border text-xs">Cancel</button>
                          <button type="button" onClick={saveNewVariety} className="flex-1 py-2 rounded-xl bg-sage-600 text-white text-xs font-medium">Save variety</button>
                        </div>

                  </div>
                  <div className="p-4 pt-3 border-t border-sage-100 shrink-0 flex gap-2 bg-white rounded-b-2xl">
                    <button
                      type="button"
                      onClick={() => { setVarietyPickerCrop(null); setPickerSelected([]); setShowAddVariety(false); }}
                      className="flex-1 py-3 rounded-xl border text-sm font-medium"
                    >Cancel</button>
                    <button
                      type="button"
                      onClick={() => {
                        setSelectedPlantIds(prev => {
                          const without = prev.filter(id => {
                            if (id === varietyPickerCrop) return false;
                            if (id.startsWith(varietyPickerCrop + "__")) return false;
                            return true;
                          });
                          return [...without, ...pickerSelected];
                        });
                        setVarietyPickerCrop(null);
                        setPickerSelected([]);
                        setShowAddVariety(false);
                      }}
                      className="flex-1 py-3 rounded-xl bg-sage-600 text-white text-sm font-medium"
                    >
                      Add {pickerSelected.length || 0} to selection
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}

          {conflictSheet && (
            <div className="fixed inset-0 bg-black/40 z-[110] flex items-end sm:items-center justify-center px-4 pt-4 pb-24">
              <div className="bg-white rounded-2xl p-5 w-full max-w-sm max-h-[90vh] overflow-y-auto">
                <p className="text-[10px] font-semibold uppercase tracking-wide text-amber-800 mb-1">Companion conflict</p>
                <h3 className="font-semibold text-sage-800 mb-1">
                  {plantDisplayName(conflictSheet.plantInfo)} in {conflictSheet.bedName}
                </h3>
                <p className="text-[11px] text-sage-500 mb-3">
                  This plant may not get along with what’s already in the bed. Here’s why, and what pairs better.
                </p>
                {conflictSheet.pairs.map((pair, i) => (
                  <div key={i} className="mb-3 rounded-xl border border-amber-100 bg-amber-50/60 p-3">
                    <p className="text-sm font-medium text-sage-800">vs {pair.otherName}</p>
                    <p className="text-[11px] text-sage-700 leading-snug mt-1">{pair.why}</p>
                    {pair.betterForNew.length > 0 && (
                      <div className="mt-2">
                        <p className="text-[10px] font-semibold text-green-800">Better with {plantDisplayName(conflictSheet.plantInfo)}</p>
                        <div className="flex flex-wrap gap-1 mt-1">
                          {pair.betterForNew.map(p => (
                            <button
                              key={p.id}
                              type="button"
                              onClick={() => {
                                togglePlantSelect(p.id);
                                setConflictSheet(null);
                              }}
                              className="text-[10px] bg-white border border-green-200 text-green-800 px-2 py-0.5 rounded-full"
                            >
                              {p.icon} {p.name}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                    {pair.betterForOther.length > 0 && (
                      <div className="mt-2">
                        <p className="text-[10px] font-semibold text-green-800">Better with {pair.otherName}</p>
                        <p className="text-[10px] text-sage-600 mt-0.5">
                          {pair.betterForOther.map(p => p.name).join(", ")}
                        </p>
                      </div>
                    )}
                  </div>
                ))}
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => setConflictSheet(null)}
                    className="flex-1 py-2.5 rounded-xl border text-sm"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      const sheet = conflictSheet;
                      setConflictSheet(null);
                      commitPlantsToBed(
                        [sheet.plantId, ...(sheet.remainingIds || [])],
                        sheet.bedId,
                        sheet.plantedAtISO,
                        { ignoreConflicts: true }
                      );
                    }}
                    className="flex-1 py-2.5 rounded-xl bg-amber-600 text-white text-sm font-medium"
                  >
                    Plant anyway
                  </button>
                </div>
              </div>
            </div>
          )}

          {editingBed && (
            <div className="fixed inset-0 bg-black/40 z-[100] flex items-end sm:items-center justify-center px-4 pt-4 pb-24">
              <div className="bg-white rounded-2xl p-5 w-full max-w-sm max-h-[90vh] overflow-y-auto">
                <h3 className="font-semibold text-sage-800 mb-1">
                  {bedDraft.kind === "container" ? "Edit container" : "Edit bed"}
                </h3>
                <p className="text-[10px] text-sage-400 mb-3">
                  {bedDraft.kind === "container"
                    ? "Pots can live off-map (porch, patio, indoors) or pin to the visual map."
                    : "Size is in feet. Map position is % from top-left of the garden map."}
                </p>
                <label className="text-xs text-sage-500">Name</label>
                <input className="w-full border rounded-xl px-3 py-2 text-sm mb-2" value={bedDraft.name} onChange={e => setBedDraft(f => ({ ...f, name: e.target.value }))} />
                {bedDraft.kind === "container" && (
                  <>
                    <label className="text-xs text-sage-500">Where is it? (optional)</label>
                    <input
                      className="w-full border rounded-xl px-3 py-2 text-sm mb-2"
                      placeholder="e.g. Front porch, kitchen window"
                      value={bedDraft.locationNote || ""}
                      onChange={e => setBedDraft(f => ({ ...f, locationNote: e.target.value }))}
                    />
                    <label className="flex items-center gap-2 text-xs text-sage-700 mb-3 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={!!bedDraft.showOnMap}
                        onChange={e => setBedDraft(f => ({ ...f, showOnMap: e.target.checked }))}
                      />
                      Show on visual garden map
                    </label>
                  </>
                )}
                <div className="flex gap-2 mb-2">
                  <div className="flex-1">
                    <label className="text-xs text-sage-500">{bedDraft.kind === "container" ? "Pot size (ft)" : "Width (ft)"}</label>
                    <input type="number" min={0.5} max={100} step={0.5} className="w-full border rounded-xl px-3 py-2 text-sm" value={bedDraft.widthFt} onChange={e => setBedDraft(f => ({ ...f, widthFt: e.target.value, ...(f.kind === "container" ? { lengthFt: e.target.value } : {}) }))} />
                  </div>
                  {bedDraft.kind !== "container" && (
                    <div className="flex-1">
                      <label className="text-xs text-sage-500">Length (ft)</label>
                      <input type="number" min={1} max={100} className="w-full border rounded-xl px-3 py-2 text-sm" value={bedDraft.lengthFt} onChange={e => setBedDraft(f => ({ ...f, lengthFt: e.target.value }))} />
                    </div>
                  )}
                </div>
                <label className="text-xs text-sage-500">Sun</label>
                <select className="w-full border rounded-xl px-3 py-2 text-sm mb-2" value={bedDraft.sun} onChange={e => setBedDraft(f => ({ ...f, sun: e.target.value }))}>
                  {["Full sun", "Partial", "Shade"].map(s => <option key={s}>{s}</option>)}
                </select>
                <label className="text-xs text-sage-500">Color</label>
                <div className="grid grid-cols-6 gap-2 mb-3 mt-1">
                  {BED_COLORS.map(c => (
                    <button
                      key={c}
                      type="button"
                      title={BED_COLOR_LABELS[c] || c}
                      onClick={() => setBedDraft(f => ({ ...f, color: c }))}
                      className={`h-9 rounded-lg border-2 ${c} ${bedDraft.color === c ? "ring-2 ring-sage-600 scale-105" : "opacity-90"}`}
                    />
                  ))}
                </div>
                {(bedDraft.kind !== "container" || bedDraft.showOnMap) && (
                  <div className="flex gap-2 mb-3">
                    <div className="flex-1">
                      <label className="text-xs text-sage-500">Map left %</label>
                      <input type="number" min={0} max={90} className="w-full border rounded-xl px-3 py-2 text-sm" value={bedDraft.mapX} onChange={e => setBedDraft(f => ({ ...f, mapX: e.target.value }))} />
                    </div>
                    <div className="flex-1">
                      <label className="text-xs text-sage-500">Map top %</label>
                      <input type="number" min={0} max={85} className="w-full border rounded-xl px-3 py-2 text-sm" value={bedDraft.mapY} onChange={e => setBedDraft(f => ({ ...f, mapY: e.target.value }))} />
                    </div>
                  </div>
                )}
                {bedDraft.kind !== "container" && (
                  <p className="text-[10px] text-sage-500 mb-3">
                    Capacity (at 12&quot; spacing): ~{bedCapacity({ widthFt: bedDraft.widthFt, lengthFt: bedDraft.lengthFt }, 12)} plants
                  </p>
                )}
                <div className="flex gap-2 mb-2">
                  <button type="button" onClick={() => setEditingBed(null)} className="flex-1 py-2.5 rounded-xl border text-sm">Cancel</button>
                  <button type="button" onClick={saveBedEdit} className="flex-1 py-2.5 rounded-xl bg-sage-600 text-white text-sm font-medium">Save</button>
                </div>
                <button type="button" onClick={() => deleteBed(editingBed.id)} className="w-full py-2 text-xs text-red-600 font-medium">
                  {bedDraft.kind === "container" ? "Delete container" : "Delete bed"}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function SeedVault({ seeds, setSeeds, placed, harvests, customPlants, profile, setProfile, beds }) {
      const [tab, setTab] = useState("inventory"); // inventory | guide | save
      const [filter, setFilter] = useState("All");
      const [search, setSearch] = useState("");
      const [showAdd, setShowAdd] = useState(false);
      const [detailSeed, setDetailSeed] = useState(null);
      const unitSystem = profile?.seedUnits || "imperial"; // imperial | metric
      const defaultMeasure = profile?.seedMeasure || "count"; // count | weight

      const setUnitSystem = (u) => setProfile && setProfile(p => ({ ...p, seedUnits: u }));
      const setDefaultMeasure = (m) => setProfile && setProfile(p => ({ ...p, seedMeasure: m }));

      const weightUnit = unitSystem === "metric" ? "g" : "oz";
      const countUnit = "seeds";

      const filters = ["All", "Vegetable", "Herb", "Flower", "Fruit", "Cover", "Expiring", "Low", "Saved"];

      const filtered = useMemo(() => {
        const now = new Date();
        return (seeds || []).filter(s => {
          if (filter === "Expiring") {
            if (!s.expires) return false;
            const exp = new Date(s.expires + "T12:00:00");
            return exp < new Date(now.getTime() + 180 * 86400000); // within 6 months or past
          }
          if (filter === "Low") return s.low || (s.measure !== "weight" && s.qty <= 10) || (s.measure === "weight" && s.qty <= 1);
          if (filter === "Saved") return s.source === "saved";
          if (filter !== "All" && s.type !== filter) return false;
          if (search) {
            const q = search.toLowerCase();
            if (!(s.name || "").toLowerCase().includes(q)
              && !(s.variety || "").toLowerCase().includes(q)
              && !(s.plantId || "").toLowerCase().includes(q)) return false;
          }
          return true;
        });
      }, [seeds, filter, search]);

      const [form, setForm] = useState({
        plantId: "tomato",
        varietyId: "",
        varietyName: "",
        measure: defaultMeasure,
        qty: "25",
        germRate: "85",
        expires: `${new Date().getFullYear() + 2}-12-31`,
        source: "purchased",
        notes: "",
      });

      const openAdd = () => {
        setForm({
          plantId: "tomato",
          varietyId: "",
          varietyName: "",
          measure: defaultMeasure,
          qty: "25",
          germRate: "85",
          expires: `${new Date().getFullYear() + 2}-12-31`,
          source: "purchased",
          notes: "",
        });
        setShowAdd(true);
      };

      const saveSeedEntry = () => {
        const pl = resolvePlant(form.varietyId || form.plantId, customPlants) || PLANT_LIBRARY.find(p => p.id === form.plantId);
        if (!pl && !form.varietyName.trim()) return;
        const varietyLabel = form.varietyName.trim()
          || (form.varietyId ? (resolvePlant(form.varietyId, customPlants)?.variety || "") : "")
          || "";
        const cropName = PLANT_LIBRARY.find(p => p.id === form.plantId)?.name || pl?.cropName || pl?.name || "Seed";
        const name = varietyLabel ? `${varietyLabel} ${cropName}`.replace(`${cropName} ${cropName}`, cropName) : (pl?.name || cropName);
        const qty = Math.max(0, parseFloat(form.qty) || 0);
        const measure = form.measure || "count";
        setSeeds(prev => [...prev, {
          id: Date.now() + Math.random(),
          name: varietyLabel ? `${cropName} — ${varietyLabel}` : (pl?.name || cropName),
          plantId: form.plantId,
          variety: varietyLabel || pl?.variety || null,
          varietyId: form.varietyId || null,
          type: pl?.type || PLANT_LIBRARY.find(p => p.id === form.plantId)?.type || "Vegetable",
          measure,
          qty,
          unit: measure === "weight" ? weightUnit : countUnit,
          expires: form.expires,
          germRate: Math.min(100, Math.max(0, parseInt(form.germRate, 10) || 80)),
          low: measure === "count" ? qty <= 10 : qty <= 1,
          source: form.source,
          notes: form.notes.trim() || undefined,
          yearSaved: form.source === "saved" ? new Date().getFullYear() : undefined,
        }]);
        setShowAdd(false);
      };

      const applyQty = (id, nextQty) => {
        const qty = Math.max(0, Math.round(Number(nextQty) * 100) / 100);
        if (Number.isNaN(qty)) return;
        setSeeds(prev => prev.map(s => {
          if (s.id !== id) return s;
          const updated = { ...s, qty, low: s.measure === "weight" ? qty <= 1 : qty <= 10 };
          setDetailSeed(ds => (ds && ds.id === id ? { ...ds, qty: updated.qty, low: updated.low } : ds));
          return updated;
        }));
      };

      const adjustQty = (id, delta) => {
        const current = (seeds || []).find(s => s.id === id) || detailSeed;
        if (!current) return;
        applyQty(id, Number(current.qty || 0) + delta);
      };

      const removeSeed = (id) => {
        if (!confirm("Remove this seed from your vault?")) return;
        setSeeds(prev => prev.filter(s => s.id !== id));
        setDetailSeed(null);
      };

      const bedName = (bedId) => {
        if (!bedId) return "Unassigned bed";
        const b = (beds || []).find(x => x.id === bedId);
        if (b?.name) return b.name;
        // Fallback: never show raw ids like bed_123 — title-case known defaults
        if (typeof bedId === "string" && bedId.startsWith("bed_")) return "Custom bed";
        return String(bedId).replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
      };

      // Harvested or past-harvest-window plantings that can become saved seed
      const harvestCandidates = useMemo(() => {
        const now = new Date();

    function CalendarScreen({ profile, placed, tasks }) {
      const now = new Date();
      const [viewYear, setViewYear] = useState(now.getFullYear());
      const [viewMonth, setViewMonth] = useState(now.getMonth()); // 0-indexed
      const [selected, setSelected] = useState(now.getDate());

      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const firstDow = new Date(viewYear, viewMonth, 1).getDay();
      const monthName = new Date(viewYear, viewMonth, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });

      const lastFrost = profile?.lastFrost ? new Date(profile.lastFrost + "T12:00:00") : null;
      const firstFrost = profile?.firstFrost ? new Date(profile.firstFrost + "T12:00:00") : null;
      const season = growingSeasonBounds(profile, new Date(viewYear, viewMonth, 15));
      const frostWindowDays = 7; // days around each frost date that count as the "frost window"

      const daySeason = (d) => {
        const dt = new Date(viewYear, viewMonth, d, 12, 0, 0);
        const iso = toISODate(dt);
        const start = season.seasonStartISO;
        const end = season.seasonEndISO;
        const lfISO = lastFrost ? `${viewYear}-${String(lastFrost.getMonth() + 1).padStart(2, "0")}-${String(lastFrost.getDate()).padStart(2, "0")}` : start;
        const ffISO = firstFrost ? `${viewYear}-${String(firstFrost.getMonth() + 1).padStart(2, "0")}-${String(firstFrost.getDate()).padStart(2, "0")}` : end;
        const nearLast = lastFrost && Math.abs((dt - new Date(lfISO + "T12:00:00")) / 86400000) <= frostWindowDays;
        const nearFirst = firstFrost && Math.abs((dt - new Date(ffISO + "T12:00:00")) / 86400000) <= frostWindowDays;
        const isLast = iso === lfISO;
        const isFirst = iso === ffISO;
        const inSeason = start && end && iso >= start && iso <= end;
        return { iso, inSeason, nearLast, nearFirst, isLast, isFirst, frostWindow: nearLast || nearFirst };
      };

      // Build events from plant timelines + frost + tasks with due dates
      const eventsByDay = useMemo(() => {
        const map = {};
        const add = (dateObj, evt) => {
          if (!dateObj || dateObj.getMonth() !== viewMonth || dateObj.getFullYear() !== viewYear) return;
          const d = dateObj.getDate();
          if (!map[d]) map[d] = [];
          map[d].push(evt);
        };

        if (lastFrost) {
          add(lastFrost, { type: "frost", title: "Avg last spring frost", tag: "FROST", color: "bg-sky-100 text-sky-700" });
          PLANT_LIBRARY.forEach(pl => {
            if (pl.startWeeksBeforeFrost > 0) {
              add(addDays(lastFrost, -pl.startWeeksBeforeFrost * 7), {
                type: "sow", title: `Start ${pl.name} indoors`, tag: "SOW", color: "bg-blue-100 text-blue-700",
                detail: `${pl.startWeeksBeforeFrost} weeks before last frost`,
              });
            }
            if (pl.transplantWeeksBeforeFrost > 0) {
              add(addDays(lastFrost, -pl.transplantWeeksBeforeFrost * 7), {
                type: "transplant", title: `Transplant ${pl.name}`, tag: "TRANSPLANT", color: "bg-green-100 text-green-700",
                detail: `${pl.transplantWeeksBeforeFrost} week(s) before last frost`,
              });
            }
          });
        }
        if (firstFrost) {
          add(firstFrost, { type: "frost", title: "Avg first fall frost", tag: "FROST", color: "bg-sky-100 text-sky-700" });
        }

        // From placed plants with plantedAt
        placed.forEach(item => {
          if (!item.plantedAt || item.status === "harvested") return;
          const pl = PLANT_LIBRARY.find(p => p.id === item.plant);
          if (!pl) return;
          const planted = new Date(item.plantedAt + "T12:00:00");
          if (pl.fertilizeEveryDays > 0) {
            add(addDays(planted, pl.fertilizeEveryDays), {
              type: "fertilize", title: `Fertilize ${pl.name}`, tag: "FERTILIZE", color: "bg-orange-100 text-orange-700",
              detail: `Planted ${fmtDate(planted)}`,
            });
          }
          if (pl.daysToHarvest < 200) {
            add(addDays(planted, pl.daysToHarvest), {
              type: "harvest", title: `Harvest ${pl.name}`, tag: "HARVEST", color: "bg-purple-100 text-purple-700",
              detail: `~${pl.daysToHarvest} days after planting`,
            });
          }
        });

        (tasks || []).forEach(t => {
          if (!t.due || t.done) return;
          const due = new Date(t.due + "T12:00:00");
          add(due, { type: "task", title: t.title, tag: "TASK", color: "bg-sage-100 text-sage-700", detail: t.detail });
        });

        return map;
      }, [viewYear, viewMonth, profile, placed, tasks]);

      const shiftMonth = (delta) => {
        let m = viewMonth + delta;
        let y = viewYear;
        if (m < 0) { m = 11; y--; }
        if (m > 11) { m = 0; y++; }
        setViewMonth(m);
        setViewYear(y);
        setSelected(1);
      };

      const dayEvents = eventsByDay[selected] || [];

      return (
        <div className="pb-24">
          <Header title="Season Calendar" />
          <div className="px-4 pt-4">
            {!profile?.lastFrost && (
              <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800 mb-3">
                Set your frost dates in Settings for personalized sow/transplant timing.
              </div>
            )}
            {(profile?.lastFrost || profile?.firstFrost) && (
              <div className="bg-sky-50 border border-sky-200 rounded-xl p-3 mb-3">
                <p className="text-xs font-semibold text-sky-900 mb-1">Frost window · growing season</p>
                <p className="text-[11px] text-sky-800 leading-snug">
                  Last spring frost <strong>{profile.lastFrost ? fmtDate(profile.lastFrost) : "—"}</strong>
                  {" → "}
                  First fall frost <strong>{profile.firstFrost ? fmtDate(profile.firstFrost) : "—"}</strong>
                </p>
                <p className="text-[10px] text-sky-700/80 mt-1">
                  Blue days = frost risk (before last / after first). Deeper blue = ±{7} days around a frost date. Green tint = safe growing season.
                </p>
              </div>
            )}
            <div className="flex items-center justify-between mb-4">
              <button onClick={() => shiftMonth(-1)} className="text-sage-500 w-8 h-8"><i className="fas fa-chevron-left"></i></button>
              <h2 className="font-semibold text-sage-800">{monthName}</h2>
              <button onClick={() => shiftMonth(1)} className="text-sage-500 w-8 h-8"><i className="fas fa-chevron-right"></i></button>
            </div>

            <div className="bg-white rounded-2xl p-3 card-shadow mb-4">
              <div className="grid grid-cols-7 gap-1 text-center text-xs text-sage-400 mb-2">
                {["S","M","T","W","T","F","S"].map((d, i) => <div key={i}>{d}</div>)}
              </div>
              <div className="grid grid-cols-7 gap-1">
                {Array.from({ length: firstDow }).map((_, i) => <div key={`e${i}`} />)}
                {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(d => {
                  const has = eventsByDay[d] || [];
                  const isSelected = selected === d;
                  const isToday = d === now.getDate() && viewMonth === now.getMonth() && viewYear === now.getFullYear();
                  const mark = daySeason(d);
                  const seasonBg = isSelected ? "" : (
                    mark.isLast || mark.isFirst ? "bg-sky-200 font-semibold text-sky-900" :
                    mark.frostWindow ? "bg-sky-100 text-sky-900" :
                    !mark.inSeason && (profile?.lastFrost || profile?.firstFrost) ? "bg-sky-50 text-sky-800/80" :
                    mark.inSeason ? "bg-emerald-50/80" : ""
                  );
                  return (
                    <button
                      key={d}
                      onClick={() => setSelected(d)}
                      title={
                        mark.isLast ? "Last spring frost" :
                        mark.isFirst ? "First fall frost" :
                        mark.frostWindow ? "Frost window (±7 days)" :
                        mark.inSeason ? "Growing season" : "Outside growing season"
                      }
                      className={`aspect-square rounded-lg flex flex-col items-center justify-center text-sm relative ${
                        isSelected ? "bg-sage-600 text-white" : isToday ? "bg-sage-100 font-bold" : "hover:bg-sage-50"
                      } ${seasonBg}`}
                    >
                      {d}
                      {(mark.isLast || mark.isFirst) && !isSelected && (
                        <span className="absolute top-0.5 right-0.5 text-[7px] leading-none">❄</span>
                      )}
                      {has.length > 0 && (
                        <div className="flex gap-0.5 mt-0.5 flex-wrap justify-center max-w-full">
                          {has.slice(0, 3).map((h, i) => (
                            <div key={i} className={`w-1 h-1 rounded-full ${
                              h.type === "sow" ? "bg-blue-400" :
                              h.type === "transplant" ? "bg-green-500" :
                              h.type === "fertilize" ? "bg-orange-400" :
                              h.type === "harvest" ? "bg-purple-400" :
                              h.type === "frost" ? "bg-sky-500" : "bg-sage-400"
                            } ${isSelected ? "bg-white" : ""}`} />
                          ))}
                        </div>
                      )}
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="mb-4">
              <h3 className="font-semibold text-sage-800 mb-2">
                {new Date(viewYear, viewMonth, selected).toLocaleDateString("en-US", { month: "short", day: "numeric" })}
                <span className="text-xs font-normal text-sage-500 ml-2">{dayEvents.length} items</span>
              </h3>
              {(() => {
                const mark = daySeason(selected);
                if (mark.isLast) return <p className="text-[10px] text-sky-800 bg-sky-50 rounded-lg px-2 py-1 mb-2">❄ Last spring frost — start of the safe outdoor window for tender crops.</p>;
                if (mark.isFirst) return <p className="text-[10px] text-sky-800 bg-sky-50 rounded-lg px-2 py-1 mb-2">❄ First fall frost — harvest tender crops; cover or pull what’s left.</p>;
                if (mark.frostWindow) return <p className="text-[10px] text-sky-800 bg-sky-50 rounded-lg px-2 py-1 mb-2">Frost window (±7 days of a frost date). Watch overnight lows.</p>;
                if (!mark.inSeason && (profile?.lastFrost || profile?.firstFrost)) return <p className="text-[10px] text-sky-700 bg-sky-50/70 rounded-lg px-2 py-1 mb-2">Outside growing season for your zone frost dates.</p>;
                if (mark.inSeason) return <p className="text-[10px] text-emerald-800 bg-emerald-50 rounded-lg px-2 py-1 mb-2">Inside frost-free growing season.</p>;
                return null;
              })()}
              <div className="space-y-2">
                {dayEvents.map((t, i) => (
                  <div key={i} className="bg-white rounded-xl p-3 card-shadow">
                    <p className="font-medium text-sm text-sage-800">{t.title}</p>
                    {t.detail && <p className="text-xs text-sage-500">{t.detail}</p>}
                    <span className={`inline-block mt-1 text-[10px] font-semibold px-1.5 py-0.5 rounded ${t.color}`}>{t.tag}</span>
                  </div>
                ))}
                {dayEvents.length === 0 && (
                  <p className="text-sm text-sage-400 text-center py-4">Nothing scheduled</p>
                )}
              </div>
            </div>

            <div className="bg-sage-100 rounded-xl p-3">
              <p className="text-xs font-semibold text-sage-700 mb-2">LEGEND</p>
              <div className="grid grid-cols-2 gap-2 text-xs text-sage-600">
                <div className="flex items-center gap-2"><div className="w-2.5 h-2.5 rounded-full bg-blue-400" />Sow</div>
                <div className="flex items-center gap-2"><div className="w-2.5 h-2.5 rounded-full bg-green-500" />Transplant</div>
                <div className="flex items-center gap-2"><div className="w-2.5 h-2.5 rounded-full bg-orange-400" />Fertilize</div>
                <div className="flex items-center gap-2"><div className="w-2.5 h-2.5 rounded-full bg-purple-400" />Harvest</div>
                <div className="flex items-center gap-2"><div className="w-2.5 h-2.5 rounded bg-sky-200 border border-sky-300" />Frost date / window</div>
                <div className="flex items-center gap-2"><div className="w-2.5 h-2.5 rounded bg-emerald-100 border border-emerald-200" />Growing season</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ========== PHASE 2 UI: Kitchen ==========
    function KitchenScreen({ profile, planYear, setPlanYear, placed, setPlaced, beds, setTasks, setSeeds, setActive }) {
      const [tab, setTab] = useState("recipes"); // recipes | preserve | herbs
      const [preserveMethodId, setPreserveMethodId] = useState(null);
      const [preserveStepDone, setPreserveStepDone] = useState({}); // key: `${plantId}:${methodId}` -> boolean[]
      const [preserveStepIndex, setPreserveStepIndex] = useState(0);
      const [selected, setSelected] = useState(() => new Set());
      const [detail, setDetail] = useState(null);
      const [preservePlant, setPreservePlant] = useState("tomato");

      const toggleRecipe = (id) => {
        setSelected(prev => {
          const n = new Set(prev);
          if (n.has(id)) n.delete(id); else n.add(id);
          return n;
        });
      };

      const growList = useMemo(() => growListFromRecipes([...selected]), [selected]);

      // Too late this season if sow date is more than a few days in the past
      // (or plant-out is past for direct seed / transplants)
      const isTooLateThisSeason = (sched) => {
        if (!sched) return true;
        const today = new Date();
        today.setHours(12, 0, 0, 0);
        const sow = new Date((sched.sowDate || sched.plantOutDate) + "T12:00:00");
        const plantOut = new Date((sched.plantOutDate || sched.sowDate) + "T12:00:00");
        // Grace: still OK if sow was within last 3 days
        if (sow < addDays(today, -3) && plantOut < today) return true;
        // Also too late if first frost is within 30 days and crop needs long season
        if (profile?.firstFrost) {
          const ff = new Date(profile.firstFrost + "T12:00:00");
          const daysLeft = Math.round((ff - today) / 86400000);
          const harvest = new Date((sched.harvestStart || sched.plantOutDate) + "T12:00:00");
          if (daysLeft < 21 && harvest > ff) return true;
        }
        return false;
      };

      const profileForYear = (year) => {
        if (!profile?.lastFrost) return profile;
        // Shift frost dates to the target year (keep MM-DD)
        const lf = profile.lastFrost;
        const ff = profile.firstFrost;
        return {
          ...profile,
          lastFrost: lf.length >= 10 ? `${year}-${lf.slice(5)}` : lf,
          firstFrost: ff && ff.length >= 10 ? `${year}-${ff.slice(5)}` : ff,
        };
      };

      const planFromRecipes = () => {
        if (!growList.length) {
          alert("Select at least one recipe first.");
          return;
        }
        const bedId = beds[0]?.id || "tomato";
        const y0 = planYear || new Date().getFullYear();
        const newItems = [];
        const tasksToAdd = [];
        let rolledNext = 0;
        let sameYear = 0;

        growList.forEach((g, idx) => {
          const pl = PLANT_LIBRARY.find(p => p.id === g.plantId);
          if (!pl) return;

          let targetYear = y0;
          let sched = computePlantingSchedule(pl, profileForYear(y0));
          if (!sched) return;

          if (isTooLateThisSeason(sched)) {
            targetYear = y0 + 1;
            sched = computePlantingSchedule(pl, profileForYear(targetYear));
            if (!sched) return;
            rolledNext += 1;
          } else {
            sameYear += 1;
          }

          for (let i = 0; i < Math.min(g.plants, 12); i++) {
            newItems.push({
              id: Date.now() + idx * 100 + i + Math.random(),
              bed: bedId,
              plant: g.plantId,
              plantedAt: sched.plantOutDate,
              status: "planned",
              year: targetYear,
              method: sched.method,
              sowDate: sched.sowDate,
              transplantDate: sched.transplantDate,
              harvestStart: sched.harvestStart,
              fromRecipe: true,
              rolledToNextYear: targetYear > y0,
            });
          }
          tasksToAdd.push({
            id: Date.now() + 500 + idx,
            title: `Grow ${pl.name} for recipes`,
            detail: `~${g.plants} plant(s) · sow ${sched.sowDate}${targetYear > y0 ? ` · ${targetYear}` : ""}`,
            done: false,
            icon: pl.icon || "🌱",
            due: sched.sowDate,
            year: targetYear,
          });
        });

        setPlaced(prev => [...prev, ...newItems]);
        setTasks(prev => [...tasksToAdd, ...prev]);
        setSeeds(prev => prev.map(s => {
          const hit = growList.find(g => {
            const pl = PLANT_LIBRARY.find(p => p.id === g.plantId);
            return pl && (s.name || "").toLowerCase().includes(pl.name.toLowerCase());
          });
          if (!hit || s.qty <= 0) return s;
          const qty = Math.max(0, s.qty - hit.plants);
          return { ...s, qty, low: qty <= 3 };
        }));

        // Jump plan year if everything rolled forward
        if (rolledNext > 0 && sameYear === 0 && setPlanYear) {
          setPlanYear(y0 + 1);
        }

        let msg = `Added ${newItems.length} planting(s).`;
        if (rolledNext > 0 && sameYear > 0) {
          msg += ` ${rolledNext} crop(s) were too late for this season and were scheduled for ${y0 + 1}.`;
        } else if (rolledNext > 0) {
          msg += ` Too late to start these this season — all set for ${y0 + 1}.`;
        } else {
          msg += ` On your ${y0} plan.`;
        }
        alert(msg);
        if (setActive) setActive("plan");
      };

      const preserveGuide = PRESERVE_GUIDES.find(p => p.plantId === preservePlant)
        || PRESERVE_GUIDES.find(p => p.plantId === "herb");

      // Ready-to-preserve: harvest window within 14 days
      const readyPreserve = useMemo(() => {
        const today = new Date();
        today.setHours(12, 0, 0, 0);
        return (placed || [])
          .filter(p => p.harvestStart && (p.year || new Date().getFullYear()) === (planYear || new Date().getFullYear()))
          .map(p => {
            const h = new Date(p.harvestStart + "T12:00:00");
            const days = Math.round((h - today) / 86400000);
            const pl = PLANT_LIBRARY.find(x => x.id === p.plant);
            const guide = PRESERVE_GUIDES.find(g => g.plantId === p.plant);
            return { ...p, days, pl, guide };
          })
          .filter(x => x.days >= -7 && x.days <= 21 && x.guide)
          .sort((a, b) => a.days - b.days);
      }, [placed, planYear]);

      return (
        <div className="pb-24">
          <Header title="Kitchen" />
          <div className="px-4 pt-3 space-y-4">
            <div className="flex gap-1 bg-white rounded-xl p-1 card-shadow">
              {[
                { id: "recipes", label: "Recipes" },
                { id: "preserve", label: "Preserve" },
                { id: "herbs", label: "Herbs" },
              ].map(t => (
                <button
                  key={t.id}
                  type="button"
                  onClick={() => setTab(t.id)}
                  className={`flex-1 py-2 rounded-lg text-xs font-semibold ${
                    tab === t.id ? "bg-sage-600 text-white" : "text-sage-600"
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>

            {tab === "recipes" && (
              <>
                <p className="text-xs text-sage-500">
                  Select recipes you want to cook or put up. PlotPilot builds a grow list and can add plantings to your {planYear} plan.
                </p>
                <div className="space-y-2">
                  {RECIPE_LIBRARY.map(r => (
                    <div key={r.id} className={`bg-white rounded-xl p-3 card-shadow border-2 ${selected.has(r.id) ? "border-sage-500" : "border-transparent"}`}>
                      <div className="flex items-start gap-2">
                        <button type="button" onClick={() => toggleRecipe(r.id)} className="mt-1 text-sage-600">
                          <i className={`fas ${selected.has(r.id) ? "fa-check-square" : "fa-square"} text-lg`}></i>
                        </button>
                        <button type="button" className="flex-1 text-left" onClick={() => setDetail(r)}>
                          <p className="font-medium text-sm text-sage-800">{r.icon} {r.name}</p>
                          <p className="text-[10px] text-sage-500">{r.servings} servings · {r.time} · {r.tags.join(", ")}</p>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                {selected.size > 0 && (
                  <div className="bg-sage-50 border border-sage-200 rounded-2xl p-4 space-y-2 sticky bottom-20">
                    <p className="text-sm font-semibold text-sage-800">Grow list ({growList.length} crops)</p>
                    {growList.map(g => {
                      const pl = PLANT_LIBRARY.find(p => p.id === g.plantId);
                      return (
                        <div key={g.plantId} className="flex justify-between text-xs text-sage-700">
                          <span>{pl?.icon} {pl?.name || g.plantId}</span>
                          <span className="font-medium">~{g.plants} plant(s)</span>
                        </div>
                      );
                    })}
                    <button type="button" onClick={planFromRecipes} className="w-full mt-2 py-2.5 rounded-xl bg-sage-600 text-white text-sm font-medium">
                      Add to {planYear} garden plan
                    </button>
                  </div>
                )}
              </>
            )}

            {tab === "preserve" && (() => {
              const methods = preserveGuide?.methods || [];
              const activeMethod = methods.find(m => m.id === preserveMethodId) || null;
              const stepKey = activeMethod ? `${preservePlant}:${activeMethod.id}` : null;
              const doneArr = stepKey ? (preserveStepDone[stepKey] || (activeMethod.steps || []).map(() => false)) : [];
              const doneCount = doneArr.filter(Boolean).length;
              const totalSteps = activeMethod?.steps?.length || 0;
              const progress = totalSteps ? Math.round((doneCount / totalSteps) * 100) : 0;

              const toggleStep = (idx) => {
                if (!stepKey || !activeMethod) return;
                setPreserveStepDone(prev => {
                  const cur = prev[stepKey] || activeMethod.steps.map(() => false);
                  const next = [...cur];
                  next[idx] = !next[idx];
                  return { ...prev, [stepKey]: next };
                });
              };

              const schedulePreserveTask = () => {
                if (!activeMethod || !setTasks) return;
                const pl = PLANT_LIBRARY.find(p => p.id === preservePlant);
                setTasks(prev => [{
                  id: Date.now() + Math.random(),
                  title: `Preserve ${pl?.name || preservePlant}: ${activeMethod.name}`,
                  detail: `${totalSteps} steps · ${activeMethod.difficulty || ""} · ${activeMethod.time || ""}`,
                  done: false,
                  icon: "🫙",
                  due: toISODate(new Date()),
                  year: planYear,
                }, ...prev]);
                alert("Added to your task list for today.");
              };

              return (
              <>
                {readyPreserve.length > 0 && (
                  <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 space-y-2">
                    <p className="text-xs font-semibold text-amber-900">Ready to preserve</p>
                    {readyPreserve.slice(0, 5).map(x => (
                      <button
                        key={x.id}
                        type="button"
                        className="w-full text-xs text-amber-900 flex justify-between hover:bg-amber-100/80 rounded-lg px-1 py-0.5"
                        onClick={() => {
                          const pid = x.pl?.cropId || x.pl?.id || x.plant;
                          if (PRESERVE_GUIDES.some(g => g.plantId === pid)) {
                            setPreservePlant(pid);
                            setPreserveMethodId(null);
                          }
                        }}
                      >
                        <span>{x.pl?.icon} {x.pl?.name}</span>
                        <span>{x.days < 0 ? "harvest window open" : `in ${x.days}d`}</span>
                      </button>
                    ))}
                  </div>
                )}

                <label className="text-xs text-sage-500">1. Choose crop</label>
                <div className="flex gap-1.5 overflow-x-auto pb-1 -mx-1 px-1">
                  {PRESERVE_GUIDES.map(g => {
                    const pl = PLANT_LIBRARY.find(p => p.id === g.plantId);
                    const selected = preservePlant === g.plantId;
                    return (
                      <button
                        key={g.plantId}
                        type="button"
                        onClick={() => { setPreservePlant(g.plantId); setPreserveMethodId(null); setPreserveStepIndex(0); }}
                        className={`shrink-0 px-3 py-2 rounded-xl text-xs font-medium ${
                          selected ? "bg-sage-600 text-white" : "bg-white text-sage-700 card-shadow"
                        }`}
                      >
                        {pl?.icon || "🌿"} {pl?.name || g.plantId}
                      </button>
                    );
                  })}
                </div>

                <label className="text-xs text-sage-500 mt-2 block">2. Choose process</label>
                <div className="space-y-2">
                  {methods.map(m => (
                    <button
                      key={m.id}
                      type="button"
                      onClick={() => { setPreserveMethodId(m.id); setPreserveStepIndex(0); }}
                      className={`w-full text-left bg-white rounded-xl p-3 card-shadow border-2 transition ${
                        preserveMethodId === m.id ? "border-sage-600" : "border-transparent"
                      }`}
                    >
                      <div className="flex justify-between items-start gap-2">
                        <p className="font-medium text-sm text-sage-800">{m.name}</p>
                        <span className={`text-[9px] px-1.5 py-0.5 rounded shrink-0 ${
                          m.difficulty === "Easy" ? "bg-green-100 text-green-800"
                          : m.difficulty === "Advanced" ? "bg-red-100 text-red-800"
                          : "bg-amber-100 text-amber-900"
                        }`}>{m.difficulty || "—"}</span>
                      </div>
                      <p className="text-[10px] text-sage-500 mt-1">⏱ {m.time || "—"} · {m.steps?.length || 0} steps</p>
                    </button>
                  ))}
                </div>

                {activeMethod && (
                  <div className="bg-white rounded-2xl p-4 card-shadow space-y-3 mt-2">
                    <div className="flex justify-between items-center">
                      <h3 className="font-semibold text-sage-800 text-sm">{activeMethod.name}</h3>
                      <button type="button" onClick={() => setPreserveMethodId(null)} className="text-[10px] text-sage-500">Close</button>
                    </div>

                    {/* Progress */}
                    <div>
                      <div className="flex justify-between text-[10px] text-sage-500 mb-1">
                        <span>{doneCount} / {totalSteps} steps</span>
                        <span>{progress}%</span>
                      </div>
                      <div className="h-2 bg-sage-100 rounded-full overflow-hidden">
                        <div className="h-full bg-sage-600 transition-all" style={{ width: `${progress}%` }} />
                      </div>
                    </div>

                    {activeMethod.safety && (
                      <div className="bg-amber-50 border border-amber-200 rounded-xl p-2.5 text-[10px] text-amber-950">
                        <p className="font-semibold mb-0.5">Safety</p>
                        <p>{activeMethod.safety}</p>
                      </div>
                    )}

                    {activeMethod.equipment && (
                      <div>
                        <p className="text-[10px] font-semibold text-sage-600 uppercase tracking-wide mb-1">Equipment checklist</p>
                        <div className="flex flex-wrap gap-1">
                          {activeMethod.equipment.map(eq => (
                            <span key={eq} className="text-[10px] bg-sage-50 text-sage-700 px-2 py-1 rounded-lg border border-sage-100">{eq}</span>
                          ))}
                        </div>
                      </div>
                    )}

                    <div>
                      <p className="text-[10px] font-semibold text-sage-600 uppercase tracking-wide mb-2">Step-by-step</p>
                      <div className="space-y-2">
                        {(activeMethod.steps || []).map((step, idx) => (
                          <button
                            key={idx}
                            type="button"
                            onClick={() => toggleStep(idx)}
                            className={`w-full flex gap-2 items-start text-left rounded-xl px-2.5 py-2 border ${
                              doneArr[idx] ? "bg-emerald-50 border-emerald-200" : "bg-sage-50 border-sage-100"
                            }`}
                          >
                            <span className={`mt-0.5 w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold shrink-0 ${
                              doneArr[idx] ? "bg-emerald-600 text-white" : "bg-white border border-sage-300 text-sage-500"
                            }`}>
                              {doneArr[idx] ? "✓" : idx + 1}
                            </span>
                            <span className={`text-xs ${doneArr[idx] ? "text-emerald-900 line-through" : "text-sage-800"}`}>{step}</span>
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => {
                          if (!stepKey || !activeMethod) return;
                          setPreserveStepDone(prev => ({
                            ...prev,
                            [stepKey]: activeMethod.steps.map(() => true),
                          }));
                        }}
                        className="flex-1 py-2 rounded-xl border text-xs font-medium text-sage-700"
                      >
                        Mark all done
                      </button>
                      <button
                        type="button"
                        onClick={schedulePreserveTask}
                        className="flex-1 py-2 rounded-xl bg-sage-600 text-white text-xs font-medium"
                      >
                        Add to tasks
                      </button>
                    </div>

                    {progress === 100 && (
                      <p className="text-center text-xs text-emerald-700 font-medium">All steps checked — great work. Label and store safely.</p>
                    )}
                  </div>
                )}

                <p className="text-[10px] text-sage-400">
                  Always follow tested, current food-preservation guidelines (e.g. USDA / your local extension). PlotPilot is a planning checklist — not a substitute for official canning instructions or food-safety advice.
                </p>
              </>
              );
            })()}

            {tab === "herbs" && (
              <>
                <p className="text-xs text-sage-500">
                  Culinary and household ideas only — not medical advice.
                </p>
                <div className="space-y-2">
                  {HERBAL_NOTES.map(h => {
                    const pl = PLANT_LIBRARY.find(p => p.id === h.plantId);
                    return (
                      <div key={h.plantId} className="bg-white rounded-xl p-3 card-shadow">
                        <p className="font-medium text-sm text-sage-800">{pl?.icon || "🌿"} {pl?.name || h.plantId}</p>
                        <ul className="mt-1 text-xs text-sage-600 list-disc pl-4 space-y-0.5">
                          {h.uses.map((u, i) => <li key={i}>{u}</li>)}
                        </ul>
                        <p className="text-[10px] text-sage-400 mt-1">{h.caution}</p>
                      </div>
                    );
                  })}
                </div>
              </>
            )}
          </div>

          {detail && (
            <div className="fixed inset-0 bg-black/40 z-[100] flex items-end sm:items-center justify-center px-4 pt-4 pb-24" onClick={() => setDetail(null)}>
              <div className="bg-white rounded-2xl p-5 w-full max-w-sm max-h-[80vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                <p className="text-2xl text-center">{detail.icon}</p>
                <h3 className="font-semibold text-sage-800 text-center text-lg">{detail.name}</h3>
                <p className="text-xs text-sage-500 text-center mb-3">{detail.servings} servings · {detail.time}</p>
                <p className="text-xs font-semibold text-sage-700 mb-1">Ingredients (garden-linked)</p>
                <ul className="text-xs text-sage-600 space-y-1 mb-3">
                  {detail.ingredients.map((ing, i) => {
                    const pl = PLANT_LIBRARY.find(p => p.id === ing.plantId);
                    return (
                      <li key={i} className="flex justify-between">
                        <span>{pl?.icon} {pl?.name || ing.plantId}</span>
                        <span>{ing.amount} {ing.unit} · ~{plantsNeededForIngredient(ing)} plant(s)</span>
                      </li>
                    );
                  })}
                </ul>
                <p className="text-xs text-sage-600 mb-4">{detail.steps}</p>
                <button
                  type="button"
                  className="w-full py-2.5 rounded-xl bg-sage-600 text-white text-sm font-medium mb-2"
                  onClick={() => {
                    setSelected(prev => new Set([...prev, detail.id]));
                    setDetail(null);
                  }}
                >
                  Add to grow selection
                </button>
                <button type="button" className="w-full py-2 text-sm text-sage-500" onClick={() => setDetail(null)}>Close</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ========== PHASE 1: 3-year plan, schedules, succession, harvest ==========
    function PlanScreen({
      profile, planYear, setPlanYear, placed, setPlaced, beds, setBeds,
      harvests, setHarvests, setTasks, seeds, setSeeds, rotationHistory, customPlants,
    }) {
      const y0 = new Date().getFullYear();
      const years = [y0, y0 + 1, y0 + 2];
      const [showAdd, setShowAdd] = useState(false);
      const [form, setForm] = useState({ cropId: "pepper", plantIds: ["pepper"], bedId: beds[0]?.id || "tomato", successions: 1 });
      const [showBedForm, setShowBedForm] = useState(false);
      const [editingBedId, setEditingBedId] = useState(null);
      const [bedForm, setBedForm] = useState({ name: "", widthFt: 4, lengthFt: 8, sun: "Full sun", mapX: 10, mapY: 10 });
      const [harvestForm, setHarvestForm] = useState({ placedId: "", plantId: "", bedId: "", qty: "", unit: "lb", notes: "" });
      const [showGardenMap, setShowGardenMap] = useState(true);

      const yearPlaced = useMemo(
        () => (placed || []).filter(p => (p.year || y0) === planYear),
        [placed, planYear, y0]
      );

      const addPlanting = () => {
        const ids = (form.plantIds && form.plantIds.length) ? form.plantIds : [form.cropId || form.plantId || "tomato"];
        const newItems = [];
        ids.forEach((plantId, vi) => {
          const pl = resolvePlant(plantId, customPlants) || PLANT_LIBRARY.find(p => p.id === plantId);
          if (!pl) return;
          const sched = computePlantingSchedule(pl, profile);
          if (!sched) return;
          const count = Math.max(1, Math.min(8, Number(form.successions) || 1));
          const interval = pl.successionDays > 0 ? pl.successionDays : 14;
          for (let i = 0; i < count; i++) {
            const offset = i * interval;
            const sow = addDays(new Date(sched.sowDate + "T12:00:00"), offset);
            const plantOut = addDays(new Date(sched.plantOutDate + "T12:00:00"), offset);
            const harvest = addDays(new Date(sched.harvestStart + "T12:00:00"), offset);
            newItems.push({
              id: Date.now() + vi * 100 + i + Math.random(),
              bed: form.bedId,
              plant: plantId,
              plantedAt: toISODate(plantOut),
              status: "planned",
              year: planYear,
              method: sched.method,
              sowDate: toISODate(sow),
              transplantDate: sched.transplantDate
                ? toISODate(addDays(new Date(sched.transplantDate + "T12:00:00"), offset))
                : null,
              harvestStart: toISODate(harvest),
              successionIndex: i + 1,
              successionOf: count,
            });
          }
        });
        if (!newItems.length) return;
        setPlaced(prev => [...prev, ...newItems]);

        // Tasks for first succession — Seedtime-style windows
        const first = newItems[0];
        const firstPl = resolvePlant(first.plant, customPlants) || PLANT_LIBRARY.find(p => p.id === first.plant);
        const firstName = plantDisplayName(firstPl) || first.plant;
        const tasksToAdd = [];
        if (first.sowDate) {
          const w = makeTaskWindow(first.sowDate, 7, 14, profile, false);
          tasksToAdd.push({
            id: Date.now() + 100,
            kind: "sow",
            title: `Sow ${firstName}${first.method === "indoor" ? " indoors" : ""}`,
            plants: [firstName],
            detail: fmtWindow(w.windowStart, w.windowEnd, w.due),
            done: false,
            icon: "🌱",
            due: w.due,
            windowStart: w.windowStart,
            windowEnd: w.windowEnd,
            year: planYear,
          });
        }
        if (first.transplantDate) {
          const w = makeTaskWindow(first.transplantDate, 5, 10, profile, true);
          tasksToAdd.push({
            id: Date.now() + 101,
            kind: "transplant",
            title: `Transplant ${firstName}`,
            plants: [firstName],
            detail: fmtWindow(w.windowStart, w.windowEnd, w.due),
            done: false,
            icon: "🌿",
            due: w.due,
            windowStart: w.windowStart,
            windowEnd: w.windowEnd,
            year: planYear,
          });
        }
        if (first.harvestStart) {
          const span = firstPl?.daysToHarvest
            ? Math.min(35, Math.max(10, Math.round(firstPl.daysToHarvest * 0.25)))
            : 14;
          const w = makeTaskWindow(first.harvestStart, 5, span, profile, true);
          tasksToAdd.push({
            id: Date.now() + 102,
            kind: "harvest",
            title: "Harvest window",
            plants: [firstName],
            detail: fmtWindow(w.windowStart, w.windowEnd, w.due),
            done: false,
            icon: "🧺",
            due: w.due,
            windowStart: w.windowStart,
            windowEnd: w.windowEnd,
            year: planYear,
          });
        }
        setTasks(prev => mergeCareTasksInto(prev, tasksToAdd));

        // Deplete vault if matching seed name contains plant name
        setSeeds(prev => prev.map(s => {
          if ((s.name || "").toLowerCase().includes(pl.name.toLowerCase()) && s.qty > 0) {
            const qty = Math.max(0, s.qty - count);
            return { ...s, qty, low: qty <= 3 };
          }
          return s;
        }));

        setShowAdd(false);
      };

      const copyToNextYear = () => {
        const next = planYear + 1;
        if (next > y0 + 2) {
          alert("Plan covers three years from this year.");
          return;
        }
        const source = yearPlaced.filter(p => p.status !== "harvested" && !p.isCoverCrop && !p.isBedPrep);
        if (!source.length) {
          alert("No plantings to copy this year.");
          return;
        }
        const copies = source.map((p, i) => {
          const pl = resolvePlant(p.plant, customPlants) || PLANT_LIBRARY.find(x => x.id === p.plant);
          const sched = computePlantingSchedule(pl, {
            ...profile,
            lastFrost: profile.lastFrost
              ? `${next}-${profile.lastFrost.slice(5)}`
              : profile.lastFrost,
          });
          return {
            ...p,
            id: Date.now() + i + Math.random(),
            year: next,
            status: "planned",
            sowDate: sched?.sowDate || p.sowDate,
            transplantDate: sched?.transplantDate || p.transplantDate,
            plantedAt: sched?.plantOutDate || p.plantedAt,
            harvestStart: sched?.harvestStart || p.harvestStart,
          };
        });
        setPlaced(prev => [...prev, ...copies]);
        setPlanYear(next);
        alert(`Copied ${copies.length} planting(s) to ${next}. Check Rotate for family conflicts.`);
      };

      // Families recently in a bed (history + current year plantings)
      const recentFamiliesForBed = (bedId, throughYear) => {
        const fams = new Set();
        const hist = (rotationHistory && rotationHistory[bedId]) || [];
        hist.forEach(h => {
          if (throughYear - h.year < ROTATION_YEARS && throughYear - h.year >= 0) {
            (h.families || []).forEach(f => fams.add(f));
          }
        });
        (placed || []).filter(p => p.bed === bedId && (p.year || y0) <= throughYear && (p.year || y0) > throughYear - ROTATION_YEARS)
          .forEach(p => {
            const pl = resolvePlant(p.plant, customPlants) || PLANT_LIBRARY.find(x => x.id === p.plant);
            if (pl?.family && pl.family !== "Ericaceae") fams.add(pl.family);
          });
        return fams;
      };

      // Prefer rotation order when picking next crop family
      const ROTATION_PREF = ["Fabaceae", "Brassicaceae", "Apiaceae", "Amaryllidaceae", "Cucurbitaceae", "Asteraceae", "Amaranthaceae", "Poaceae", "Lamiaceae", "Solanaceae"];

      const pickCropForBed = (bedId, avoidFamilies, usedCropIds) => {
        const annuals = PLANT_LIBRARY.filter(p =>
          p.type === "Vegetable" || p.type === "Herb" || p.type === "Fruit"
        ).filter(p => p.family !== "Ericaceae" && p.id !== "blueberry" && p.id !== "asparagus" && p.id !== "strawberry");

        // Prefer families not recently used, weighted by rotation preference
        const ranked = annuals
          .filter(p => !avoidFamilies.has(p.family))
          .filter(p => !usedCropIds.has(p.id))
          .map(p => {
            const prefIdx = ROTATION_PREF.indexOf(p.family);
            return { p, score: prefIdx >= 0 ? prefIdx : 20 };
          })
          .sort((a, b) => a.score - b.score);

        if (ranked.length) return ranked[0].p;

        // Fallback: any crop not same family as most recent
        const fallback = annuals.find(p => !avoidFamilies.has(p.family));
        return fallback || annuals[0] || null;
      };

      /** Auto-fill next year with rotation-aware crops per bed */
      const suggestRotationForNextYears = () => {
        const targets = [planYear + 1, planYear + 2].filter(y => y <= y0 + 2);
        if (!targets.length) {
          alert("Already at the end of the 3-year plan window.");
          return;
        }
        if (!beds.length) {
          alert("Add beds first.");
          return;
        }

        const newItems = [];
        const tasksToAdd = [];
        const usedThisPass = new Set();

        targets.forEach(targetYear => {
          const profileY = {
            ...profile,
            lastFrost: profile?.lastFrost && profile.lastFrost.length >= 10
              ? `${targetYear}-${profile.lastFrost.slice(5)}`
              : profile?.lastFrost,
            firstFrost: profile?.firstFrost && profile.firstFrost.length >= 10
              ? `${targetYear}-${profile.firstFrost.slice(5)}`
              : profile?.firstFrost,
          };

          // Clear existing suggested rotation for that year? only add if bed empty for that year
          beds.forEach((bed, bi) => {
            const already = (placed || []).some(p =>
              p.bed === bed.id && (p.year || y0) === targetYear && !p.isCoverCrop && !p.isBedPrep
            );
            if (already) return; // don't overwrite manual plan

            const avoid = recentFamiliesForBed(bed.id, targetYear - 1);
            // Also avoid families we're about to plant in this batch for same year other beds less critical
            const crop = pickCropForBed(bed.id, avoid, usedThisPass);
            if (!crop) return;
            usedThisPass.add(crop.id);

            const sched = computePlantingSchedule(crop, profileY);
            if (!sched) return;

            newItems.push({
              id: Date.now() + bi + targetYear + Math.random(),
              bed: bed.id,
              plant: crop.id,
              plantedAt: sched.plantOutDate,
              status: "planned",
              year: targetYear,
              method: sched.method,
              sowDate: sched.sowDate,
              transplantDate: sched.transplantDate,
              harvestStart: sched.harvestStart,
              fromRotationSuggest: true,
            });

            tasksToAdd.push({
              id: Date.now() + 8000 + bi + targetYear,
              title: `Sow ${crop.name} (${bed.name})`,
              detail: `${targetYear} rotation plan · ${sched.sowDate}`,
              done: false,
              icon: crop.icon || "🌱",
              due: sched.sowDate,
              year: targetYear,
            });
          });
        });

        if (!newItems.length) {
          alert("Every bed already has crops for the next year(s), or no safe rotation pick was found. Clear a year or edit beds, then try again.");
          return;
        }

        setPlaced(prev => [...prev, ...newItems]);
        setTasks(prev => [...tasksToAdd, ...prev]);
        setPlanYear(targets[0]);
        alert(`Suggested ${newItems.length} rotation planting(s) across ${targets.join(" & ")}. Review each bed and adjust as needed.`);
      };

      /** End-of-season bed prep tasks + optional cover crop */
      const planSeasonEndPrep = (withCover) => {
        if (!beds.length) {
          alert("Add beds first.");
          return;
        }
        const ff = profile?.firstFrost
          ? new Date(profile.firstFrost + "T12:00:00")
          : addDays(new Date(), 60);
        // Prep window: 1–2 weeks before first frost through shortly after
        const clearDate = toISODate(addDays(ff, -10));
        const amendDate = toISODate(addDays(ff, -3));
        const coverSow = toISODate(addDays(ff, -14)); // cover often sown before hard freeze

        const coverOptions = PLANT_LIBRARY.filter(p => p.type === "Cover");
        const defaultCover = coverOptions.find(p => p.id === "rye")
          || coverOptions.find(p => p.id === "clover")
          || coverOptions.find(p => p.id === "buckwheat")
          || coverOptions[0];

        const tasksToAdd = [];
        const plantings = [];

        beds.forEach((bed, i) => {
          tasksToAdd.push({
            id: Date.now() + i * 10 + 1,
            title: `Clear & remove spent crops — ${bed.name}`,
            detail: `End of ${planYear} · pull plants, weeds; compost disease-free material`,
            done: false,
            icon: "🧹",
            due: clearDate,
            year: planYear,
            isBedPrep: true,
          });
          tasksToAdd.push({
            id: Date.now() + i * 10 + 2,
            title: `Amend soil — ${bed.name}`,
            detail: `Compost / manure / minerals for next season · after clear-out`,
            done: false,
            icon: "🪴",
            due: amendDate,
            year: planYear,
            isBedPrep: true,
          });
          tasksToAdd.push({
            id: Date.now() + i * 10 + 3,
            title: `Note this year’s crops for rotation — ${bed.name}`,
            detail: `Log season under Crop Rotation so next year avoids same families`,
            done: false,
            icon: "📓",
            due: clearDate,
            year: planYear,
            isBedPrep: true,
          });

          if (withCover && defaultCover) {
            // Prefer winter-hardy covers late season: rye, vetch, clover; buckwheat only if early
            let cover = defaultCover;
            const month = ff.getMonth(); // 0-11
            if (month >= 8) {
              // Sept+ → rye / vetch / clover
              cover = coverOptions.find(p => p.id === "rye")
                || coverOptions.find(p => p.id === "vetch")
                || coverOptions.find(p => p.id === "clover")
                || defaultCover;
            } else {
              cover = coverOptions.find(p => p.id === "buckwheat")
                || coverOptions.find(p => p.id === "oats")
                || defaultCover;
            }

            plantings.push({
              id: Date.now() + i * 10 + 5 + Math.random(),
              bed: bed.id,
              plant: cover.id,
              plantedAt: coverSow,
              status: "planned",
              year: planYear,
              method: "direct",
              sowDate: coverSow,
              transplantDate: null,
              harvestStart: null,
              isCoverCrop: true,
              fromBedPrep: true,
            });
            tasksToAdd.push({
              id: Date.now() + i * 10 + 4,
              title: `Sow cover crop ${cover.name} — ${bed.name}`,
              detail: `Protect soil over winter · terminate before spring planting`,
              done: false,
              icon: "🌱",
              due: coverSow,
              year: planYear,
              isBedPrep: true,
            });
          }
        });

        // Spring: terminate cover before planting
        if (withCover) {
          const springTerm = profile?.lastFrost
            ? toISODate(addDays(new Date(profile.lastFrost + "T12:00:00"), -14))
            : toISODate(addDays(new Date(), 120));
          beds.forEach((bed, i) => {
            tasksToAdd.push({
              id: Date.now() + 5000 + i,
              title: `Terminate cover crop — ${bed.name}`,
              detail: `Cut / turn in 2+ weeks before spring transplants (${planYear + 1})`,
              done: false,
              icon: "✂️",
              due: springTerm,
              year: planYear + 1,
              isBedPrep: true,
            });
          });
        }

        setTasks(prev => [...tasksToAdd, ...prev]);
        if (plantings.length) setPlaced(prev => [...prev, ...plantings]);

        alert(
          withCover
            ? `Added bed-prep tasks for ${beds.length} bed(s) plus cover-crop sowings. Check tasks and Plan list.`
            : `Added end-of-season prep tasks for ${beds.length} bed(s) (no cover crop).`
        );
      };

      const openNewBed = () => {
        setEditingBedId(null);
        setBedForm({ name: "", widthFt: 4, lengthFt: 8, sun: "Full sun", mapX: 10, mapY: 10, color: BED_COLORS[0] });
        setShowBedForm(true);
      };

      const openEditBedPlan = (b) => {
        setEditingBedId(b.id);
        setBedForm({
          name: b.name,
          widthFt: b.widthFt || 4,
          lengthFt: b.lengthFt || 8,
          sun: b.sun || "Full sun",
          mapX: b.mapX != null ? b.mapX : 10,
          mapY: b.mapY != null ? b.mapY : 10,
          color: b.color || BED_COLORS[0],
        });
        setShowBedForm(true);
      };

      const addBed = () => {
        if (!bedForm.name.trim()) return;
        if (editingBedId) {
          setBeds(prev => prev.map(b => b.id === editingBedId ? {
            ...b,
            name: bedForm.name.trim(),
            widthFt: Math.max(1, Number(bedForm.widthFt) || 4),
            lengthFt: Math.max(1, Number(bedForm.lengthFt) || 8),
            sun: bedForm.sun,
            color: bedForm.color || b.color,
            mapX: Math.min(90, Math.max(0, Number(bedForm.mapX) || 0)),
            mapY: Math.min(85, Math.max(0, Number(bedForm.mapY) || 0)),
          } : b));
        } else {
          const id = "bed_" + Date.now();
          setBeds(prev => [...prev, {
            id,
            name: bedForm.name.trim(),
            widthFt: Math.max(1, Number(bedForm.widthFt) || 4),
            lengthFt: Math.max(1, Number(bedForm.lengthFt) || 8),
            sun: bedForm.sun,
            color: bedForm.color || BED_COLORS[prev.length % BED_COLORS.length],
            mapX: Math.min(90, Math.max(0, Number(bedForm.mapX) || 10)),
            mapY: Math.min(85, Math.max(0, Number(bedForm.mapY) || 10)),
          }]);
        }
        setBedForm({ name: "", widthFt: 4, lengthFt: 8, sun: "Full sun", mapX: 10, mapY: 10, color: BED_COLORS[0] });
        setEditingBedId(null);
        setShowBedForm(false);
      };

      const removeBed = (bedId) => {
        if (!confirm("Delete this bed?")) return;
        setBeds(prev => prev.filter(b => b.id !== bedId));
        const fallback = beds.find(b => b.id !== bedId)?.id;
        if (fallback) {
          setPlaced(prev => prev.map(p => p.bed === bedId ? { ...p, bed: fallback } : p));
        }
      };

      const growingHarvestOptions = useMemo(() => {
        return (yearPlaced || [])
          .filter(p => p.status !== "harvested" && !p.isCoverCrop && !p.isBedPrep)
          .map(p => {
            const pl = resolvePlant(p.plant, customPlants) || PLANT_LIBRARY.find(x => x.id === p.plant);
            return {
              placedId: p.id,
              plantId: p.plant,
              bedId: p.bed,
              label: `${plantDisplayName(pl, { withCrop: true })} · in ${bedLabel(beds, p.bed)}`,
              icon: pl?.icon || "🌱",
            };
          });
      }, [yearPlaced, beds, customPlants]);

      const logHarvest = () => {
        const qty = parseFloat(harvestForm.qty);
        if (!qty || qty <= 0) {
          alert("Enter a harvest quantity.");
          return;
        }

        let plantId = harvestForm.plantId;
        let bedId = harvestForm.bedId || null;
        let placedId = harvestForm.placedId || null;

        // Linked to a specific growing placement
        if (placedId) {
          const item = (placed || []).find(p => String(p.id) === String(placedId));
          if (item) {
            plantId = item.plant;
            bedId = item.bed;
          }
        }

        // Not linked — optional plant from library
        if (!placedId && plantId) {
          const inGarden = (yearPlaced || []).some(p =>
            (p.plant === plantId || (resolvePlant(p.plant, customPlants)?.cropId === plantId))
            && p.status !== "harvested"
          );
          if (!inGarden) {
            const pl = resolvePlant(plantId, customPlants) || PLANT_LIBRARY.find(p => p.id === plantId);
            const name = plantDisplayName(pl);
            const bedList = resolveBedList(beds);
            if (confirm(`${name} is not in your garden for ${planYear}.\n\nAdd it to a bed now so future tasks and harvests stay linked?`)) {
              if (!bedList.length) {
                alert("Add a bed in Layout or Plan first.");
                return;
              }
              let pickBed = bedList[0].id;
              if (bedList.length > 1) {
                const names = bedList.map((b, i) => `${i + 1}. ${b.name}`).join("\n");
                const ans = prompt(`Which bed?\n${names}\n\nEnter number 1–${bedList.length}:`, "1");
                const idx = Math.max(0, Math.min(bedList.length - 1, (parseInt(ans, 10) || 1) - 1));
                pickBed = bedList[idx].id;
              }
              const plantedAt = toISODate(new Date());
              const newItem = {
                id: Date.now() + Math.random(),
                bed: pickBed,
                plant: plantId,
                plantedAt,
                status: "growing",
                year: planYear,
                method: pl?.method,
                harvestStart: careScheduleFromPlantDate(pl, plantedAt, profile).harvestDue || null,
              };
              setPlaced(prev => [...prev, newItem]);
              placedId = newItem.id;
              bedId = pickBed;
              if (setTasks && pl) {
                const batch = buildCareTasksForPlanting(pl, plantedAt, {
                  bedName: bedLabel(beds, pickBed),
                  year: planYear,
                  profile,
                });
                setTasks(prev => mergeCareTasksInto(prev, batch));
              }
            }
          } else if (!bedId) {
            const match = (yearPlaced || []).find(p => p.plant === plantId && p.status !== "harvested");
            if (match) {
              bedId = match.bed;
              placedId = match.id;
            }
          }
        }

        if (!plantId) {
          alert("Choose a plant from your garden or the library.");
          return;
        }

        setHarvests(prev => [{
          id: Date.now(),
          date: toISODate(new Date()),
          year: planYear,
          plantId,
          bedId: bedId || null,
          placedId: placedId || null,
          qty,
          unit: harvestForm.unit,
          notes: harvestForm.notes || "",
        }, ...prev]);
        setHarvestForm(f => ({ ...f, qty: "", notes: "", placedId: placedId || f.placedId }));
      };

      const yearHarvests = (harvests || []).filter(h => (h.year || y0) === planYear);

      return (
        <div className="pb-24">
          <Header title="3-Year Plan" />
          <div className="px-4 pt-4 space-y-4">
            <div className="flex gap-2">
              {years.map(y => (
                <button
                  key={y}
                  type="button"
                  onClick={() => setPlanYear(y)}
                  className={`flex-1 py-2 rounded-xl text-sm font-semibold ${
                    planYear === y ? "bg-sage-600 text-white" : "bg-white text-sage-700 card-shadow"
                  }`}
                >
                  {y}
                </button>
              ))}
            </div>

            <div className="bg-sage-100 rounded-xl p-3 text-xs text-sage-700">
              Schedules use your frost dates
              {profile?.lastFrost ? ` (last spring frost ${profile.lastFrost})` : " — set them in Settings"}.
              Succession repeats sowings every crop interval.
            </div>

            <div className="flex gap-2">
              <button type="button" onClick={() => setShowAdd(true)} className="flex-1 py-2.5 rounded-xl bg-sage-600 text-white text-sm font-medium">
                + Add planting
              </button>
              <button type="button" onClick={copyToNextYear} className="flex-1 py-2.5 rounded-xl border border-sage-300 text-sage-700 text-sm font-medium">
                Copy → next year
              </button>
            </div>
