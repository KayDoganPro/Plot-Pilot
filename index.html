    function CropRotationScreen({ placed, setPlaced, rotationHistory, setRotationHistory, beds }) {
      const bedList = beds && beds.length ? beds : DEFAULT_BEDS;
      const currentYear = new Date().getFullYear();
      const [selectedBed, setSelectedBed] = useState(bedList[0]?.id || "tomato");
      const [showLogConfirm, setShowLogConfirm] = useState(false);
      const [solveMsg, setSolveMsg] = useState("");

      const getPlant = (id) => resolvePlant(id) || PLANT_LIBRARY.find(p => p.id === id);

      const clearBedHistory = () => {
        if (!confirm("Clear logged rotation history for this bed? This does not remove plants from Layout.")) return;
        setRotationHistory(prev => {
          const next = { ...prev };
          delete next[selectedBed];
          return next;
        });
        setSolveMsg("History cleared for this bed.");
      };

      const clearAllHistory = () => {
        if (!confirm("Clear ALL rotation history on every bed? Use this if sample/demo years were showing as conflicts.")) return;
        setRotationHistory({});
        setSolveMsg("All rotation history cleared. Conflicts only appear after you tap Log Season.");
      };

      // Families currently in a bed (from live layout)
      const currentFamiliesForBed = (bedId) => {
        const plants = placed.filter(p => p.bed === bedId).map(p => getPlant(p.plant)).filter(Boolean);
        return [...new Set(plants.map(p => p.family))];
      };

      // Recent families from history (last N years)
      const recentFamilies = (bedId, years = ROTATION_YEARS) => {
        const hist = rotationHistory[bedId] || [];
        const cutoff = currentYear - years;
        const fams = new Set();
        hist.filter(h => h.year >= cutoff && h.loggedAt).forEach(h => {
          (h.families || []).forEach(f => fams.add(f));
        });
        return [...fams];
      };

      // Suggested plants that avoid recent families for a bed
      const suggestionsForBed = (bedId) => {
        const recent = recentFamilies(bedId);
        const current = currentFamiliesForBed(bedId);
        const avoid = new Set([...recent, ...current]);
        return PLANT_LIBRARY
          .filter(p => p.family !== "Ericaceae") // skip long-term perennials for annual rotation advice
          .filter(p => !avoid.has(p.family))
          .map(p => ({
            ...p,
            reason: recent.length
              ? `Avoids recent ${recent.map(f => PLANT_LIBRARY.find(x => x.family === f)?.familyName || f).filter((v,i,a)=>a.indexOf(v)===i).join(", ")}`
              : "No recent history – any family is fine"
          }));
      };

      const logCurrentSeason = () => {
        const next = { ...rotationHistory };
        bedList.forEach(bed => {
          const bedPlants = placed.filter(p => p.bed === bed.id);
          if (bedPlants.length === 0) return;
          const plantIds = [...new Set(bedPlants.map(p => p.plant))];
          const families = [...new Set(plantIds.map(id => getPlant(id)?.family).filter(Boolean))];
          const entry = {
            year: currentYear,
            plants: plantIds,
            families,
            loggedAt: new Date().toISOString()
          };
          const existing = next[bed.id] || [];
          // Replace same-year entry if exists, else prepend
          const filtered = existing.filter(h => h.year !== currentYear);
          next[bed.id] = [entry, ...filtered].slice(0, 8); // keep last 8 seasons
        });
        setRotationHistory(next);
        setShowLogConfirm(false);
      };

      /** Move conflict plants to a bed where their family was not grown recently */
      const solveConflicts = () => {
        if (!setPlaced) return;
        const recent = recentFamilies(selectedBed);
        const movers = placed.filter(p => {
          if (p.bed !== selectedBed) return false;
          const fam = getPlant(p.plant)?.family;
          return fam && fam !== "Ericaceae" && recent.includes(fam);
        });
        if (!movers.length) {
          setSolveMsg("No conflicting plantings to move on this bed.");
          return;
        }
        const moves = [];
        const stillStuck = [];
        setPlaced(prev => {
          let next = [...prev];
          movers.forEach(m => {
            const fam = getPlant(m.plant)?.family;
            const target = bedList.find(b => {
              if (b.id === selectedBed) return false;
              const r = recentFamilies(b.id);
              return fam && !r.includes(fam);
            });
            if (target) {
              next = next.map(p => p.id === m.id ? { ...p, bed: target.id, rotationSolved: true } : p);
              moves.push({ plant: m.plant, to: target.name });
            } else {
              stillStuck.push(m.plant);
            }
          });
          return next;
        });
        let msg = moves.length
          ? `Moved ${moves.length} planting(s): ` + moves.map(x => {
              const n = getPlant(x.plant)?.name || x.plant;
              return `${n} → ${x.to}`;
            }).join("; ")
          : "Could not auto-place conflicts.";
        if (stillStuck.length) {
          msg += ` Still need a free bed for: ${stillStuck.map(id => getPlant(id)?.name || id).join(", ")}. Add a bed or pick a different crop.`;
        }
        setSolveMsg(msg);
      };

      const bedHistory = rotationHistory[selectedBed] || [];
      const bedSuggestions = suggestionsForBed(selectedBed);
      const bedCurrentFams = currentFamiliesForBed(selectedBed);
      const bedRecentFams = recentFamilies(selectedBed);

      // Check if current layout has rotation conflicts
      const hasConflict = bedCurrentFams.some(f => bedRecentFams.includes(f) && f !== "Ericaceae");

      return (
        <div className="pb-24">
          <Header
            title="Crop Rotation"
            right={
              <button
                onClick={() => setShowLogConfirm(true)}
                className="text-xs bg-sage-600 text-white px-2.5 py-1.5 rounded-lg font-medium"
              >
                Log Season
              </button>
            }
          />

          <div className="px-4 pt-4 space-y-4">
            {/* Intro */}
            <div className="bg-white rounded-2xl p-3 card-shadow text-xs text-sage-600">
              Avoid planting the same plant family in a bed for {ROTATION_YEARS}+ years.
              This reduces disease and nutrient imbalance.
              <span className="block mt-1 text-sage-500">
                Conflicts only use seasons you logged with <strong>Log Season</strong> — not plants sitting in Layout this year, and not sample data.
              </span>
            </div>

            {/* Bed selector */}
            <div className="flex gap-2 overflow-x-auto pb-1">
              {bedList.map(bed => (
                <button
                  key={bed.id}
                  onClick={() => { setSelectedBed(bed.id); setSolveMsg(""); }}
                  className={`px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition ${
                    selectedBed === bed.id
                      ? "bg-sage-600 text-white"
                      : "bg-white text-sage-600 card-shadow"
                  }`}
                >
                  {bed.name}
                </button>
              ))}
            </div>

            {/* Status card for selected bed */}
            <div className={`rounded-2xl p-4 card-shadow ${hasConflict ? "bg-amber-50 border border-amber-200" : "bg-white"}`}>
              <div className="flex justify-between items-start mb-2">
                <h3 className="font-semibold text-sage-800">
                  {bedList.find(b => b.id === selectedBed)?.name}
                </h3>
                {hasConflict ? (
                  <span className="text-[10px] bg-amber-200 text-amber-800 px-2 py-0.5 rounded-full font-medium">
                    ⚠ Rotation conflict
                  </span>
                ) : (
                  <span className="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-medium">
                    ✓ Looking good
                  </span>
                )}
              </div>
              {hasConflict && (
                <div className="mb-3">
                  <p className="text-xs text-amber-900 mb-2">
                    Same plant family was here within the last {ROTATION_YEARS} years. Solve moves those plantings to a safer bed.
                  </p>
                  <button
                    type="button"
                    onClick={solveConflicts}
                    className="w-full py-2 rounded-xl bg-amber-600 text-white text-sm font-semibold"
                  >
                    Solve conflicts
                  </button>
                  {solveMsg && (
                    <p className="text-[10px] text-sage-700 mt-2 bg-white/80 rounded-lg px-2 py-1.5">{solveMsg}</p>
                  )}
                </div>
              )}
              {!hasConflict && solveMsg && (
                <p className="text-[10px] text-sage-600 mb-2 bg-sage-50 rounded-lg px-2 py-1.5">{solveMsg}</p>
              )}

              <p className="text-xs text-sage-500 mb-2">This season (from Layout)</p>
              <div className="flex flex-wrap gap-1.5 mb-3">
                {bedCurrentFams.length === 0 ? (
                  <span className="text-xs text-sage-400">Empty – add plants in Layout</span>
                ) : (
                  bedCurrentFams.map(f => {
                    const sample = PLANT_LIBRARY.find(p => p.family === f);
                    return (
                      <span key={f} className={`text-[10px] px-2 py-0.5 rounded-full ${FAMILY_COLORS[f] || "bg-sage-100"}`}>
                        {sample?.familyName || f}
                      </span>
                    );
                  })
                )}
              </div>

              <p className="text-xs text-sage-500 mb-1">Recent families (last {ROTATION_YEARS} yrs)</p>
              <div className="flex flex-wrap gap-1.5">
                {bedRecentFams.length === 0 ? (
                  <span className="text-xs text-sage-400">No history yet – log a season</span>
                ) : (
                  bedRecentFams.map(f => {
                    const sample = PLANT_LIBRARY.find(p => p.family === f);
                    return (
                      <span key={f} className={`text-[10px] px-2 py-0.5 rounded-full ${FAMILY_COLORS[f] || "bg-sage-100"}`}>
                        {sample?.familyName || f}
                      </span>
                    );
                  })
                )}
              </div>
            </div>

            {/* History timeline */}
            <div className="bg-white rounded-2xl p-4 card-shadow">
              <div className="flex items-center justify-between mb-3">
                <h3 className="font-semibold text-sage-800 text-sm">History</h3>
                <div className="flex gap-2">
                  <button type="button" onClick={clearBedHistory} className="text-[10px] text-sage-500 font-medium">Clear bed</button>
                  <button type="button" onClick={clearAllHistory} className="text-[10px] text-sage-500 font-medium">Clear all</button>
                </div>
              </div>
              {bedHistory.length === 0 ? (
                <p className="text-xs text-sage-400 text-center py-4">
                  No seasons logged yet.<br />Use “Log Season” after planting.
                </p>
              ) : (
                <div className="space-y-3">
                  {bedHistory.map((h, i) => (
                    <div key={i} className="flex gap-3">
                      <div className="flex flex-col items-center">
                        <div className="w-2.5 h-2.5 rounded-full bg-sage-500 mt-1"></div>
                        {i < bedHistory.length - 1 && <div className="w-0.5 flex-1 bg-sage-200 my-1"></div>}
                      </div>
                      <div className="pb-2 flex-1">
                        <p className="text-sm font-medium text-sage-800">{h.year}</p>
                        <div className="flex flex-wrap gap-1 mt-1">
                          {(h.plants || []).map(pid => {
                            const pl = getPlant(pid);
                            return pl ? (
                              <span key={pid} className="text-xs bg-sage-50 px-1.5 py-0.5 rounded">
                                {pl.icon} {pl.name}
                              </span>
                            ) : null;
                          })}
                        </div>
                        <div className="flex flex-wrap gap-1 mt-1">
                          {(h.families || []).map(f => {
                            const sample = PLANT_LIBRARY.find(p => p.family === f);
                            return (
                              <span key={f} className={`text-[9px] px-1.5 py-0.5 rounded ${FAMILY_COLORS[f] || "bg-gray-100"}`}>
                                {sample?.familyName || f}
                              </span>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Suggestions */}
            <div className="bg-white rounded-2xl p-4 card-shadow">
              <h3 className="font-semibold text-sage-800 text-sm mb-2">
                Good next crops for this bed
              </h3>
              <p className="text-[10px] text-sage-500 mb-3">
                Plants whose families haven’t been here in the last {ROTATION_YEARS} years
              </p>
              {bedSuggestions.length === 0 ? (
                <p className="text-xs text-sage-400">All families recently used – consider a cover crop or rest the bed.</p>
              ) : (
                <div className="space-y-2">
                  {bedSuggestions.slice(0, 6).map(s => (
                    <div key={s.id} className="flex items-center gap-3 bg-sage-50 rounded-xl p-2.5">
                      <span className="text-2xl">{s.icon}</span>
                      <div className="flex-1 min-w-0">
                        <p className="font-medium text-sm text-sage-800">{s.name}</p>
                        <p className="text-[10px] text-sage-500 truncate">{s.reason}</p>
                      </div>
                      <span className={`text-[9px] px-1.5 py-0.5 rounded ${FAMILY_COLORS[s.family]}`}>
                        {s.familyName}
                      </span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Family legend */}
            <div className="bg-sage-100 rounded-xl p-3">
              <p className="text-xs font-semibold text-sage-700 mb-2">Plant Families</p>
              <div className="flex flex-wrap gap-1.5">
                {Object.entries(FAMILY_COLORS).map(([fam, cls]) => {
                  const sample = PLANT_LIBRARY.find(p => p.family === fam);
                  return (
                    <span key={fam} className={`text-[10px] px-2 py-0.5 rounded-full ${cls}`}>
                      {sample?.familyName || fam}
                    </span>
                  );
                })}
              </div>
            </div>
          </div>

          {/* Log confirm modal */}
          {showLogConfirm && (
            <div className="fixed inset-0 bg-black/40 z-[100] flex items-end sm:items-center justify-center px-4 pt-4 pb-24">
              <div className="bg-white rounded-2xl p-5 w-full max-w-sm card-shadow">
                <h3 className="font-semibold text-sage-800 mb-2">Log {currentYear} season?</h3>
                <p className="text-xs text-sage-600 mb-4">
                  This will record the plants currently in each bed as this year’s planting for rotation tracking.
                  Existing {currentYear} entries will be replaced.
                </p>
                <div className="flex gap-2">
                  <button
                    onClick={() => setShowLogConfirm(false)}
                    className="flex-1 py-2.5 rounded-xl border border-sage-200 text-sage-600 text-sm font-medium"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={logCurrentSeason}
                    className="flex-1 py-2.5 rounded-xl bg-sage-600 text-white text-sm font-medium"
                  >
                    Log Season
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function DiagnosticScreen({ tasks, setTasks }) {
      const [step, setStep] = useState(1); // 1=plant, 2=symptoms, 3=context, 4=results
      const [selectedPlant, setSelectedPlant] = useState(null); // plant id or "unknown"
      const [selectedSymptoms, setSelectedSymptoms] = useState([]);
      const [context, setContext] = useState({
        watering: "normal", // dry | normal | wet
        recentRain: false,
        newGrowth: false,
      });
      const [results, setResults] = useState([]);

      const toggleSymptom = (id) => {
        setSelectedSymptoms(prev =>
          prev.includes(id) ? prev.filter(s => s !== id) : [...prev, id]
        );
      };

      const scoreProblems = () => {
        const scored = PROBLEMS.map(problem => {
          // Plant relevance
          let plantBoost = 1;
          if (selectedPlant && selectedPlant !== "unknown") {
            if (problem.plants.length > 0 && !problem.plants.includes(selectedPlant)) {
              plantBoost = 0.35; // still possible but less likely
            } else if (problem.plants.includes(selectedPlant)) {
              plantBoost = 1.25;
            }
          }

          // Symptom evidence
          let evidence = 0;
          let maxPossible = 0;
          const matched = [];
          Object.entries(problem.symptoms).forEach(([symId, weight]) => {
            maxPossible += weight;
            if (selectedSymptoms.includes(symId)) {
              evidence += weight;
              matched.push(symId);
            }
          });

          // Context adjustments
          let contextMod = 1;
          if (problem.id === "spider_mites" && context.watering === "dry") contextMod += 0.2;
          if (problem.id === "overwatering" && context.watering === "wet") contextMod += 0.35;
          if (problem.id === "underwatering" && context.watering === "dry") contextMod += 0.35;
          if (problem.id === "early_blight" && context.recentRain) contextMod += 0.15;
          if (problem.id === "powdery_mildew" && context.recentRain) contextMod += 0.1;
          if ((problem.id === "aphids" || problem.id === "spider_mites") && context.newGrowth) contextMod += 0.1;

          const rawScore = maxPossible > 0 ? (evidence / maxPossible) * plantBoost * contextMod : 0;
          // Require at least some evidence
          const finalScore = evidence === 0 ? 0 : Math.min(1, rawScore);

          return {
            ...problem,
            score: finalScore,
            evidence,
            matchedSymptoms: matched,
            confidence: finalScore >= 0.7 ? "High" : finalScore >= 0.4 ? "Medium" : finalScore > 0 ? "Low" : "None",
          };
        })
        .filter(p => p.score > 0.15)
        .sort((a, b) => b.score - a.score);

        setResults(scored);
        setStep(4);
      };

      const addTreatmentTask = (problem) => {
        const newTask = {
          id: Date.now(),
          title: `Treat ${problem.name}`,
          detail: problem.organic[0] || "Follow organic treatment steps",
          done: false,
          icon: "🩺",
        };
        setTasks(prev => [newTask, ...prev]);
        alert(`Task added: "${newTask.title}"`);
      };

      const reset = () => {
        setStep(1);
        setSelectedPlant(null);
        setSelectedSymptoms([]);
        setContext({ watering: "normal", recentRain: false, newGrowth: false });
        setResults([]);
      };

      return (
        <div className="pb-24">
          <Header
            title="Plant Diagnose"
            right={
              step > 1 ? (
                <button onClick={reset} className="text-xs text-sage-600 font-medium">
                  Start over
                </button>
              ) : null
            }
          />

          <div className="px-4 pt-4 space-y-4">
            {/* Progress */}
            <div className="flex gap-1">
              {[1, 2, 3, 4].map(s => (
                <div
                  key={s}
                  className={`h-1.5 flex-1 rounded-full ${step >= s ? "bg-sage-600" : "bg-sage-200"}`}
                />
              ))}
            </div>

            {/* Step 1: Plant */}
            {step === 1 && (
              <div className="bg-white rounded-2xl p-4 card-shadow">
                <h3 className="font-semibold text-sage-800 mb-1">Which plant is affected?</h3>
                <p className="text-xs text-sage-500 mb-3">Improves accuracy of the diagnosis</p>
                <div className="grid grid-cols-4 gap-2 mb-3">
                  {PLANT_LIBRARY.map(p => (
                    <button
                      key={p.id}
                      onClick={() => setSelectedPlant(p.id)}
                      className={`rounded-xl p-2 text-center transition ${
                        selectedPlant === p.id
                          ? "ring-2 ring-sage-600 bg-sage-50"
                          : "bg-sage-50 hover:bg-sage-100"
                      }`}
                    >
                      <div className="text-2xl">{p.icon}</div>
                      <p className="text-[10px] font-medium leading-tight mt-0.5">{p.name}</p>
                    </button>
                  ))}
                </div>
                <button
                  onClick={() => setSelectedPlant("unknown")}
                  className={`w-full py-2.5 rounded-xl text-sm font-medium mb-4 ${
                    selectedPlant === "unknown"
                      ? "bg-sage-600 text-white"
                      : "bg-sage-100 text-sage-700"
                  }`}
                >
                  Not sure / Other plant
                </button>
                <button
                  disabled={!selectedPlant}
                  onClick={() => setStep(2)}
                  className={`w-full py-3 rounded-xl font-medium ${
                    selectedPlant
                      ? "bg-sage-600 text-white"
                      : "bg-sage-200 text-sage-400 cursor-not-allowed"
                  }`}
                >
                  Next: Symptoms →
                </button>
              </div>
            )}

            {/* Step 2: Symptoms */}
            {step === 2 && (
              <div className="bg-white rounded-2xl p-4 card-shadow">
                <h3 className="font-semibold text-sage-800 mb-1">What do you see?</h3>
                <p className="text-xs text-sage-500 mb-3">Select all that apply</p>
                <div className="grid grid-cols-2 gap-2 mb-4">
                  {SYMPTOMS.map(s => {
                    const active = selectedSymptoms.includes(s.id);
                    return (
                      <button
                        key={s.id}
                        onClick={() => toggleSymptom(s.id)}
                        className={`flex items-center gap-2 p-2.5 rounded-xl text-left text-sm transition ${
                          active
                            ? "bg-sage-600 text-white"
                            : "bg-sage-50 text-sage-700 hover:bg-sage-100"
                        }`}
                      >
                        <span className="text-lg">{s.icon}</span>
                        <span className="leading-tight text-xs font-medium">{s.label}</span>
                      </button>
                    );
                  })}
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={() => setStep(1)}
                    className="flex-1 py-3 rounded-xl border border-sage-200 text-sage-600 font-medium"
                  >
                    Back
                  </button>
                  <button
                    disabled={selectedSymptoms.length === 0}
                    onClick={() => setStep(3)}
                    className={`flex-1 py-3 rounded-xl font-medium ${
                      selectedSymptoms.length > 0
                        ? "bg-sage-600 text-white"
                        : "bg-sage-200 text-sage-400 cursor-not-allowed"
                    }`}
                  >
                    Next →
                  </button>
                </div>
              </div>
            )}

            {/* Step 3: Context */}
            {step === 3 && (
              <div className="bg-white rounded-2xl p-4 card-shadow space-y-4">
                <div>
                  <h3 className="font-semibold text-sage-800 mb-1">A bit more context</h3>
                  <p className="text-xs text-sage-500">Optional but improves results</p>
                </div>

                <div>
                  <p className="text-xs font-medium text-sage-700 mb-2">Soil moisture lately</p>
                  <div className="flex gap-2">
                    {[
                      { id: "dry", label: "Mostly dry" },
                      { id: "normal", label: "Normal" },
                      { id: "wet", label: "Often wet" },
                    ].map(o => (
                      <button
                        key={o.id}
                        onClick={() => setContext(c => ({ ...c, watering: o.id }))}
                        className={`flex-1 py-2 rounded-xl text-xs font-medium ${
                          context.watering === o.id
                            ? "bg-sage-600 text-white"
                            : "bg-sage-50 text-sage-600"
                        }`}
                      >
                        {o.label}
                      </button>
                    ))}
                  </div>
                </div>

                <label className="flex items-center gap-3 p-3 bg-sage-50 rounded-xl cursor-pointer">
                  <input
                    type="checkbox"
                    checked={context.recentRain}
                    onChange={e => setContext(c => ({ ...c, recentRain: e.target.checked }))}
                    className="w-4 h-4 accent-sage-600"
                  />
                  <span className="text-sm text-sage-700">Recent rain or high humidity</span>
                </label>

                <label className="flex items-center gap-3 p-3 bg-sage-50 rounded-xl cursor-pointer">
                  <input
                    type="checkbox"
                    checked={context.newGrowth}
                    onChange={e => setContext(c => ({ ...c, newGrowth: e.target.checked }))}
                    className="w-4 h-4 accent-sage-600"
                  />
                  <span className="text-sm text-sage-700">Symptoms mainly on new growth</span>
                </label>

                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => setStep(2)}
                    className="flex-1 py-3 rounded-xl border border-sage-200 text-sage-600 font-medium"
                  >
                    Back
                  </button>
                  <button
                    onClick={scoreProblems}
                    className="flex-1 py-3 rounded-xl bg-sage-600 text-white font-medium"
                  >
                    See diagnosis →
                  </button>
                </div>
              </div>
            )}

            {/* Step 4: Results */}
            {step === 4 && (
              <div className="space-y-3">
                <div className="bg-white rounded-2xl p-4 card-shadow">
                  <h3 className="font-semibold text-sage-800 mb-1">Likely causes</h3>
                  <p className="text-xs text-sage-500">
                    {selectedPlant && selectedPlant !== "unknown"
                      ? `For ${PLANT_LIBRARY.find(p => p.id === selectedPlant)?.name}`
                      : "General garden plants"}{" "}
                    · {selectedSymptoms.length} symptom{selectedSymptoms.length !== 1 ? "s" : ""}
                  </p>
                </div>

                {results.length === 0 ? (
                  <div className="bg-white rounded-2xl p-6 card-shadow text-center">
                    <p className="text-3xl mb-2">🤔</p>
                    <p className="font-medium text-sage-800">No strong match</p>
                    <p className="text-xs text-sage-500 mt-1">
                      Try selecting more symptoms or different ones. When in doubt, check watering and look under leaves for pests.
                    </p>
                    <button
                      onClick={() => setStep(2)}
                      className="mt-4 px-4 py-2 bg-sage-600 text-white rounded-xl text-sm font-medium"
                    >
                      Adjust symptoms
                    </button>
                  </div>
                ) : (
                  results.map((r, idx) => (
                    <div key={r.id} className="bg-white rounded-2xl p-4 card-shadow">
                      <div className="flex items-start gap-3 mb-2">
                        <span className="text-3xl">{r.icon}</span>
                        <div className="flex-1">
                          <div className="flex items-center gap-2 flex-wrap">
                            <h4 className="font-semibold text-sage-800">{r.name}</h4>
                            <span className={`text-[10px] px-1.5 py-0.5 rounded-full font-medium ${
                              r.confidence === "High" ? "bg-green-100 text-green-700" :
                              r.confidence === "Medium" ? "bg-amber-100 text-amber-700" :
                              "bg-sage-100 text-sage-600"
                            }`}>
                              {r.confidence}
                            </span>
                            <span className="text-[10px] bg-sage-100 text-sage-600 px-1.5 py-0.5 rounded-full">
                              {r.type}
                            </span>
                          </div>
                          <p className="text-xs text-sage-500 mt-1">{r.description}</p>
                        </div>
                        <span className="text-sm font-bold text-sage-600">
                          {Math.round(r.score * 100)}%
                        </span>
                      </div>

                      <div className="mt-3">
                        <p className="text-xs font-semibold text-sage-700 mb-1.5">Organic treatment</p>
                        <ol className="list-decimal list-inside space-y-1">
                          {r.organic.map((step, i) => (
                            <li key={i} className="text-xs text-sage-600">{step}</li>
                          ))}
                        </ol>
                      </div>

                      <p className="text-[10px] text-sage-400 mt-2">
                        <span className="font-medium">Prevent:</span> {r.prevent}
                      </p>

                      <button
                        onClick={() => addTreatmentTask(r)}
                        className="mt-3 w-full py-2 rounded-xl bg-sage-100 text-sage-700 text-xs font-medium hover:bg-sage-200 transition"
                      >
                        + Add treatment task
                      </button>
                    </div>
                  ))
                )}

                <button
                  onClick={reset}
                  className="w-full py-3 rounded-xl border border-sage-200 text-sage-600 font-medium text-sm"
                >
                  Diagnose another plant
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ========== APP ==========
    function App() {
      const [active, setActive] = useState("home");
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem("pp_tasks");
        return saved ? JSON.parse(saved) : INITIAL_TASKS;
      });
      const [seeds, setSeeds] = useState(() => {
        const saved = localStorage.getItem("pp_seeds");
        return saved ? JSON.parse(saved) : INITIAL_SEEDS;
      });
      const [placed, setPlaced] = useState(() => {
        const saved = localStorage.getItem("pp_placed");
        return saved ? JSON.parse(saved) : [
          { id: 1, bed: "tomato", plant: "tomato", plantedAt: toISODate(addDays(new Date(), -20)), status: "growing" },
          { id: 2, bed: "tomato", plant: "basil", plantedAt: toISODate(addDays(new Date(), -14)), status: "growing" },
          { id: 3, bed: "tomato", plant: "marigold", plantedAt: toISODate(addDays(new Date(), -10)), status: "growing" },
          { id: 4, bed: "herb", plant: "lavender", plantedAt: toISODate(addDays(new Date(), -40)), status: "growing" },
          { id: 5, bed: "herb", plant: "basil", plantedAt: toISODate(addDays(new Date(), -12)), status: "growing" },
          { id: 6, bed: "pepper", plant: "pepper", plantedAt: toISODate(addDays(new Date(), -18)), status: "growing" },
          { id: 7, bed: "berry", plant: "blueberry", plantedAt: toISODate(addDays(new Date(), -100)), status: "growing" },
        ];
      });
      const [rotationHistory, setRotationHistory] = useState(() => {
        // Only seasons the user logged (have loggedAt). Old demo 2024/2025 sample history is dropped.
        try {
          const saved = localStorage.getItem("pp_rotation");
          const parsed = saved ? JSON.parse(saved) : {};
          const next = {};
          Object.entries(parsed || {}).forEach(([bedId, arr]) => {
            const real = (arr || []).filter(h => h && h.loggedAt);
            if (real.length) next[bedId] = real;
          });
          return next;
        } catch {
          return {};
        }
      });
      const [profile, setProfile] = useState(() => {
        const saved = localStorage.getItem("pp_profile");
        return saved ? JSON.parse(saved) : { onboarded: false, city: "", zone: "", lastFrost: "", firstFrost: "" };
      });
      const [journal, setJournal] = useState(() => {
        const saved = localStorage.getItem("pp_journal");
        return saved ? JSON.parse(saved) : [];
      });
      const [customPlants, setCustomPlants] = useState(() => {
        const saved = localStorage.getItem("pp_custom_plants");
        const list = saved ? JSON.parse(saved) : [];
        syncCustomPlantsLive(list);
        return list;
      });
      const [beds, setBeds] = useState(() => {
        const saved = localStorage.getItem("pp_beds");
        return saved ? JSON.parse(saved) : DEFAULT_BEDS;
      });
      const [planYear, setPlanYear] = useState(() => new Date().getFullYear());
      const [harvests, setHarvests] = useState(() => {
        const saved = localStorage.getItem("pp_harvests");
        return saved ? JSON.parse(saved) : [];
      });
      const [showOnboarding, setShowOnboarding] = useState(() => {
        try {
          const saved = localStorage.getItem("pp_profile");
          const p = saved ? JSON.parse(saved) : null;
          return !p?.onboarded;
        } catch { return true; }
      });

      useEffect(() => { localStorage.setItem("pp_tasks", JSON.stringify(tasks)); }, [tasks]);
      useEffect(() => { localStorage.setItem("pp_seeds", JSON.stringify(seeds)); }, [seeds]);
      useEffect(() => { localStorage.setItem("pp_placed", JSON.stringify(placed)); }, [placed]);
      useEffect(() => { localStorage.setItem("pp_rotation", JSON.stringify(rotationHistory)); }, [rotationHistory]);
      useEffect(() => { localStorage.setItem("pp_profile", JSON.stringify(profile)); }, [profile]);
      useEffect(() => { localStorage.setItem("pp_journal", JSON.stringify(journal)); }, [journal]);
      useEffect(() => {
        syncCustomPlantsLive(customPlants);
        localStorage.setItem("pp_custom_plants", JSON.stringify(customPlants));
      }, [customPlants]);
      useEffect(() => { localStorage.setItem("pp_beds", JSON.stringify(beds)); }, [beds]);
      useEffect(() => { localStorage.setItem("pp_harvests", JSON.stringify(harvests)); }, [harvests]);

      const DEMO_PLACED = [
        { id: 1, bed: "tomato", plant: "tomato", plantedAt: toISODate(addDays(new Date(), -20)), status: "growing" },
        { id: 2, bed: "tomato", plant: "basil", plantedAt: toISODate(addDays(new Date(), -14)), status: "growing" },
        { id: 3, bed: "tomato", plant: "marigold", plantedAt: toISODate(addDays(new Date(), -10)), status: "growing" },
        { id: 4, bed: "herb", plant: "lavender", plantedAt: toISODate(addDays(new Date(), -40)), status: "growing" },
        { id: 5, bed: "herb", plant: "basil", plantedAt: toISODate(addDays(new Date(), -12)), status: "growing" },
        { id: 6, bed: "pepper", plant: "pepper", plantedAt: toISODate(addDays(new Date(), -18)), status: "growing" },
        { id: 7, bed: "berry", plant: "blueberry", plantedAt: toISODate(addDays(new Date(), -100)), status: "growing" },
      ];

      const exportData = () => {
        const payload = {
          exportedAt: new Date().toISOString(),
          profile, tasks, seeds, placed, rotationHistory, journal, customPlants, beds, harvests, planYear,
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `plotpilot-backup-${toISODate(new Date())}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const importData = (file) => {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            if (data.profile) setProfile(data.profile);
            if (data.tasks) setTasks(data.tasks);
            if (data.seeds) setSeeds(data.seeds);
            if (data.placed) setPlaced(data.placed);
            if (data.rotationHistory) setRotationHistory(data.rotationHistory);
            if (data.journal) setJournal(data.journal);
            if (data.customPlants) setCustomPlants(data.customPlants);
            if (data.beds) setBeds(data.beds);
            if (data.harvests) setHarvests(data.harvests);
            alert("Backup imported.");
          } catch (err) {
            alert("Could not read that backup file.");
          }
        };
        reader.readAsText(file);
      };

      const clearGarden = () => {
        setPlaced([]);
        setTasks([]);
        setJournal([]);
        setSeeds([]);
      };

      const resetDemo = () => {
        setPlaced(DEMO_PLACED);
        setTasks(INITIAL_TASKS);
        setSeeds(INITIAL_SEEDS);
        setJournal([]);
      };

      return (
        <div className="min-h-screen bg-sage-100 lg:bg-sage-200/50">
          <SideNav active={active} setActive={setActive} profile={profile} />
          <div className="lg:pl-56 xl:pl-64 min-h-screen">
            <div className="min-h-screen max-w-lg lg:max-w-6xl xl:max-w-7xl mx-auto bg-sage-50 lg:bg-sage-50 lg:shadow-sm lg:min-h-screen relative">
          {showOnboarding && (
            <OnboardingModal
              profile={profile}
              setProfile={setProfile}
              onDone={() => setShowOnboarding(false)}
              onStartEmpty={clearGarden}
              onStartDemo={resetDemo}
            />
          )}
          {active === "home" && (
            <Dashboard
              tasks={tasks}
              setTasks={setTasks}
              seeds={seeds}
              placed={placed}
              setActive={setActive}
              journal={journal}
              customPlants={customPlants}
              profile={profile}
              rotationHistory={rotationHistory}
              beds={beds}
            />
          )}
          {active === "plan" && (
            <PlanScreen
              profile={profile}
              planYear={planYear}
              setPlanYear={setPlanYear}
              placed={placed}
              setPlaced={setPlaced}
              beds={beds}
              setBeds={setBeds}
              harvests={harvests}
              setHarvests={setHarvests}
              setTasks={setTasks}
              seeds={seeds}
              setSeeds={setSeeds}
              rotationHistory={rotationHistory}
              customPlants={customPlants}
            />
          )}
          {active === "kitchen" && (
            <KitchenScreen
              profile={profile}
              planYear={planYear}
              setPlanYear={setPlanYear}
              placed={placed}
              setPlaced={setPlaced}
              beds={beds}
              setTasks={setTasks}
              setSeeds={setSeeds}
              setActive={setActive}
            />
          )}
          {active === "layout" && (
            <LayoutPlanner
              placed={placed}
              setPlaced={setPlaced}
              setTasks={setTasks}
              beds={beds}
              setBeds={setBeds}
              planYear={planYear}
              seeds={seeds}
              setSeeds={setSeeds}
              customPlants={customPlants}
              setCustomPlants={setCustomPlants}
            />
          )}
          {active === "rotate" && (
            <CropRotationScreen
              placed={placed}
              setPlaced={setPlaced}
              rotationHistory={rotationHistory}
              setRotationHistory={setRotationHistory}
              beds={beds}
            />
          )}
          {active === "diagnose" && <DiagnosticScreen tasks={tasks} setTasks={setTasks} />}
          {active === "vault" && (
            <SeedVault
              seeds={seeds}
              setSeeds={setSeeds}
              placed={placed}
              harvests={harvests}
              customPlants={customPlants}
              profile={profile}
              setProfile={setProfile}
              beds={beds}
            />
          )}
          {active === "calendar" && <CalendarScreen profile={profile} placed={placed} tasks={tasks} />}
          {active === "plants" && <PlantsScreen customPlants={customPlants} setCustomPlants={setCustomPlants} />}
          {active === "journal" && <JournalScreen journal={journal} setJournal={setJournal} placed={placed} beds={beds} />}
          {active === "settings" && (
            <SettingsScreen
              profile={profile}
              setProfile={setProfile}
              setShowOnboarding={setShowOnboarding}
              exportData={exportData}
              importData={importData}
              resetDemo={resetDemo}
              clearGarden={clearGarden}
            />
          )}
          {active === "more" && (
            <MoreScreen setActive={setActive} profile={profile} exportData={exportData} />
          )}
          <BottomNav active={active} setActive={setActive} profile={profile} />
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>

  <!-- Register service worker for offline / installable PWA -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((err) => {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
